<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נשימה · Brass App</title>
<meta name="theme-color" content="#bfe4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brass App">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --ink: #15181d;
    --muted: #56616f;
    --line: rgba(21, 24, 29, .14);
    --panel: rgba(255, 255, 255, .92);
    --go: #1b8f58;
    --accent: #1a7fe2;
    --display: "Rubik", "Lexend", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--display); color: var(--ink); background: linear-gradient(180deg, #bfe4ff 0%, #e8f4ff 55%, #fff4e3 100%) fixed; overflow: hidden; }
  /* Evening falls as the village lights up. */
  .sky { position: fixed; inset: 0; opacity: 0; transition: opacity 2s; }
  #dusk { background: linear-gradient(180deg, #6f7fc9 0%, #b79bd0 55%, #f6c3a0 100%); }
  #night { background: linear-gradient(180deg, #0c1638 0%, #1d2b5e 60%, #3b3f7a 100%); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--accent); border-radius: 12px; }

  .app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

  .console { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px clamp(12px, 3vw, 28px); background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .console a { color: var(--muted); text-decoration: none; }
  .spacer { margin-inline-start: auto; }
  .seg { display: inline-flex; background: #eef2f7; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg-btn { border: 0; background: transparent; min-height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .seg-btn[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(21, 24, 29, .18); }
  .icon-btn { background: #fff; border: 1px solid var(--line); border-radius: 10px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; font-size: 18px; }
  .mic { cursor: pointer; }
  .mic[hidden] { display: none; }
  .mic-dot { width: 12px; height: 12px; border-radius: 50%; background: #c3ccd8; display: inline-block; vertical-align: -1px; }
  .mic-dot.on { background: var(--go); }

  .stage { position: relative; min-height: 0; overflow: hidden; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .scene { width: 100%; height: 100%; display: block; direction: ltr; }

  /* The cue: one word and the count, big enough for the back of the room. */
  .cue { position: absolute; top: 2vh; inset-inline: 0; display: flex; justify-content: center; pointer-events: none; }
  .cue-box { display: flex; align-items: baseline; gap: .5em; background: rgba(255, 255, 255, .9); border-radius: 28px; padding: .15em .7em; box-shadow: 0 2px 10px rgba(21, 24, 29, .12); }
  .cue-word { font-weight: 800; font-size: clamp(30px, 8vh, 96px); line-height: 1.15; }
  .cue-count { font-weight: 900; font-size: clamp(36px, 10vh, 120px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); min-width: 1ch; text-align: center; }
  .cue-count:empty { display: none; }
  .cue-word.small { font-size: clamp(22px, 5vh, 56px); font-weight: 600; color: var(--muted); }

  .diag { position: absolute; inset-inline-end: 10px; bottom: 10px; direction: rtl; text-align: right; background: rgba(13, 17, 23, .82); color: #d7e4f5; font-size: 13px; line-height: 1.6; padding: 8px 12px; border-radius: 10px; font-variant-numeric: tabular-nums; white-space: pre; }
  .diag[hidden] { display: none; }

  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 8px clamp(12px, 3vw, 28px) 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .tip { font-size: clamp(15px, 2.2vh, 20px); color: var(--ink); }
  kbd { font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }
</style>
</head>
<body>
<div class="sky" id="dusk"></div><div class="sky" id="night"></div>
<div class="app">
  <header class="console">
    <a href="index.html">‹ Brass App</a>
    <div class="seg" role="group" aria-label="כמה זמן נושפים">
      <span class="seg-btn" style="cursor:default;line-height:44px" aria-hidden="true">🌬️</span>
      <button id="lv1" class="seg-btn" aria-pressed="true" title="נושפים 4">4</button>
      <button id="lv2" class="seg-btn" aria-pressed="false" title="נושפים 8">8</button>
      <button id="lv3" class="seg-btn" aria-pressed="false" title="נושפים 12">12</button>
      <button id="lv4" class="seg-btn" aria-pressed="false" title="נושפים 16">16</button>
    </div>
    <span class="spacer"></span>
    <span class="mic" id="mic" hidden><span class="mic-dot" id="micDot"></span> <span id="micText">מיקרופון</span></span>
    <button id="soundBtn" class="icon-btn" title="צלילים (M)" aria-pressed="true">🔔</button>
    <button id="fullscreen" class="icon-btn" title="מסך מלא (F)">⛶</button>
  </header>

  <main class="stage" id="stage">
    <svg class="scene" id="scene" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="בלון, טחנת רוח וכפר"></svg>
    <div class="cue" aria-live="polite"><div class="cue-box"><span class="cue-word" id="cueWord"></span><span class="cue-count" id="cueCount"></span></div></div>
    <div class="diag" id="diag" hidden></div>
  </main>

  <footer class="transport">
    <span class="tip" id="tip"></span>
    <span class="spacer"></span>
    <span><kbd>Space</kbd> נשימה · <kbd>Esc</kbd> עצירה · <kbd>1</kbd>–<kbd>4</kbd> שלב · <kbd>N</kbd> ערב חדש</span>
  </footer>
</div>
<script>
"use strict";

/* ---------- iPad audio ----------
   Older iPads (Safari before 14.1) have no float sample reader: build it from the byte one.
   A suspended or interrupted iPad audio engine (lock screen, a call) wakes on any tap.
   Tapping the microphone status opens the microphone check (no keyboard needed). */
if (window.AnalyserNode && !AnalyserNode.prototype.getFloatTimeDomainData) {
  AnalyserNode.prototype.getFloatTimeDomainData = function (out) {
    const bytes = new Uint8Array(out.length);
    this.getByteTimeDomainData(bytes);
    for (let i = 0; i < out.length; i++) out[i] = (bytes[i] - 128) / 128;
  };
}
["touchend", "click"].forEach(type => document.addEventListener(type, () => {
  if (ctx && ctx.state !== "running" && ctx.state !== "closed") ctx.resume();
}, true));
document.getElementById("micText").parentElement.addEventListener("click", () => {
  const d = document.getElementById("diag");
  d.hidden = !d.hidden;
});
// iPad/iPhone: the raw microphone is too quiet for a horn at a normal distance (measured in class), so use
// the device's own voice processing and automatic volume. Elsewhere raw is louder than enough and purer.
// ?voice=1 / ?voice=0 forces either way. (iPadOS Safari calls itself a Mac; the touch points give it away.)
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const VOICE_PARAM = new URLSearchParams(location.search).get("voice");
const MIC_OPTIONS = (VOICE_PARAM === null ? IS_IOS : VOICE_PARAM !== "0") ? true
  : { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
// The check panel's first lines: is the engine moving, what the iPad says about the mic, the raw level in dB.
let lastEngineTime = -1, engineMovedAt = 0;
const audioLine = () => {
  if (!ctx) return "אודיו   —\n";
  if (ctx.currentTime !== lastEngineTime) { lastEngineTime = ctx.currentTime; engineMovedAt = performance.now(); }
  const moving = performance.now() - engineMovedAt < 500;     // the clock advances in bursts, not every frame
  const tr = micStream && micStream.getAudioTracks()[0];
  const st = tr && tr.getSettings ? tr.getSettings() : {};
  const db = state.rms > 0 ? (20 * Math.log10(state.rms)).toFixed(0) + " dB" : "0";
  return `אודיו   ${ctx.state} · ${ctx.sampleRate} · ${moving ? "זז" : "עומד"}\n` +
    `מיקרופון ${tr ? tr.readyState + (tr.muted ? " muted" : "") + (tr.enabled ? "" : " off") : "—"} · ${st.sampleRate || "?"} · ${MIC_OPTIONS === true ? "voice" : "raw"} ec:${st.echoCancellation} agc:${st.autoGainControl}\n` +
    `רמה    ${db}\n`;
};


/* ---------- Breathing ----------
   One press = one breath, and nothing starts by itself.
   Breathe in (4 counts): the balloon fills. Blow out (4, 8, 12 or 16 counts): the balloon empties at a steady
   rate, its air turns the windmill, and the windmill's power creeps along the cable to the next dark house,
   arriving exactly as the breath ends: that house lights up. Six houses, one per breath; when all are lit,
   night falls. No breath hold anywhere.
   The microphone is only a bonus: if it hears blowing, the windmill turns a little faster and the air
   sparkles. Silence never stops or slows anything. */

const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

const LEVELS = [4, 8, 12, 16];      // seconds of blowing out
const IN_S = 4;                     // breathing in is always a calm 4
const LIT_S = 1.6;                  // the house lights up, then everything waits for the next press
const HOUSES = 6;
const TIPS = ["יושבים זקוף, כתפיים רגועות", "לא עוצרים את האוויר: שואפים ומיד נושפים", "אוויר יציב, מההתחלה ועד הסוף", "מסחרר? עוצרים ונושמים רגיל"];
// Four sails: keep the spin under ~0.5 turns a second (2 sails a second), or it flickers on a projector.
const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SPIN = REDUCED_MOTION ? 0 : 1.9, SPIN_BONUS = REDUCED_MOTION ? 0 : 2.9;   // radians per second
const BLOW_DB = 10;                 // the mic hears blowing at this many decibels over the room
const ANALYSE_MS = 50;

const state = {
  level: 1, phase: "idle", phaseT: 0, lit: 0, tip: 0, sound: true,
  angle: 0, spin: 0, blowing: false, blowSince: 0,
  listening: false, rms: 0, noiseFloor: 0.002, muteUntil: 0, lastAnalyse: 0
};

/* ---------- Audio: gentle cues, and the optional microphone ---------- */

let ctx = null, analyser = null, micStream = null, raw = null, micAsked = false;

function ensureCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

// Two soft notes: rising for breathing in, falling for blowing out; a bright ding for a lit house.
function notes(list, gap = 0.16, vol = 0.09) {
  if (!state.sound) return;
  const c = ensureCtx(), t0 = c.currentTime + 0.03;
  list.forEach((hz, i) => {
    const o = c.createOscillator(), g = c.createGain(), t = t0 + i * gap;
    o.type = "sine"; o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 1);
  });
  state.muteUntil = performance.now() + 400 + list.length * gap * 1000 + 600;   // never hear ourselves as blowing
}

// Asked on the first breath, inside the tap. Refused or missing is fine: everything works without it.
async function startMic() {
  if (micAsked) return;
  micAsked = true;
  ensureCtx();
  const q = new URLSearchParams(location.search);
  if (q.get("test")) return startTest();
  if (q.get("mic") === "0" || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: MIC_OPTIONS });
  } catch (_) { return; }
  // iPad switches the hardware to the microphone's rate; an audio engine made before that can stay deaf.
  const track = micStream.getAudioTracks()[0];
  const micRate = track && track.getSettings ? track.getSettings().sampleRate : 0;
  if (micRate && ctx.sampleRate !== micRate) { ctx.close(); ctx = null; ensureCtx(); }
  ctx.resume();
  const src = ctx.createMediaStreamSource(micStream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);
  // iPad (WebKit) feeds an analyser only if it leads to the speakers: a silent gain does that, with no sound.
  const pull = ctx.createGain();
  pull.gain.value = 0;
  analyser.connect(pull);
  pull.connect(ctx.destination);
  raw = new Float32Array(analyser.fftSize);
  state.listening = true;
  $("mic").hidden = false;
  $("micDot").classList.add("on");
  $("micText").textContent = "מקשיב";
  micStream.getAudioTracks().forEach(t => t.addEventListener("ended", () => { state.listening = false; $("micDot").classList.remove("on"); }));
}

// ?test=1: hiss straight into the analyser. Console: testBlow(0.2) blows, testBlow(0) stops.
function startTest() {
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = ctx.createBufferSource(), g = ctx.createGain();
  ns.buffer = buf; ns.loop = true; g.gain.value = 0;
  ns.connect(g); g.connect(analyser); ns.start();
  window.testBlow = v => g.gain.setTargetAtTime(v, ctx.currentTime, 0.01);
  raw = new Float32Array(analyser.fftSize);
  state.listening = true;
  state.noiseFloor = 0.00001;
  $("mic").hidden = false;
  $("micDot").classList.add("on");
  $("micText").textContent = "בדיקה";
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null;
  state.listening = false;
  micAsked = false;
  $("micDot").classList.remove("on");
}
addEventListener("pagehide", stopMic);
document.addEventListener("visibilitychange", () => { if (document.hidden) stopMic(); });

// Blowing is loud, rushing noise close to the mic. Heard for 150 ms in a row = blowing.
function analyse() {
  if (!state.listening || !analyser) return;
  analyser.getFloatTimeDomainData(raw);
  let sum = 0;
  for (let i = 0; i < raw.length; i++) sum += raw[i] * raw[i];
  state.rms = Math.sqrt(sum / raw.length);
  // A real microphone in a room is never exactly silent: say so instead of waiting forever.
  if (state.rms === 0 && micStream) {
    if (!state.zeroSince) state.zeroSince = performance.now();
    else if (performance.now() - state.zeroSince > 3000) $("micText").textContent = "אין קול מהמיקרופון";
  } else if (state.zeroSince) { state.zeroSince = 0; $("micText").textContent = "מקשיב"; }

  const now = performance.now(), muted = now < state.muteUntil;
  const loud = !muted && state.rms > Math.max(state.noiseFloor * Math.pow(10, BLOW_DB / 20), 0.002);
  if (loud) { if (!state.blowSince) state.blowSince = now; }
  else state.blowSince = 0;
  state.blowing = loud && now - state.blowSince > 150;
  // The room's level is learned only when nobody is meant to be blowing.
  if (state.rms < state.noiseFloor) state.noiseFloor = state.rms * 0.2 + state.noiseFloor * 0.8;
  else if (state.phase !== "out" && !muted) state.noiseFloor = state.noiseFloor * 0.995 + state.rms * 0.005;
}

/* ---------- Scene ---------- */

const el = (tag, attrs, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;

const GROUND = 560, BX = 1340, BY = 300, MILL_X = 860, HUB_Y = 250, CABLE_Y = 574;
const HOUSE_X = [670, 562, 454, 346, 238, 130];      // nearest the windmill first
const B_EMPTY = 0.42, B_FULL = 0.8;
let scene = {};

function buildScene() {
  const svg = $("scene");
  svg.textContent = "";
  scene = {};

  scene.stars = el("g", { opacity: 0 }, svg);
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 46; i++) el("circle", { cx: (rnd() * 1600).toFixed(0), cy: (10 + rnd() * 330).toFixed(0), r: 1.5 + (i % 3), fill: "#fff6d0" }, scene.stars);
  scene.moon = el("g", { transform: "translate(1440 90)", opacity: 0 }, svg);
  el("circle", { r: 40, fill: "#ffe9a8" }, scene.moon);

  scene.ground = el("path", { d: `M -400 ${GROUND} C 300 ${GROUND - 14} 900 ${GROUND + 6} 2000 ${GROUND - 8} L 2000 900 L -400 900 Z`, fill: "#7cc77a" }, svg);

  // The cable: dark in the grass, glowing as far as the power has reached.
  el("line", { x1: MILL_X - 20, x2: HOUSE_X[HOUSES - 1], y1: CABLE_Y, y2: CABLE_Y, stroke: "#4f7d4a", "stroke-width": 6, "stroke-linecap": "round" }, svg);
  scene.cableLit = el("line", { x1: MILL_X - 20, x2: MILL_X - 20, y1: CABLE_Y, y2: CABLE_Y, stroke: "#ffd25a", "stroke-width": 8, "stroke-linecap": "round" }, svg);
  scene.spark = el("circle", { cx: MILL_X - 20, cy: CABLE_Y, r: 12, fill: "#fff3b0", opacity: 0 }, svg);

  // Houses: dark until their breath lights them.
  scene.houses = HOUSE_X.map((x, i) => {
    const g = el("g", { transform: `translate(${x} ${GROUND + 4}) scale(1.25)` }, svg);
    const halo = el("circle", { cy: -44, r: 62, fill: "#ffcf4a", opacity: 0 }, g);
    el("rect", { x: -36, y: -56, width: 72, height: 56, fill: ["#fff1dc", "#ffe1e1", "#e1f0ff", "#fff1dc", "#e8ffe1", "#f3e6ff"][i] }, g);
    el("path", { d: "M -46 -54 L 0 -96 L 46 -54 Z", fill: ["#e2643a", "#7a5cf0", "#1a7fe2", "#2fa36b", "#e2643a", "#c24e7a"][i] }, g);
    el("rect", { x: -8, y: -30, width: 16, height: 30, fill: "#a0663b" }, g);
    const wins = [el("rect", { x: -29, y: -47, width: 17, height: 17, rx: 2, fill: "#3b434e" }, g),
                  el("rect", { x: 12, y: -47, width: 17, height: 17, rx: 2, fill: "#3b434e" }, g)];
    return { halo, wins };
  });

  // The windmill.
  const m = el("g", {}, svg);
  el("path", { d: `M ${MILL_X - 46} ${GROUND + 2} L ${MILL_X - 26} ${HUB_Y + 10} L ${MILL_X + 26} ${HUB_Y + 10} L ${MILL_X + 46} ${GROUND + 2} Z`, fill: "#f4e6cf", stroke: "#c9b48f", "stroke-width": 3 }, m);
  el("path", { d: `M ${MILL_X - 34} ${HUB_Y + 14} Q ${MILL_X} ${HUB_Y - 40} ${MILL_X + 34} ${HUB_Y + 14} Z`, fill: "#c9632f" }, m);
  el("rect", { x: MILL_X - 14, y: GROUND - 50, width: 28, height: 52, rx: 14, fill: "#a0663b" }, m);
  el("circle", { cx: MILL_X, cy: HUB_Y + 90, r: 12, fill: "#8fd3ff", stroke: "#c9b48f", "stroke-width": 3 }, m);
  scene.sails = el("g", {}, m);
  for (let i = 0; i < 4; i++) {
    const s = el("g", { transform: `rotate(${i * 90})` }, scene.sails);
    el("rect", { x: -4, y: -170, width: 8, height: 170, fill: "#8a5a2b" }, s);
    el("rect", { x: 4, y: -160, width: 40, height: 120, fill: "#fff", stroke: "#8a5a2b", "stroke-width": 3 }, s);
    for (let k = 1; k < 4; k++) el("line", { x1: 4, x2: 44, y1: -160 + k * 30, y2: -160 + k * 30, stroke: "#c9b48f", "stroke-width": 2 }, s);
  }
  el("circle", { cx: 0, cy: 0, r: 14, fill: "#8a5a2b" }, scene.sails);

  // The air from the balloon to the sails.
  scene.air = el("g", { opacity: 0, fill: "none", "stroke-linecap": "round" }, svg);
  scene.airLines = [-26, 0, 26].map(dy => el("path", { stroke: "#ffffff", "stroke-width": 9, "stroke-dasharray": "16 28" }, scene.air));

  // The balloon, its neck pointing at the windmill. Its size is the breath.
  scene.balloon = el("g", {}, svg);
  scene.target = el("path", { d: balloonPath(), transform: `translate(${BX} ${BY}) rotate(90) scale(${B_FULL})`, fill: "none", stroke: "#ff6f59", "stroke-width": 4 / B_FULL, "stroke-dasharray": "12 12", opacity: 0 }, svg);
  scene.bScale = el("g", {}, scene.balloon);
  const defs = el("defs", {}, svg);
  const grad = el("radialGradient", { id: "bfill", cx: "36%", cy: "30%", r: "78%" }, defs);
  el("stop", { offset: "0", "stop-color": "#ffa08c" }, grad);
  el("stop", { offset: ".55", "stop-color": "#ff6f59" }, grad);
  el("stop", { offset: "1", "stop-color": "#d63f2d" }, grad);
  el("path", { d: balloonPath(), fill: "url(#bfill)" }, scene.bScale);
  el("ellipse", { cx: -78, cy: -112, rx: 30, ry: 64, transform: "rotate(-24 -78 -112)", fill: "#fff", opacity: .45 }, scene.bScale);
  el("path", { d: "M -13 220 L 13 220 L 6 239 L -6 239 Z", fill: "#c9392a" }, scene.bScale);
}

function balloonPath() {
  return "M 0 -205 C 115 -205 195 -113 195 0 C 195 113 95 200 10 223 L -10 223 C -95 200 -195 113 -195 0 C -195 -113 -115 -205 0 -205 Z";
}

/* ---------- One breath ---------- */

function setPhase(p) { state.phase = p; state.phaseT = 0; }

function press() {
  if (state.phase !== "idle") return;               // a breath in progress is never restarted by a tap
  startMic();
  if (state.lit >= HOUSES) newEvening();
  state.tip++;
  $("tip").textContent = TIPS[state.tip % TIPS.length];
  setPhase("in");
  notes([392, 523.25]);
}

function stopBreath() {
  if (state.phase === "in" || state.phase === "out") setPhase("idle");
}

function newEvening() {
  state.lit = 0;
  if (state.phase === "lit") setPhase("idle");
}

function update(dt) {
  const s = state, out = LEVELS[s.level - 1];
  s.phaseT += dt;
  if (s.phase === "in" && s.phaseT >= IN_S) { setPhase("out"); notes([523.25, 392]); }
  else if (s.phase === "out" && s.phaseT >= out) {
    s.lit = Math.min(HOUSES, s.lit + 1);
    setPhase("lit");
    if (s.lit === HOUSES) notes([523.25, 659.25, 783.99, 1046.5], 0.14, 0.1);
    else notes([783.99, 1046.5], 0.1);
  } else if (s.phase === "lit" && s.phaseT >= LIT_S) setPhase("idle");
}

function draw(dt) {
  const s = state, t = performance.now() / 1000, out = LEVELS[s.level - 1];

  // Balloon: eases full while breathing in; empties at a constant rate while blowing (steady air).
  let b = B_EMPTY;
  if (s.phase === "in") { const p = clamp01(s.phaseT / IN_S); b = lerp(B_EMPTY, B_FULL, 1 - Math.pow(1 - p, 2)); }
  else if (s.phase === "out") b = lerp(B_FULL, B_EMPTY, clamp01(s.phaseT / out));
  const bob = Math.sin(t * 1.4) * 5;
  scene.bScale.setAttribute("transform", `translate(${BX} ${(BY + bob).toFixed(1)}) rotate(90) scale(${b.toFixed(3)})`);
  scene.target.setAttribute("opacity", s.phase === "in" ? 0.6 : 0);

  // The air stream from the neck to the sails, only while blowing.
  const blowing = s.phase === "out";
  const neck = BX - 239 * b;
  scene.air.setAttribute("opacity", blowing ? 1 : 0);
  if (blowing) {
    const bonus = s.blowing;
    scene.airLines.forEach((ln, i) => {
      const dy = [-26, 0, 26][i];
      ln.setAttribute("d", `M ${neck.toFixed(0)} ${BY + bob + dy * 0.4} C ${neck - 120} ${BY + dy} ${MILL_X + 220} ${HUB_Y + 30 + dy} ${MILL_X + 60} ${HUB_Y + dy}`);
      ln.setAttribute("stroke-dashoffset", ((t * (bonus ? 260 : 170)) % 44).toFixed(1));
      ln.setAttribute("stroke", bonus ? "#fff3b0" : "#ffffff");
    });
  }

  // Sails turn steadily while blowing (a little faster if the mic hears it), and coast to a stop after.
  const want = blowing ? (s.blowing ? SPIN_BONUS : SPIN) : 0;
  s.spin += (want - s.spin) * Math.min(1, dt * (want > s.spin ? 3 : 1.2));
  s.angle = (s.angle + s.spin * dt) % (Math.PI * 2);
  scene.sails.setAttribute("transform", `translate(${MILL_X} ${HUB_Y}) rotate(${(s.angle * 180 / Math.PI).toFixed(1)})`);

  // The power: it reaches the next house exactly when the breath ends.
  const nextX = HOUSE_X[Math.min(s.lit, HOUSES - 1)], lastLitX = s.lit ? HOUSE_X[s.lit - 1] : MILL_X - 20;
  let headX = lastLitX;
  if (s.phase === "out") headX = lerp(lastLitX, nextX, clamp01(s.phaseT / out));
  scene.cableLit.setAttribute("x2", headX.toFixed(1));
  scene.spark.setAttribute("cx", headX.toFixed(1));
  scene.spark.setAttribute("opacity", s.phase === "out" ? 0.9 : 0);
  scene.spark.setAttribute("r", (10 + Math.sin(t * 12) * 3).toFixed(1));

  scene.houses.forEach((h, i) => {
    const on = i < s.lit, fresh = s.phase === "lit" && i === s.lit - 1;
    h.wins.forEach(w => w.setAttribute("fill", on ? "#ffd25a" : "#3b434e"));
    h.halo.setAttribute("opacity", on ? (fresh ? 0.3 + 0.25 * Math.sin(clamp01(s.phaseT / LIT_S) * Math.PI) : 0.3) : 0);
  });

  // Evening falls with each lit house; night (stars, moon) when the whole village is lit.
  $("dusk").style.opacity = clamp01(s.lit / HOUSES * 1.2).toFixed(2);
  const night = s.lit >= HOUSES ? 1 : 0;
  $("night").style.opacity = night;
  scene.stars.setAttribute("opacity", night * 0.9);
  scene.moon.setAttribute("opacity", night);
  scene.ground.setAttribute("fill", night ? "#3f7350" : "#7cc77a");

  // The cue at the top.
  const word = $("cueWord"), count = $("cueCount");
  if (s.phase === "in") { set(word, "שואפים"); set(count, Math.min(IN_S, Math.floor(s.phaseT) + 1)); word.classList.remove("small"); }
  else if (s.phase === "out") { set(word, "נושפים"); set(count, Math.min(out, Math.floor(s.phaseT) + 1)); word.classList.remove("small"); }
  else if (s.lit >= HOUSES) { set(word, "כל הכפר מואר ✨"); set(count, ""); word.classList.remove("small"); }
  else { set(word, s.phase === "lit" ? "יופי!" : "לוחצים כשמוכנים"); set(count, ""); word.classList.toggle("small", s.phase !== "lit"); }
}

function set(node, v) { const text = String(v); if (node.textContent !== text) node.textContent = text; }

/* ---------- Screen ---------- */

function setLevel(n) {
  if (state.phase === "in" || state.phase === "out") setPhase("idle");
  state.level = n;
  LEVELS.forEach((_, i) => $("lv" + (i + 1)).setAttribute("aria-pressed", String(i + 1 === n)));
  save();
}

function save() {
  try { localStorage.setItem("breath", JSON.stringify({ level: state.level, sound: state.sound })); } catch (_) {}
}

function toggleSound() {
  state.sound = !state.sound;
  $("soundBtn").textContent = state.sound ? "🔔" : "🔕";
  $("soundBtn").setAttribute("aria-pressed", String(state.sound));
  save();
}

function toggleFullscreen() {
  const d = document, root = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (p && p.catch) p.catch(() => {}); }
  } catch (_) {}
}

/* ---------- Loop ---------- */

let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000);
  last = now;
  if (now - state.lastAnalyse > ANALYSE_MS) { state.lastAnalyse = now; analyse(); }
  update(dt);
  draw(dt);
  if (!$("diag").hidden) {
    const db = 20 * Math.log10(Math.max(state.rms, 1e-7));
    const bars = Math.max(0, Math.min(10, Math.round((db + 60) / 4.5)));
    $("diag").textContent = audioLine() + `בדיקת מיקרופון (D)\n` +
      `עוצמה  ${"█".repeat(bars)}${"·".repeat(10 - bars)}\n` +
      `רצפה   ${(20 * Math.log10(Math.max(state.noiseFloor, 1e-7))).toFixed(0)} dB · ${state.blowing ? "נושפים" : "שקט"}\n` +
      `v1`;
  }
  requestAnimationFrame(frame);
}

/* ---------- Wiring ---------- */

LEVELS.forEach((_, i) => $("lv" + (i + 1)).addEventListener("click", () => setLevel(i + 1)));
$("soundBtn").addEventListener("click", toggleSound);
$("fullscreen").addEventListener("click", toggleFullscreen);
$("stage").addEventListener("click", press);                     // the whole picture is the button
document.addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); });

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t.tagName === "BUTTON" || t.tagName === "INPUT") return;
  const c = e.code;
  if (c === "Space" || c === "Enter" || c === "PageDown" || c === "ArrowRight" || c === "ArrowLeft" || c === "PageUp") { e.preventDefault(); press(); }
  else if (c === "Escape") stopBreath();
  else if (/^Digit[1-4]$/.test(c)) setLevel(+c.slice(5));
  else if (c === "KeyN") newEvening();
  else if (c === "KeyM") toggleSound();
  else if (c === "KeyD") $("diag").hidden = !$("diag").hidden;
  else if (c === "KeyF") toggleFullscreen();
});

let level = 1;
try {
  const saved = JSON.parse(localStorage.getItem("breath") || "{}");
  if (LEVELS[saved.level - 1]) level = saved.level;
  if (saved.sound === false) toggleSound();
} catch (_) {}
const params = new URLSearchParams(location.search);
if (/^[1-4]$/.test(params.get("level") || "")) level = +params.get("level");
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) || matchMedia("(display-mode: standalone)").matches) $("fullscreen").hidden = true;

$("tip").textContent = TIPS[0];
buildScene();
setLevel(level);
requestAnimationFrame(frame);
</script>
</body>
</html>
