<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Songs · Tonebee</title>
<meta name="theme-color" content="#bfe4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tonebee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32"><link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script>
  // Moving house: the old address (GitHub Pages) hands this device's settings to tonebee.app and sends the page there.
  (function () {
    var keep = /^(brass-|right-note-|ninja-|horn-ladder|breath$|buzz$|songs$|sound-game$)/;
    try {
      if (/github\.io$/.test(location.hostname)) {
        var d = {};
        for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (keep.test(k)) d[k] = localStorage.getItem(k); }
        var page = location.pathname.split("/").pop() || "index.html";
        location.replace("https://tonebee.app/" + page + location.search + "#move=" + encodeURIComponent(JSON.stringify(d)));
        return;
      }
      var m = location.hash.match(/^#move=(.*)$/);
      if (m) {
        var s = JSON.parse(decodeURIComponent(m[1]));
        for (var key in s) if (keep.test(key) && typeof s[key] === "string") localStorage.setItem(key, s[key]);
        history.replaceState(null, "", location.pathname + location.search);
      }
    } catch (_) {}
  })();
  // English pages lay out left to right from the first paint (the language block fills in the words).
  try { if (/[?&]lang=en/.test(location.search) || (!/[?&]lang=he/.test(location.search) && localStorage.getItem("brass-lang") === "en")) { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; } } catch (_) {}
</script>
<style>
  :root {
    --ink: #15181d;
    --ink-2: #3b434e;
    --muted: #56616f;
    --line: rgba(21, 24, 29, .14);
    --panel: rgba(255, 255, 255, .92);
    --go: #1b8f58;
    --accent: #1a7fe2;
    --display: "Rubik", "Lexend", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--display); color: var(--ink); background: linear-gradient(180deg, #bfe4ff 0%, #e8f4ff 55%, #fff4e3 100%) fixed; overflow: hidden; }
  button, select { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--accent); border-radius: 12px; }

  .app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

  .console, .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px clamp(12px, 3vw, 28px); color: var(--muted); font-size: 14px; }
  .console { border-bottom: 1px solid var(--line); }
  .transport { border-top: 1px solid var(--line); padding-bottom: 12px; }
  .console a { color: var(--muted); text-decoration: none; }
  .spacer { margin-inline-start: auto; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--panel); border-radius: 22px; padding: 3px; gap: 2px; }
  .seg-btn { border: 0; background: transparent; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .seg-btn[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(21, 24, 29, .18); }
  .icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; }
  .play-btn { background: var(--accent); color: #fff; border: 0; border-radius: 999px; min-height: 48px; padding: 0 22px; font-weight: 700; font-size: 18px; cursor: pointer; }
  .play-btn.stop { background: var(--ink-2); }
  .mic-dot { width: 12px; height: 12px; border-radius: 50%; background: #c3ccd8; display: inline-block; vertical-align: -1px; }
  .mic-dot.on { background: var(--go); }
  .bars select { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #fff; padding: 0 6px; }
  .hide { display: none !important; }

  .stage { position: relative; min-height: 0; padding: 1vh clamp(8px, 2vw, 24px) 0; overflow: hidden; }
  .scene { width: 100%; height: 100%; display: block; direction: ltr; overflow: visible; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .84); text-align: center; padding: 4vh 6vw; }
  .overlay[hidden] { display: none; }
  .overlay p { margin: 0 0 2vh; font-size: clamp(18px, 3.2vh, 30px); font-weight: 500; max-width: 24ch; line-height: 1.5; }
  .big-btn { background: var(--accent); color: #fff; border: 0; border-radius: 999px; font-weight: 700; font-size: clamp(22px, 4vh, 40px); padding: .6em 1.6em; cursor: pointer; min-height: 56px; }

  /* Song list */
  .list { position: absolute; inset: 0; overflow: auto; padding: 2vh clamp(16px, 4vw, 48px) 4vh; background: rgba(255, 255, 255, .55); }
  .list[hidden] { display: none; }
  .list h2 { font-size: clamp(22px, 3.4vh, 34px); margin: 1vh 0 2vh; font-weight: 800; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .song-card { text-align: start; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 16px 18px; cursor: pointer; min-height: 110px; }
  .song-card:hover { border-color: var(--accent); }
  .song-card b { display: block; font-size: clamp(20px, 2.8vh, 28px); font-weight: 800; margin-bottom: 8px; }
  .song-card span { display: inline-block; font-size: 15px; color: var(--muted); background: #eef3f9; border-radius: 999px; padding: 2px 10px; margin: 0 0 4px 4px; }
  .list .more { color: var(--muted); margin-top: 2vh; font-size: 16px; }
  /* A song that needs more notes: faded, with the missing notes marked; tapping it opens the settings. */
  .song-card.locked { background: #f6f8fb; border-style: dashed; color: var(--muted); }
  .song-card.locked b::after { content: " 🔒"; font-size: .8em; }
  .song-card.locked span.missing { background: #fff3d6; color: #8a5a00; border: 2px dashed #e0a500; font-weight: 700; }
  /* Last card: more songs are coming; a tap counts the interest (analytics) and opens an email. */
  .song-card.later { display: block; text-decoration: none; background: #fffaf0; border-style: dashed; border-color: #e0a500; color: var(--muted); }
  .song-card.later span { background: none; padding: 0; font-size: 16px; }
  .empty { text-align: center; margin: 3vh 0 2vh; }
  .empty p { font-size: clamp(20px, 3vh, 30px); font-weight: 700; margin: 0 0 2vh; }
  .empty button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; font: inherit; font-weight: 700; font-size: clamp(20px, 3vh, 30px); padding: .5em 1.4em; cursor: pointer; min-height: 56px; }
  .empty[hidden] { display: none; }

  /* Settings */
  .sheet { position: absolute; inset: 0; background: rgba(255, 255, 255, .97); overflow: auto; padding: 2vh clamp(16px, 4vw, 48px) 4vh; }
  .sheet[hidden] { display: none; }
  .sheet h2 { font-size: clamp(20px, 3vh, 30px); margin: 2vh 0 1vh; font-weight: 700; }
  .sheet .hint { margin: -0.5vh 0 1vh; color: var(--muted); font-size: 15px; }
  .notes { display: flex; flex-wrap: wrap; gap: 10px; }
  .note-chip { min-width: 84px; min-height: 60px; border-radius: 16px; border: 3px solid var(--line); background: #fff; font-size: clamp(18px, 2.6vh, 26px); font-weight: 700; cursor: pointer; }
  .note-chip[aria-pressed="true"] { border-color: var(--accent); background: #e8f2fe; color: #0f4f96; }
  .note-chip small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 1vh 0; }
  .row > span:first-child { min-width: 9ch; color: var(--muted); }
  .done-btn { background: var(--go); color: #fff; border: 0; border-radius: 999px; font-weight: 700; font-size: clamp(18px, 2.6vh, 26px); padding: .55em 1.8em; cursor: pointer; min-height: 52px; margin-top: 2vh; }

  .diag { position: absolute; inset-inline-end: 10px; bottom: 10px; background: rgba(13, 17, 23, .85); color: #d7e4f5; font-size: 13px; line-height: 1.6; padding: 8px 12px; border-radius: 10px; white-space: pre; font-variant-numeric: tabular-nums; }
  .diag[hidden] { display: none; }
  kbd { font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  /* Pause: the whole screen freezes behind one big symbol. */
  .pause { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgba(255, 255, 255, .8); cursor: pointer; }
  .pause[hidden] { display: none; }
  .pause-box { text-align: center; }
  .pause-icon { font-size: clamp(80px, 22vh, 220px); line-height: 1; color: #1a7fe2; }
  .resume-btn { margin-top: 2vh; background: #1a7fe2; color: #fff; border: 0; border-radius: 999px; font: inherit; font-weight: 700; font-size: clamp(22px, 4vh, 40px); padding: .5em 1.4em; cursor: pointer; min-height: 56px; }
  .pause-stop { display: block; margin: 2.5vh auto 0; background: none; border: 0; font: inherit; font-size: clamp(16px, 2.6vh, 24px); color: #56616f; text-decoration: underline; cursor: pointer; min-height: 44px; }
  .seg[hidden] { display: none; }
  /* Touch screens have no keyboard: no key hints. */
  @media (hover: none) and (pointer: coarse) { .keys { display: none; } }
  /* Shortcuts live in the pause box (Esc), not on the game screen. */
  .transport .keys { display: none; }
  .pause-keys { margin: 22px auto 0; max-width: 40em; font-size: 15px; color: #66707d; line-height: 2.1; }
  @media (hover: none) and (pointer: coarse) { .pause-keys { display: none; } }
  #overlayText:empty { display: none; }
  /* Phones: one compact top bar; the way home is the app's icon. */
  .home-icon { display: none; }
  @media (max-width: 600px) {
    .console { gap: 6px 8px; padding: 6px 10px; }
    .home { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; font-size: 20px; }
    .home-word { display: none; }
    .home-icon { display: block; width: 30px; height: 30px; border-radius: 22%; }
    .icon-btn { min-width: 40px; min-height: 40px; padding: 0 8px; }
    .seg-btn { padding: 0 10px; }
  }

  /* The cover: how to play without words (first visit, or "?"), then one button. */
  .cover { display: grid; justify-items: center; gap: 2.4vh; }
  .cover-btns { display: flex; align-items: center; gap: 14px; }
  .help-btn { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line, #e1e7ef); background: #fff; font: inherit; font-size: 26px; font-weight: 700; color: var(--muted, #66707d); cursor: pointer; }
  .help-btn:hover { border-color: var(--accent, #1a7fe2); color: var(--accent, #1a7fe2); }
  .demo { width: min(560px, 76vw); height: auto; max-height: 52vh; border-radius: 22px; box-shadow: 0 12px 34px rgba(31, 42, 68, .16); }
  .demo[hidden] { display: none; }
  .demo { direction: ltr; }   /* laid out like the game itself, which never mirrors with the language */
  .d-waves path { animation: dPulse .5s infinite alternate; }
  .d-w2 { animation-delay: .17s !important; } .d-w3 { animation-delay: .34s !important; }
  @keyframes dPulse { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .demo * { animation: none !important; } }

  /* First visit (or "?" in the top bar): the card over the game. */
  .cover-card { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(255, 255, 255, .88); padding: 3vh 4vw; }
  .cover-card[hidden] { display: none; }
  .cover-play { width: clamp(72px, 11vh, 96px); height: clamp(72px, 11vh, 96px); border-radius: 50%; border: 0; background: var(--accent, #1a7fe2); color: #fff; font-size: clamp(30px, 5vh, 42px); cursor: pointer; box-shadow: 0 6px 0 rgba(31, 42, 68, .18); padding-inline-start: .18em; }
  .cover-play:hover { filter: brightness(1.08); }

  .d-hl { animation: dHl 5s infinite; }
  .d-n { animation: 5s infinite; }
  .d-n1 { animation-name: dN1; } .d-n2 { animation-name: dN2; } .d-n3 { animation-name: dN3; } .d-n4 { animation-name: dN4; }
  .d-waves { animation: dSteps 5s infinite; }
  .d-star { opacity: 0; animation: dStar 5s infinite; }
  @keyframes dHl { 0%, 8% { transform: translateX(0); opacity: 0; } 10%, 25% { transform: translateX(0); opacity: 1; } 28%, 43% { transform: translateX(60px); } 46%, 61% { transform: translateX(120px); } 64%, 76% { transform: translateX(180px); opacity: 1; } 80%, 100% { transform: translateX(180px); opacity: 0; } }
  @keyframes dN1 { 0%, 11% { fill: #1f2a44; } 13%, 94% { fill: #1b8f58; } 100% { fill: #1f2a44; } }
  @keyframes dN2 { 0%, 29% { fill: #1f2a44; } 31%, 94% { fill: #1b8f58; } 100% { fill: #1f2a44; } }
  @keyframes dN3 { 0%, 47% { fill: #1f2a44; } 49%, 94% { fill: #1b8f58; } 100% { fill: #1f2a44; } }
  @keyframes dN4 { 0%, 65% { fill: #1f2a44; } 67%, 94% { fill: #1b8f58; } 100% { fill: #1f2a44; } }
  @keyframes dSteps { 0%, 9% { opacity: 0; } 11%, 23% { opacity: 1; } 26% { opacity: 0; } 29%, 41% { opacity: 1; } 44% { opacity: 0; } 47%, 59% { opacity: 1; } 62% { opacity: 0; } 65%, 75% { opacity: 1; } 79%, 100% { opacity: 0; } }
  @keyframes dStar { 0%, 76% { opacity: 0; transform: translate(440px, 80px) scale(.3); } 82%, 94% { opacity: 1; transform: translate(440px, 66px) scale(1); } 100% { opacity: 0; } }

  /* Brand (2026-10-26): the main action buttons are honey with navy text and a pressable bottom edge, like the logo's bee;
     blue stays only where it means something in the game (the note you play, the hold ring). Selected options stay neutral. */
  .big-btn, .resume-btn, .cover-play, .play-btn:not(.stop), .empty button, .btn.primary {
    background: #f2b33d !important; color: #1f2a44 !important; box-shadow: 0 4px 0 #c98f22; }
  .big-btn:hover, .resume-btn:hover, .cover-play:hover, .play-btn:not(.stop):hover, .empty button:hover, .btn.primary:hover {
    background: #f6c055 !important; filter: none; }
  .big-btn:active, .resume-btn:active, .cover-play:active, .play-btn:not(.stop):active, .empty button:active, .btn.primary:active {
    transform: translateY(3px); box-shadow: 0 1px 0 #c98f22; }
  .pause-icon { color: #1f2a44; }
  .lvl[aria-pressed="true"] { background: #1f2a44 !important; border-color: #1f2a44 !important; color: #fff8ec !important; }
</style>

</head>
<body>
<div class="app">
  <header class="console">
    <a class="home" href="index.html" aria-label="Tonebee" data-t-aria="brand">‹<img class="home-icon" src="icons/icon-192.png" alt=""><span class="home-word"> <span data-t="brand">Tonebee</span></span></a>
    <button id="listBtn" class="icon-btn" data-t-title="listTip" data-t="songsBtn"></button>
    <span class="spacer"></span>
    <span><span class="mic-dot" id="micDot"></span> <span id="micText" data-t="mic"></span></span>
    <button id="settings" class="icon-btn" data-t-title="settings">⚙</button>
    <button id="helpBtn" class="icon-btn" data-t-title="howTo" data-t-aria="howTo">?</button>
    <button id="pauseBtn" class="icon-btn" data-t-title="pause">⏸</button>
    <button id="fullscreen" class="icon-btn" data-t-title="fullscreen">⛶</button>
  </header>

  <main class="stage" id="stage">
    <svg class="scene" id="scene" viewBox="0 0 1300 600" preserveAspectRatio="xMidYMid meet" role="img" data-t-aria="scene"></svg>

    <section class="list" id="list" data-t-aria="songs">
      <h2 data-t="whichSong"></h2>
      <div class="empty" id="empty" hidden><p data-t="needNotes"></p><button id="emptyBtn" data-t="chooseNotes"></button></div>
      <div class="cards" id="cards"></div>
      <p class="more" id="more"></p>
    </section>

    <div class="overlay" id="overlay" hidden>
      <div>
        <p id="overlayText" data-t="startPrompt"></p>
        <button class="big-btn" id="startBtn" data-t="start"></button>
      </div>
    </div>

    <section class="sheet" id="sheet" hidden data-t-aria="settingsLabel">
      <h2 data-t="whichNotes"></h2>
      <p class="hint" data-t="sameAs"></p>
      <div class="notes" id="noteChips"></div>
      <h2 data-t="settingsLabel"></h2>
      <div class="row"><span data-t="noteName"></span><div class="seg" role="group" id="namesSeg"></div><div class="seg" role="group" id="styleSeg"></div></div>
      <div class="row"><span data-t="repeated"></span><div class="seg" role="group" id="repeatSeg"></div></div>
      <button class="done-btn" id="sheetDone" data-t="close"></button>
    </section>

    <div class="diag" id="diag" hidden></div>
  </main>

  <footer class="transport" id="transport">
    <div class="seg" role="group" data-t-aria="mode">
      <button id="modeFollow" class="seg-btn" aria-pressed="true" data-t="follow"></button>
      <button id="modeTime" class="seg-btn" aria-pressed="false" data-t="inTime"></button>
    </div>
    <div class="seg" role="group" data-t-aria="tempo" id="tempoSeg"></div>
    <div class="seg" role="group" data-t-aria="backing">
      <button id="bandBtn" class="seg-btn" aria-pressed="true" data-t-title="bandTip" data-t="band"></button>
      <button id="guideBtn" class="seg-btn" aria-pressed="false" data-t-title="guideTip" data-t="guide"></button>
    </div>
    <span class="bars"><span data-t="bars"></span> <select id="fromBar" data-t-aria="fromBar"></select> – <select id="toBar" data-t-aria="toBar"></select></span>
    <span class="spacer"></span>
    <span class="keys" data-t-html="keys"></span>
    <button id="listenBtn" class="icon-btn" data-t-title="listenTip"></button>
    <button id="playBtn" class="play-btn"></button>

  state.chosen = shared && Array.isArray(shared.chosen) ? shared.chosen.filter(n => I.notes.includes(n)) : [];
  if (!state.chosen.length) state.chosen = I.def.slice();
  if (own) {
    state.mode = own.mode === "time" ? "time" : "follow";
    state.tempo = TEMPOS.includes(own.tempo) ? own.tempo : 60;
    state.names = own.names !== false;
    state.style = own.style === "abc" ? "abc" : "sol";
    state.repeat = own.repeat === "hold" ? "hold" : "attack";
    state.band = own.band !== false;
    state.guide = own.guide === true;
  }
}

function save() {
  try {
    localStorage.setItem("brass-inst", state.inst);
    localStorage.setItem("songs", JSON.stringify({ mode: state.mode, tempo: state.tempo, names: state.names, style: state.style, repeat: state.repeat, band: state.band, guide: state.guide }));
    let shared = null;
    try { shared = JSON.parse(localStorage.getItem("right-note-" + state.inst) || "null"); } catch (_) {}
    localStorage.setItem("right-note-" + state.inst, JSON.stringify(Object.assign(shared || {}, { chosen: state.chosen })));
  } catch (_) {}
}

/* ---------- Audio ---------- */

let ctx = null, analyser = null, micStream = null, raw = null, deci = null, testOsc = null, testGain = null;
const buffers = {};
let voices = [];

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.onstatechange = () => { if (state.listening && micStream) $("micText").textContent = ctx.state === "running" ? T("listening") : T("tapScreen"); };
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

function loadSamples(inst) {
  ensureCtx();
  return Promise.all(Object.keys(SAMPLES[inst]).map(name => {
    const key = inst + "/" + name;
    if (buffers[key]) return null;
    return fetch("sounds/" + key + ".m4a")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(a => new Promise((ok, bad) => ctx.decodeAudioData(a, ok, bad)))
      .then(b => { buffers[key] = b; })
      .catch(() => {});
  }));
}

async function startMic() {
  ensureCtx();
  loadSamples(state.inst);
  if (params.get("test")) return startTestTone();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail(T("onlyOnline"));
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: MIC_OPTIONS });
  } catch (err) {
    tbTrack("mic_error", { reason: (err && err.name) || "unknown" });
    const n = err && err.name;
    return fail(n === "NotAllowedError" ? T("micDenied")
      : n === "NotFoundError" ? T("micNotFound")
      : n === "NotReadableError" ? T("micBusy")
      : T("micFailed"));
  }
  // iPad switches the hardware to the microphone's rate; an audio engine made before that can stay deaf.
  const track = micStream.getAudioTracks()[0];
  const micRate = track && track.getSettings ? track.getSettings().sampleRate : 0;
  if (micRate && ctx.sampleRate !== micRate) { ctx.close(); ctx = null; ensureCtx(); }
  ctx.resume();
  const src = ctx.createMediaStreamSource(micStream);
  makeAnalyser();
  src.connect(analyser);
  // iPad (WebKit) feeds an analyser only if it leads to the speakers: a silent gain does that, with no sound.
  const pull = ctx.createGain();
  pull.gain.value = 0;
  analyser.connect(pull);
  pull.connect(ctx.destination);
  listening(T("listening"));
  micStream.getAudioTracks().forEach(t => {
    t.addEventListener("ended", () => needFresh(T("micGone"), "ended"));
    t.addEventListener("mute", () => { $("micText").textContent = T("muted"); });
    t.addEventListener("unmute", () => { $("micText").textContent = T("listening"); });
  });
}

function makeAnalyser() {
  analyser = ctx.createAnalyser();
  analyser.fftSize = 8192;
  analyser.smoothingTimeConstant = 0;
  raw = new Float32Array(analyser.fftSize);
}

function listening(text) {
  state.listening = true;
  tbTrack("game_start");
  $("overlay").hidden = true;
  $("micDot").classList.add("on");
  $("micText").textContent = text;
}

// ?test=1: no microphone. Console: testTone(writtenMidi, cents), testTone(null) = silence,
// testGap(ms) = a short dip in the tone, like a tongued repeat.
function startTestTone() {
  makeAnalyser();
  state.noiseFloor = 0.00001;
  listening(T("test"));
  testGain = ctx.createGain();
  testGain.gain.value = 0;
  testGain.connect(analyser);
  testOsc = ctx.createOscillator();
  testOsc.type = "sine";
  testOsc.connect(testGain);
  testOsc.start();
  window.testTone = (written, cents = 0) => {
    if (!written) { testGain.gain.setValueAtTime(0, ctx.currentTime); return; }
    testOsc.frequency.setValueAtTime(concertHz(written) * Math.pow(2, cents / 1200), ctx.currentTime);
    testGain.gain.setValueAtTime(0.25, ctx.currentTime);
  };
  window.testGap = ms => {
    const t = ctx.currentTime;
    testGain.gain.setValueAtTime(0.25, t);
    testGain.gain.linearRampToValueAtTime(0.01, t + 0.01);
    testGain.gain.setValueAtTime(0.01, t + ms / 1000);
    testGain.gain.linearRampToValueAtTime(0.25, t + ms / 1000 + 0.01);
  };
}

function fail(message) {
  state.listening = false;
  stopPlaying();
  $("overlay").hidden = false;
  $("overlayText").textContent = message;
  $("startBtn").textContent = T("tryAgain");
  $("micDot").classList.remove("on");
  $("micText").textContent = T("noMic");
}

function stopMic() { if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; state.listening = false; }
addEventListener("pagehide", stopMic);
// iPhone/iPad: back from the background, or the mic cut off by iOS (a call, Siri, another app, the lock screen), WebKit can
// keep the audio engine deaf until the page is opened again, which in the installed app meant closing it. So the way back
// is a fresh page: one tap on the button, settings kept (they live in localStorage).
let fresh = false;
function needFresh(message, why) {
  tbTrack("audio_recover", { why });
  if (micStream) stopMic();
  fresh = true;
  fail(message);
  $("startBtn").textContent = T("resume");
}
document.addEventListener("visibilitychange", () => { if (document.hidden && micStream) needFresh(T("keepListening"), "background"); });
// "interrupted" is iOS's own state (a pause uses "suspended"): if a tap does not wake it, it is stuck.
document.addEventListener("pointerup", () => {
  if (!state.listening || !ctx || ctx.state !== "interrupted") return;
  setTimeout(() => { if (state.listening && ctx && ctx.state === "interrupted") needFresh(T("micFailed"), "interrupted"); }, 1500);
}, true);
// Runs before the button's other handlers (capture on the target).
$("startBtn").addEventListener("click", e => { if (fresh) { e.stopImmediatePropagation(); location.reload(); } }, true);

function sampleFor(written) {
  const concert = written - INSTRUMENTS[state.inst].toWritten, table = SAMPLES[state.inst];
  let best = null, dist = 99;
  for (const name in table) {
    const midi = (+name.slice(-1) + 1) * 12 + PC_NAME.indexOf(name.slice(0, -1));
    if (Math.abs(midi - concert) < dist && buffers[state.inst + "/" + name]) { best = { name, midi }; dist = Math.abs(midi - concert); }
  }
  if (!best || dist > 3) return null;
  const hz = 440 * Math.pow(2, (best.midi - 69 + table[best.name] / 100) / 12);
  return { buffer: buffers[state.inst + "/" + best.name], rate: concertHz(written) / hz };
}

// One note on the real instrument, starting at audio time `at`, lasting `dur` seconds.
// Recordings are 2 s; longer notes loop the steady middle of the recording.
function playNote(written, at, dur) {
  const c = ensureCtx(), s = sampleFor(written), g = c.createGain();
  g.connect(c.destination);
  const end = at + Math.max(0.15, dur - 0.04);
  g.gain.setValueAtTime(0.6, at);
  g.gain.setValueAtTime(0.6, end - 0.06);
  g.gain.linearRampToValueAtTime(0.0001, end);
  let src;
  if (s) {
    src = c.createBufferSource();
    src.buffer = s.buffer;
    src.playbackRate.value = s.rate;
    if (dur > 1.5) { src.loop = true; src.loopStart = 0.5; src.loopEnd = 1.4; }
    src.connect(g);
  } else {
    loadSamples(state.inst);
    src = c.createOscillator();
    const f = c.createBiquadFilter(), hz = concertHz(written);
    src.type = "sawtooth"; src.frequency.value = hz;
    f.type = "lowpass"; f.frequency.value = Math.min(3000, hz * 4);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.12, at + 0.04);
    g.gain.setValueAtTime(0.12, end - 0.06);
    src.connect(f); f.connect(g);
  }
  src.start(at); src.stop(end + 0.02);
  voices.push(src);
}

function click(at, strong) {
  const c = ensureCtx(), o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.value = strong ? 520 : 400;      // low and soft, not trebly
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(strong ? 0.35 : 0.25, at + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.06);
  o.connect(g); g.connect(c.destination);
  o.start(at); o.stop(at + 0.08);
  voices.push(o);
}

/* ---------- The band ----------
   Chords worked out from the melody, per half bar: the chord among I, IV, V and vi that holds the most of the
   melody (notes on beats 1 and 3 count more; fa counts half for V, as its seventh); first and last bars are I. Drums and a bass always;
   chords only when nobody is being listened to, because they hold the melody's own notes and the microphone
   could take them for the child. The bass sits below the instrument's range, so it can never be taken for it. */

const CHORDS = { I: [0, 4, 7], IV: [5, 9, 0], V: [7, 11, 2], vi: [9, 0, 4] };
function harmony(song) {
  const tonic = writtenOf(1), out = [];
  for (let h = 0; h < song.bars * 2; h++) {
    const from = h * 2, to = from + 2, score = { I: 0, IV: 0, V: 0, vi: 0 };
    song.events.forEach(e => {
      const a = Math.max(e.start, from), b = Math.min(e.start + e.dur, to), w = writtenOf(e.step);
      if (b <= a || w === undefined) return;
      const pc = ((w - tonic) % 12 + 12) % 12, weight = (b - a) * (e.start === from ? 1.5 : 1);
      for (const k in CHORDS) if (CHORDS[k].includes(pc)) score[k] += weight;
      if (pc === 5) score.V += weight * 0.5;                            // fa fits V as its seventh, a little
    });
    let best = "I";
    for (const k of ["V", "IV", "vi"]) if (score[k] > score[best] + 1e-9) best = k;
    out.push(best);
  }
  out[0] = out[1] = out[out.length - 2] = out[out.length - 1] = "I";
  return out;
}

let noiseBuf = null;
function noise(c) {
  if (!noiseBuf || noiseBuf.sampleRate !== c.sampleRate) {
    noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const n = c.createBufferSource();
  n.buffer = noiseBuf;
  return n;
}

// Beats `first`…`last` of the song, starting at audio time `at`.
function playBand(at, first, last, withChords) {
  const c = ensureCtx(), beat = 60 / state.tempo, harm = harmony(state.song);
  const tonic = writtenOf(1) - INSTRUMENTS[state.inst].toWritten;      // concert
  const out = c.createGain();
  out.gain.value = 0.5;
  out.connect(c.destination);
  voices.push({ stop: () => out.disconnect() });
  const env = (node, t, peak, dur) => {
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(out);
    return g;
  };
  for (let k = first; k < last; k++) {
    const t = at + (k - first) * beat, pos = k % BEATS;
    if (pos === 0 || pos === 2) {                                       // kick
      const o = c.createOscillator();
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
      env(o, t, 0.9, 0.18); o.start(t); o.stop(t + 0.2);
    } else {                                                            // snare
      const n = noise(c), f = c.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.8;
      n.connect(f); env(f, t, 0.35, 0.13); n.start(t); n.stop(t + 0.15);
    }
    [0, 0.5].forEach((off, j) => {                                      // hi-hat on the eighths
      const n = noise(c), f = c.createBiquadFilter(), th = t + off * beat;
      f.type = "highpass"; f.frequency.value = 7000;
      n.connect(f); env(f, th, j ? 0.05 : 0.08, 0.035); n.start(th); n.stop(th + 0.05);
    });
    if (pos % 2) continue;
    const chord = CHORDS[harm[Math.floor(k / 2)]], len = 2 * beat * 0.95;
    let root = tonic - 12 + chord[0];                                   // bass: under the instrument's range
    if (root > tonic - 6) root -= 12;
    const b = c.createOscillator(), bf = c.createBiquadFilter();
    b.type = "triangle"; b.frequency.value = 440 * Math.pow(2, (root - 69) / 12);
    bf.type = "lowpass"; bf.frequency.value = 500;
    b.connect(bf);
    const bg = c.createGain();
    bg.gain.setValueAtTime(0.0001, t); bg.gain.exponentialRampToValueAtTime(0.45, t + 0.02); bg.gain.exponentialRampToValueAtTime(0.0001, t + len);
    bf.connect(bg); bg.connect(out); b.start(t); b.stop(t + len + 0.02);
    voices.push(b);
    if (!withChords) continue;
    chord.forEach(pc => {                                               // chords: a soft piano-like hit, above the tune
      const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      o.type = "triangle"; o.frequency.value = 440 * Math.pow(2, (tonic + 12 + pc - 69) / 12);
      f.type = "lowpass"; f.frequency.value = 2200;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.015); g.gain.exponentialRampToValueAtTime(0.02, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t + len + 0.02);
      voices.push(o);
    });
  }
}

function silenceVoices() { voices.forEach(v => { try { v.stop(); } catch (_) {} }); voices = []; }

function playNotes(freqs, gap, length, level) {
  const c = ensureCtx();
  freqs.forEach((hz, i) => {
    const t = c.currentTime + 0.05 + i * gap;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "triangle"; o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(level, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + length);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + length + 0.05);
  });
  state.muteUntil = Math.max(state.muteUntil, performance.now() + freqs.length * gap * 1000 + length * 1000 + 300);
}

/* ---------- Detection ---------- */

// Every frame: a short-window loudness envelope, to hear a tongued restart of the same note.
function envelope() {
  if (!state.listening || !analyser) return;
  analyser.getFloatTimeDomainData(raw);
  let s = 0;
  for (let i = raw.length - 1024; i < raw.length; i++) s += raw[i] * raw[i];
  const env = Math.sqrt(s / 1024);
  state.env = env;
  state.envPeak = Math.max(env, state.envPeak * 0.985);
  if (env < state.envPeak * 0.4) state.dipped = true;
  else if (state.dipped && env > state.envPeak * 0.65) { state.dipped = false; state.onsetAt = performance.now(); }
}

function analyse() {
  if (!state.listening || !analyser) return;
  let sum = 0;
  for (let i = 0; i < raw.length; i++) sum += raw[i] * raw[i];
  state.rms = Math.sqrt(sum / raw.length);
  // A real microphone in a room is never exactly silent: say so instead of waiting forever.
  if (state.rms === 0 && micStream) {
    if (!state.zeroSince) state.zeroSince = performance.now();
    else if (performance.now() - state.zeroSince > 3000) needFresh(T("noMicSound"), "silent");
  } else if (state.zeroSince) { state.zeroSince = 0; $("micText").textContent = T("listening"); }
  if (state.rms < state.noiseFloor) state.noiseFloor = state.rms * 0.2 + state.noiseFloor * 0.8;
  else if (!state.heard && state.phase !== "time") state.noiseFloor = state.noiseFloor * 0.999 + state.rms * 0.001;
  const gate = Math.max(state.noiseFloor * Math.pow(10, 12 / 20), 0.0015);
  const sounding = state.rms > gate && performance.now() > state.muteUntil;
  if (sounding && !state.soundOn) { state.soundOn = true; state.soundSince = performance.now(); state.onsetAt = performance.now(); }
  else if (!sounding) state.soundOn = false;
  state.heard = false;
  if (!sounding || performance.now() - state.soundSince < 150) { state.clarity = 0; return; }

  const sr = ctx.sampleRate, D = Math.max(1, Math.round(sr / 8000)), n = Math.floor(raw.length / D), sr2 = sr / D;
  if (!deci || deci.length !== n) deci = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < D; j++) s += raw[i * D + j]; deci[i] = s / D; }
  const I = INSTRUMENTS[state.inst];
  const got = detect(deci, sr2, I.lo, I.hi);
  if (!got || got.clarity < 0.6) { state.clarity = 0; return; }
  state.freq = got.freq;
  state.clarity = got.clarity;
  state.heard = true;
}

function detect(buf, sampleRate, fMin, fMax) {
  const n = buf.length;
  const minLag = Math.max(2, Math.floor(sampleRate / fMax));
  const maxLag = Math.min(Math.floor(sampleRate / fMin), n - 2);
  if (maxLag <= minLag) return null;
  const nsdf = new Float32Array(maxLag + 2);
  let peak = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let ac = 0, m = 0;
    for (let i = 0, end = n - lag; i < end; i++) { const a = buf[i], b = buf[i + lag]; ac += a * b; m += a * a + b * b; }
    const v = m > 0 ? (2 * ac) / m : 0;
    nsdf[lag] = v;
    if (v > peak) peak = v;
  }
  if (peak < 0.4) return null;
  const threshold = peak * 0.9;
  for (let lag = minLag + 1; lag < maxLag; lag++) {
    if (nsdf[lag] > threshold && nsdf[lag] >= nsdf[lag - 1] && nsdf[lag] >= nsdf[lag + 1]) {
      const y1 = nsdf[lag - 1], y2 = nsdf[lag], y3 = nsdf[lag + 1];
      const denom = 2 * (2 * y2 - y1 - y3);
      return { freq: sampleRate / (lag + (Math.abs(denom) > 1e-9 ? (y3 - y1) / denom : 0)), clarity: y2 };
    }
  }
  return null;
}

const centsTo = written => 1200 * Math.log2(state.freq / concertHz(written));
const onNote = written => state.heard && performance.now() > state.muteUntil && Math.abs(centsTo(written)) < TOL_CENTS;

/* ---------- Notation ---------- */

const el = (tag, attrs, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

const S = 34, STAFF_X0 = 30, STAFF_X1 = 1280, STAFF_TOP = 170, BARS_X0 = 250;
let BAR_W = (STAFF_X1 - BARS_X0) / BARS_PER_LINE;
// An upright phone shows two bars per line, so the notes stay big enough to read.
const PHONE_UPRIGHT = matchMedia("(orientation: portrait) and (max-width: 600px)");
function setLineBars() {
  const n = PHONE_UPRIGHT.matches ? 2 : 4;
  if (n === BARS_PER_LINE) return false;
  BARS_PER_LINE = n;
  BAR_W = (STAFF_X1 - BARS_X0) / n;
  return true;
}
setLineBars();
const bottomLine = () => INSTRUMENTS[state.inst].clef === "treble" ? 30 : 18;     // E4 / G2
const staffY = d => STAFF_TOP + 4 * S - (d - bottomLine()) * S / 2;
let g = {}, noteEls = [];

function buildScene() {
  const svg = $("scene");
  svg.textContent = "";
  g = { title: el("text", { x: 650, y: 70, "text-anchor": "middle", "font-size": 46, "font-weight": 800, fill: "#15181d", style: "font-family: var(--display)" }, svg) };
  g.line = el("g", {}, svg);
  g.arrow = el("path", { fill: "#1a7fe2", opacity: 0 }, svg);
  g.count = el("text", { x: 650, y: 100, "text-anchor": "middle", "font-size": 80, "font-weight": 900, fill: "#7a5cf0", style: "font-family: var(--display)" }, svg);
  g.banner = el("text", { x: 650, y: 150, "text-anchor": "middle", "font-size": 84, "font-weight": 900, fill: "#7a5cf0", style: "font-family: var(--display)", direction: LANG === "he" ? "rtl" : "ltr", opacity: 0 }, svg);
  g.title.textContent = state.song ? titleOf(state.song) : "";
  g.cur = g.next = null;
  state.line = -1;
  if (state.song) drawLine(lineOf(state.cursor), false);
}

const lineOf = i => Math.floor(state.song.events[Math.min(i, state.song.events.length - 1)].bar / BARS_PER_LINE);

// One line of four bars (two on an upright phone) at a time, and the next line waiting below it, small and faded. When the song
// reaches it, it slides up into place and comes to full strength while the finished line drifts away above.
const PREVIEW = { x: 325, y: 383, s: 0.5 };          // where the next line waits: half size, centred, below
const previewAt = k => `translate(${PREVIEW.x * k} ${PREVIEW.y * k}) scale(${1 - (1 - PREVIEW.s) * k})`;
function drawLine(line, slide) {
  if (line === state.line) return;
  state.line = line;
  const song = state.song, lines = Math.ceil(song.bars / BARS_PER_LINE), old = g.cur, waiting = g.next;
  let cur;
  if (slide && waiting && waiting.line === line) cur = waiting;          // the line that was waiting below
  else { cur = { line, grp: el("g", {}, g.line) }; cur.els = renderLine(cur.grp, line); }
  noteEls = cur.els;
  g.cur = cur;
  g.next = null;
  if (line + 1 < lines) { g.next = { line: line + 1, grp: el("g", { transform: previewAt(1), opacity: 0 }, g.line) }; g.next.els = renderLine(g.next.grp, line + 1); }
  const next = g.next;
  if (!slide) {
    [...g.line.children].forEach(c => { if (c !== cur.grp && (!next || c !== next.grp)) c.remove(); });
    cur.grp.removeAttribute("transform"); cur.grp.setAttribute("opacity", 1);
    if (next) next.grp.setAttribute("opacity", 0.3);
  } else {
    const from = cur === waiting ? 1 : 0, t0 = performance.now();
    (function go(now) {
      const p = Math.min(1, (now - t0) / 550), e = 1 - Math.pow(1 - p, 3);
      cur.grp.setAttribute("transform", previewAt(from * (1 - e)));
      cur.grp.setAttribute("opacity", (from ? 0.3 + 0.7 * e : e).toFixed(3));
      if (old && old !== cur) { old.grp.setAttribute("transform", `translate(0 ${(-120 * e).toFixed(1)})`); old.grp.setAttribute("opacity", Math.max(0, 1 - 2 * e).toFixed(3)); }
      if (next) next.grp.setAttribute("opacity", (0.3 * e).toFixed(3));
      if (p < 1) requestAnimationFrame(go);
      else if (old && old !== cur) old.grp.remove();
    })(t0);
  }
  paintNotes();
}

// Draw one line of bars into `grp`. Notes are spaced by duration but never closer than a note head allows.
function renderLine(grp, line) {
  const song = state.song, I = INSTRUMENTS[state.inst], els = [];
  const treble = I.clef === "treble";
  for (let i = 0; i < 5; i++) el("line", { x1: STAFF_X0, x2: STAFF_X1, y1: STAFF_TOP + i * S, y2: STAFF_TOP + i * S, stroke: "#15181d", "stroke-width": 3 }, grp);
  el("text", { x: STAFF_X0 + 12, y: treble ? STAFF_TOP + 3 * S : STAFF_TOP + S, "font-size": 4 * S, fill: "#15181d", style: MUSIC_FONT }, grp).textContent = treble ? GLYPH.gClef : GLYPH.fClef;
  I.key.forEach((d, i) => el("text", { x: 130 + i * 26, y: staffY(d), "font-size": 4 * S, fill: "#15181d", style: MUSIC_FONT }, grp).textContent = GLYPH.flat);
  if (line === 0) [STAFF_TOP + S, STAFF_TOP + 3 * S].forEach(y => el("text", { x: 194, y, "font-size": 4 * S, fill: "#15181d", style: MUSIC_FONT }, grp).textContent = GLYPH.time4);

  const firstBar = line * BARS_PER_LINE, lastBar = Math.min(song.bars, firstBar + BARS_PER_LINE) - 1;
  for (let b = firstBar; b <= lastBar; b++) {
    const bx = BARS_X0 + (b - firstBar) * BAR_W, end = b === song.bars - 1;
    el("line", { x1: bx + BAR_W - (end ? 10 : 0), x2: bx + BAR_W - (end ? 10 : 0), y1: STAFF_TOP, y2: STAFF_TOP + 4 * S, stroke: "#15181d", "stroke-width": 3 }, grp);
    if (end) el("rect", { x: bx + BAR_W - 6, y: STAFF_TOP, width: 8, height: 4 * S, fill: "#15181d" }, grp);
    const n = el("text", { x: bx + 6, y: STAFF_TOP - 22, "font-size": 18, fill: "#8a96a6", style: "font-family: var(--display)" }, grp);
    n.textContent = b + 1;
    const evs = song.events.filter(e => e.bar === b);
    const weights = evs.map(e => 0.8 + 0.3 * e.dur), total = weights.reduce((a, c) => a + c, 0);
    let acc = 0;
    evs.forEach((e, k) => {
      const x = bx + 18 + (acc / total) * (BAR_W - 40);
      acc += weights[k];
      els[song.events.indexOf(e)] = drawNote(grp, e, x);
    });
  }
  // Names fit the tightest spacing on the line.
  const xs = els.filter(Boolean).map(n => n.x).sort((a, b) => a - b);
  const gap = Math.min(80, ...xs.slice(1).map((x, i) => x - xs[i]));
  const size = Math.max(18, Math.min(34, gap * 0.85));
  els.forEach(n => { if (n && n.name) n.name.setAttribute("font-size", size); });
  return els;
}

function drawNote(grp, e, x) {
  const written = writtenOf(e.step), sp = spell(written), d = diatonicOf(sp), y = staffY(d), pos = d - bottomLine();
  const wrap = el("g", {}, grp);
  const hl = el("rect", { x: x - 14, y: STAFF_TOP - 52, width: 1.18 * S + 28, height: 4 * S + 164, rx: 16, fill: "#1a7fe2", opacity: 0 }, wrap);
  const line = q => el("line", { x1: x - 10, x2: x + 1.18 * S + 10, y1: staffY(bottomLine() + q), y2: staffY(bottomLine() + q), stroke: "#15181d", "stroke-width": 3 }, wrap);
  for (let q = -2; q >= pos; q -= 2) line(q);
  for (let q = 10; q <= pos; q += 2) line(q);
  const up = pos < 4;
  const base = e.dur >= 4 ? "whole" : e.dur >= 2 ? "half" : e.dur >= 1 ? "quarter" : "eighth";
  const glyph = base === "whole" ? GLYPH.whole : GLYPH[base + (up ? "Up" : "Down")];
  const head = el("text", { x, y, "font-size": 4 * S, fill: "#15181d", style: MUSIC_FONT }, wrap);
  head.textContent = glyph;
  const parts = [head];
  if (e.dur === 1.5 || e.dur === 3) {
    const dot = el("text", { x: x + 1.18 * S + 8, y: pos % 2 === 0 ? y - S / 2 : y, "font-size": 4 * S, fill: "#15181d", style: MUSIC_FONT }, wrap);
    dot.textContent = GLYPH.dot;
    parts.push(dot);
  }
  let name = null;
  if (state.names) {
    name = el("text", { x: x + 0.59 * S, y: STAFF_TOP + 4 * S + 100, "text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: "#3b434e", style: "font-family: var(--display)" }, wrap);
    name.textContent = nameOf(written);
    parts.push(name);
  }
  return { wrap, hl, parts, name, x, y, cx: x + 0.59 * S };
}

// Colours: green = played, blue band = now, faded = outside the practised bars.
function paintNotes() {
  if (!state.song) return;
  state.song.events.forEach((e, i) => {
    const n = noteEls[i];
    if (!n) return;
    const inSection = e.bar >= state.from && e.bar <= state.to;
    const now = i === state.cursor && ["follow", "time", "listen", "ready", "count"].includes(state.phase);
    n.wrap.setAttribute("opacity", inSection ? 1 : 0.3);
    n.hl.setAttribute("opacity", now ? 0.14 : 0);
    const colour = state.done.has(i) ? "#1b8f58" : state.skipped.has(i) ? "#8fcfa9" : now && state.phase !== "ready" ? "#1a7fe2" : "#15181d";
    n.parts.forEach(p => p.setAttribute("fill", p === n.name && colour === "#15181d" ? "#3b434e" : colour));
  });
}

/* ---------- Playing ---------- */

const sectionEvents = () => state.song.events.map((e, i) => i).filter(i => state.song.events[i].bar >= state.from && state.song.events[i].bar <= state.to);
const beatMs = () => 60000 / state.tempo;

function chooseSong(song) {
  state.song = song;
  state.from = 0; state.to = song.bars - 1;
  fillBars();
  $("list").hidden = true;
  resetPlay();
}

function resetPlay() {
  silenceVoices();
  state.phase = state.song ? "ready" : "list";
  state.done = new Set();
  state.skipped = new Set();
  state.aheadIdx = null;
  state.lastPitch = null;
  state.matched = {};
  state.cursor = state.song ? sectionEvents()[0] : 0;
  state.lastAccepted = -1;
  state.inBandSince = null;
  buildScene();
  updateButtons();
}

function start() {
  if (!state.song || !state.listening || !$("sheet").hidden || !$("list").hidden) return;
  if (state.phase !== "ready" && state.phase !== "end") return stopPlaying();
  resetPlay();
  ensureCtx();
  if (state.mode === "follow") { state.phase = "follow"; }
  else {
    // One bar of count-in clicks, then the band (drums and bass) and, if chosen, the melody to play along with.
    // With the melody playing, notes are only marked where the mic cancels the device's own sound (iPad voice
    // mode); a laptop's raw mic would hear the speakers and mark notes the child never played.
    state.phase = "count";
    loadSamples(state.inst);
    const c = ensureCtx(), at = c.currentTime + 0.15, beat = 60 / state.tempo, first = sectionStartBeat();
    for (let i = 0; i < BEATS; i++) click(at + i * beat, i === 0);
    const go = at + BEATS * beat, last = (state.to + 1) * BEATS;
    if (state.band) playBand(go, first, last, false);
    if (state.guide) sectionEvents().forEach(i => { const e = state.song.events[i]; playNote(writtenOf(e.step), go + (e.start - first) * beat, e.dur * beat); });
    state.judge = !state.guide || MIC_OPTIONS === true;
    state.t0 = performance.now() + 150 + BEATS * beatMs() - first * beatMs();
    state.muteUntil = performance.now() + 150 + BEATS * beatMs() - 100;
  }
  updateButtons();
  paintNotes();
}

const sectionStartBeat = () => state.song.events[sectionEvents()[0]].start;

// Listen first: a bar of count-in, then the song on the real instrument with the whole band, the marker moving along.
function listen() {
  if (!state.song || !$("sheet").hidden || !$("list").hidden) return;
  if (state.phase === "listen") return stopPlaying();
  resetPlay();
  const c = ensureCtx();
  loadSamples(state.inst).then(() => {
    if (state.phase !== "ready") return;
    const beat = 60 / state.tempo, count = c.currentTime + 0.2, at = count + BEATS * beat, first = sectionStartBeat();
    for (let i = 0; i < BEATS; i++) click(count + i * beat, i === 0);
    let last = 0;
    sectionEvents().forEach(i => {
      const e = state.song.events[i];
      playNote(writtenOf(e.step), at + (e.start - first) * beat, e.dur * beat);
      last = Math.max(last, (e.start - first + e.dur) * beat);
    });
    if (state.band) playBand(at, first, (state.to + 1) * BEATS, true);
    state.phase = "listen";
    state.t0 = performance.now() + 200 + BEATS * beatMs() - first * beatMs();
    state.muteUntil = performance.now() + 200 + BEATS * beatMs() + last * 1000 + 400;
    updateButtons();
  });
}

function stopPlaying() {
  if (!state.song) return;
  state.muteUntil = Math.min(state.muteUntil, performance.now() + 300);
  resetPlay();
}

function finish() {
  state.phase = "end";
  const evs = sectionEvents(), got = evs.filter(i => state.done.has(i)).length;
  tbTrack("song_end", { song: state.song.id, mode: state.mode, got, total: evs.length });
  const words = state.mode === "follow" || !state.judge ? T("wellDone") : got === evs.length ? T("perfect") : got >= evs.length / 2 ? T("veryGood") : T("wellDone");
  g.banner.textContent = words;
  g.banner.setAttribute("opacity", 1);
  playNotes([523.25, 659.25, 783.99, 1046.5], 0.1, 0.5, 0.2);
  for (let i = 0; i < 4; i++) setTimeout(() => fireworks(250 + Math.random() * 800, 120 + Math.random() * 120), i * 350);
  updateButtons();
  paintNotes();
  const song = state.song;
  setTimeout(() => { if (state.phase === "end" && state.song === song) { g.banner.setAttribute("opacity", 0); resetPlay(); } }, 3500);
}

function frame(now) {
  envelope();
  if (now - state.lastAnalyse > 50) { state.lastAnalyse = now; analyse(); }
  if (state.phase === "follow") follow(now);
  else if (state.phase === "count" || state.phase === "time" || state.phase === "listen") inTime(now);
  if (!$("diag").hidden) {
    const db = 20 * Math.log10(Math.max(state.rms, 1e-7));
    const bars = Math.max(0, Math.min(10, Math.round((db + 60) / 4.5)));
    const target = state.song ? writtenOf(state.song.events[state.cursor].step) : null;
    $("diag").textContent = audioLine() + `${T("diagTitle")}\n${T("diagVolume")}  ${"█".repeat(bars)}${"·".repeat(10 - bars)}\n${T("diagPitch")}   ${state.heard ? state.freq.toFixed(0) + " Hz" : "—"}\n${T("diagCents")}   ${state.heard && target ? Math.round(centsTo(target)) : "—"}`;
  }
  requestAnimationFrame(frame);
}

// Follow: wait on the note. A repeat of the same pitch needs a new attack (or, in "hold" mode,
// just the note held again for the hold time after the previous one was accepted).
function follow(now) {
  const evs = sectionEvents(), i = state.cursor, e = state.song.events[i], w = writtenOf(e.step);
  const prev = evs[evs.indexOf(i) - 1];
  const repeat = prev !== undefined && writtenOf(state.song.events[prev].step) === w;
  const fresh = !repeat || state.repeat === "hold" || state.onsetAt > state.lastAccepted;
  const ok = onNote(w) && fresh;
  if (ok) { state.lastInBand = now; if (state.inBandSince === null) state.inBandSince = now; }
  else if (state.inBandSince !== null && now - state.lastInBand > 120) state.inBandSince = null;
  showArrow(w, now);
  // Catching up: if the child is already holding one of the next two notes (another pitch), the app missed
  // the note it was waiting on. It jumps there rather than make the child go back; the skipped note goes light green.
  if (!ok) {
    const at = evs.indexOf(i), hit = [evs[at + 1], evs[at + 2]].find(j => {
      if (j === undefined) return false;
      const wj = writtenOf(state.song.events[j].step);
      return wj !== w && wj !== state.lastPitch && onNote(wj);     // not the tail of the note just played
    });
    if (hit === undefined) state.aheadIdx = null;
    else if (state.aheadIdx !== hit) { state.aheadIdx = hit; state.aheadSince = now; }
    else if (now - state.aheadSince >= FOLLOW_HOLD_MS) {
      for (let k = at; evs[k] !== hit; k++) state.skipped.add(evs[k]);
      state.done.add(hit);
      state.lastAccepted = now;
      state.lastPitch = writtenOf(state.song.events[hit].step);
      state.aheadIdx = null; state.inBandSince = null;
      const next = evs[evs.indexOf(hit) + 1];
      if (next === undefined) { g.arrow.setAttribute("opacity", 0); paintNotes(); return finish(); }
      state.cursor = next;
      if (lineOf(next) !== state.line) drawLine(lineOf(next), true);
      paintNotes();
      return;
    }
  }
  if (state.inBandSince !== null && now - state.inBandSince >= FOLLOW_HOLD_MS) {
    state.done.add(i);
    state.lastAccepted = now;
    state.lastPitch = w;
    state.inBandSince = null;
    const next = evs[evs.indexOf(i) + 1];
    if (next === undefined) { g.arrow.setAttribute("opacity", 0); return finish(); }
    state.cursor = next;
    if (lineOf(next) !== state.line) drawLine(lineOf(next), true);
    paintNotes();
  }
}

// A soft arrow only when a clear wrong note is held for a while (follow mode only).
function showArrow(w, now) {
  const n = noteEls[state.cursor];
  const wrong = n && state.heard && now > state.muteUntil && Math.abs(centsTo(w)) > 150;
  if (wrong) { if (!state.wrongSince) state.wrongSince = now; } else state.wrongSince = 0;
  const show = wrong && now - state.wrongSince > 500;
  g.arrow.setAttribute("opacity", show ? 0.9 : 0);
  if (show) {
    const up = centsTo(w) < 0, ax = n.cx, ay = up ? STAFF_TOP - 80 : STAFF_TOP + 4 * S + 40;
    g.arrow.setAttribute("d", up
      ? `M ${ax} ${ay - 34} L ${ax + 26} ${ay + 6} L ${ax + 9} ${ay + 6} L ${ax + 9} ${ay + 30} L ${ax - 9} ${ay + 30} L ${ax - 9} ${ay + 6} L ${ax - 26} ${ay + 6} Z`
      : `M ${ax} ${ay + 34} L ${ax + 26} ${ay - 6} L ${ax + 9} ${ay - 6} L ${ax + 9} ${ay - 30} L ${ax - 9} ${ay - 30} L ${ax - 9} ${ay - 6} L ${ax - 26} ${ay - 6} Z`);
  }
}

// In time (and listening): the marker follows the clock. A note turns green once the right pitch
// has sounded for long enough while it was due.
function inTime(now) {
  const beat = (now - state.t0) / beatMs(), evs = sectionEvents();
  const first = state.song.events[evs[0]], last = state.song.events[evs[evs.length - 1]];
  if (beat >= first.start && g.count.textContent) { g.count.textContent = ""; g.title.setAttribute("opacity", 1); }
  if (state.phase === "count" || (state.phase === "listen" && beat < first.start)) {
    const left = Math.ceil(first.start - beat);
    g.count.textContent = left > 0 && left <= BEATS ? String(left) : "";
    g.title.setAttribute("opacity", g.count.textContent ? 0 : 1);
    if (beat < first.start) return;
    g.count.textContent = "";
    g.title.setAttribute("opacity", 1);
    if (state.phase === "count") state.phase = "time";
  }
  if (beat >= last.start + last.dur + DETECT_LAG_MS / beatMs()) { g.count.textContent = ""; return state.phase === "listen" ? resetPlay() : finish(); }
  const cur = evs.find(i => { const e = state.song.events[i]; return beat >= e.start && beat < e.start + e.dur; });
  if (cur !== undefined && cur !== state.cursor) {
    state.cursor = cur;
    if (lineOf(cur) !== state.line) drawLine(lineOf(cur), true);
    paintNotes();
  }
  if (state.phase !== "time" || !state.judge) return;
  // Judge by when the sound was made: the detector hears ~0.1 s late (its window is ~0.19 s).
  // A note counts from a little before its start until it ends; a repeat of the same pitch
  // also needs its own attack, so the tail of the previous note cannot earn it.
  const heardBeat = (now - DETECT_LAG_MS - state.t0) / beatMs();
  evs.forEach((i, k) => {
    const e = state.song.events[i];
    if (state.done.has(i) || heardBeat < e.start - 0.15 || heardBeat >= e.start + e.dur) return;
    const prev = state.song.events[evs[k - 1]];
    if (prev && prev.step === e.step && state.onsetAt < state.t0 + (e.start - 0.25) * beatMs()) return;
    if (onNote(writtenOf(e.step))) {
      state.matched[i] = (state.matched[i] || 0) + Math.min(100, now - (state.lastFrame || now));
      if (state.matched[i] >= Math.min(300, 0.5 * e.dur * beatMs())) { state.done.add(i); paintNotes(); }
    }
  });
  state.lastFrame = now;
}

function fireworks(x, y) {
  const colours = ["#f2b705", "#ff6f59", "#1a7fe2", "#2fa36b", "#7a5cf0"];
  const colour = colours[Math.floor(Math.random() * colours.length)];
  for (let i = 0; i < 22; i++) {
    const a = (Math.PI * 2 * i) / 22, d = 110 + Math.random() * 40;
    const c = el("circle", { cx: x, cy: y, r: 7, fill: colour }, $("scene"));
    const t0 = performance.now();
    (function fly(now) {
      const p = (now - t0) / 1300;
      if (p >= 1) { c.remove(); return; }
      const e = 1 - Math.pow(1 - p, 3);
      c.setAttribute("cx", x + Math.cos(a) * d * e);
      c.setAttribute("cy", y + Math.sin(a) * d * e + 60 * p * p);
      c.setAttribute("opacity", 1 - p);
      requestAnimationFrame(fly);
    })(t0);
  }
}

/* ---------- Panels ---------- */

// The songs that fit the chosen notes, then the ones that need more notes (fewest missing first):
// those are faded and locked, show which notes they still need, and open the settings when tapped.
function buildList() {
  const box = $("cards");
  box.textContent = "";
  const missing = song => stepsOf(song).filter(st => { const w = writtenOf(st); return w === undefined || !state.chosen.includes(w); });
  const open = SONGS.filter(playable), locked = SONGS.filter(song => !playable(song)).sort((a, b) => missing(a).length - missing(b).length);
  [...open, ...locked].forEach(song => {
    const lock = !playable(song), need = lock ? missing(song) : [];
    const b = document.createElement("button");
    b.className = "song-card" + (lock ? " locked" : "");
    const t = document.createElement("b");
    t.textContent = titleOf(song);
    b.appendChild(t);
    stepsOf(song).forEach(st => {
      const c = document.createElement("span"), w = writtenOf(st);
      c.textContent = (need.includes(st) ? "+ " : "") + (w === undefined ? "?" : nameOf(w));
      if (need.includes(st)) c.className = "missing";
      b.appendChild(c);
    });
    b.addEventListener("click", () => lock ? toggleSheet(true) : chooseSong(song));
    box.appendChild(b);
  });
  const later = document.createElement("a");
  later.className = "song-card later";
  later.href = "mailto:hello@tonebee.app?subject=" + encodeURIComponent(T("moreSubject")) + "&body=" + encodeURIComponent(T("moreBody"));
  later.innerHTML = "<b></b><span></span>";
  later.children[0].textContent = T("moreSongs");
  later.children[1].textContent = T("moreAsk");
  later.addEventListener("click", () => tbTrack("notify_click", { what: "songs" }));
  box.appendChild(later);
  $("empty").hidden = open.length > 0;
  $("more").textContent = locked.length && open.length ? T("lockedNote") : "";
}

function showList() {
  stopPlaying();
  state.phase = "list";
  buildList();
  $("list").hidden = false;
  updateButtons();
}

function fillBars() {
  const f = $("fromBar"), t = $("toBar");
  f.textContent = ""; t.textContent = "";
  for (let b = 0; b < state.song.bars; b++) {
    f.add(new Option(String(b + 1), String(b)));
    t.add(new Option(String(b + 1), String(b)));
  }
  f.value = String(state.from); t.value = String(state.to);
}

function segButtons(box, items, isOn, pick) {
  box.textContent = "";
  items.forEach(([value, label]) => {
    const b = document.createElement("button");
    b.className = "seg-btn";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(isOn(value)));
    b.addEventListener("click", () => { pick(value); save(); buildPanels(); });
    box.appendChild(b);
  });
}

function buildPanels() {
  const I = INSTRUMENTS[state.inst];
  const box = $("noteChips");
  box.textContent = "";
  I.notes.forEach(n => {
    const b = document.createElement("button");
    b.className = "note-chip";
    b.setAttribute("aria-pressed", String(state.chosen.includes(n)));
    b.innerHTML = nameOf(n) + (I.open.includes(n) ? "<small>" + T("open") + "</small>" : "");
    b.addEventListener("click", () => {
      const i = state.chosen.indexOf(n);
      if (i >= 0) { if (state.chosen.length > 1) state.chosen.splice(i, 1); }
      else state.chosen.push(n);
      state.chosen.sort((a, c) => a - c);
      save(); buildPanels();
    });
    box.appendChild(b);
  });
  segButtons($("namesSeg"), [[true, T("show")], [false, T("hide")]], v => state.names === v, v => { state.names = v; });
  segButtons($("styleSeg"), [["sol", "דו רה מי"], ["abc", "C D E"]], v => state.style === v, v => { state.style = v; });
  $("styleSeg").hidden = LANG === "en";       // English names notes by letter only
  segButtons($("repeatSeg"), [["attack", T("newTongue")], ["hold", T("justHold")]], v => state.repeat === v, v => { state.repeat = v; });
  segButtons($("tempoSeg"), TEMPOS.map(t => [t, "♩=" + t]), v => state.tempo === v, v => { state.tempo = v; });
  updateButtons();
}

function updateButtons() {
  $("modeFollow").setAttribute("aria-pressed", String(state.mode === "follow"));
  $("modeTime").setAttribute("aria-pressed", String(state.mode === "time"));
  $("bandBtn").setAttribute("aria-pressed", String(state.band));
  $("guideBtn").setAttribute("aria-pressed", String(state.guide));
  $("guideBtn").hidden = state.mode !== "time";
  const busy = ["follow", "count", "time"].includes(state.phase);
  $("playBtn").textContent = busy ? T("stop") : T("play");
  $("playBtn").classList.toggle("stop", busy);
  $("listenBtn").textContent = state.phase === "listen" ? T("stop") : T("listen");
  const songOpen = !!state.song && $("list").hidden;
  ["playBtn", "listenBtn"].forEach(id => $(id).disabled = !songOpen);
  $("transport").classList.toggle("hide", !songOpen);
}

function setMode(m) { state.mode = m; save(); stopPlaying(); updateButtons(); }

function playOrStop() { if (!state.listening) startMic().then(() => { if (state.listening) start(); }); else start(); }

function toggleSheet(show) {
  const open = show === undefined ? $("sheet").hidden : show;
  if (open) stopPlaying();
  $("sheet").hidden = !open;
  if (open) buildPanels();
  else {
    // Notes changed: the open song may no longer fit; the list always reflects the choice.
    if (state.song && !playable(state.song)) { state.song = null; showList(); }
    else if (state.song) resetPlay(); else buildList();
  }
}

function toggleFullscreen() {
  const d = document, root = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (p && p.catch) p.catch(() => {}); }
  } catch (_) {}
}

/* ---------- Wiring ---------- */

$("startBtn").addEventListener("click", startMic);
$("overlay").addEventListener("click", e => { if (e.target === $("overlay") || e.target.tagName === "P" || e.target.tagName === "DIV") startMic(); });
$("listBtn").addEventListener("click", showList);
$("settings").addEventListener("click", () => toggleSheet());
$("sheetDone").addEventListener("click", () => toggleSheet(false));
$("fullscreen").addEventListener("click", toggleFullscreen);
$("modeFollow").addEventListener("click", () => setMode("follow"));
$("modeTime").addEventListener("click", () => setMode("time"));
$("playBtn").addEventListener("click", playOrStop);
$("emptyBtn").addEventListener("click", () => toggleSheet(true));
$("listenBtn").addEventListener("click", listen);
$("bandBtn").addEventListener("click", () => { state.band = !state.band; save(); stopPlaying(); updateButtons(); });
$("guideBtn").addEventListener("click", () => { state.guide = !state.guide; save(); stopPlaying(); updateButtons(); });
$("fromBar").addEventListener("change", () => { state.from = +$("fromBar").value; if (state.to < state.from) { state.to = state.from; $("toBar").value = String(state.to); } resetPlay(); });
$("toBar").addEventListener("change", () => { state.to = +$("toBar").value; if (state.from > state.to) { state.from = state.to; $("fromBar").value = String(state.from); } resetPlay(); });
document.addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); });

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t.tagName === "BUTTON" || t.tagName === "SELECT" || t.tagName === "INPUT") return;
  const c = e.code;
  if (paused) { if (c === "Escape" || c === "Space" || c === "Enter") { e.preventDefault(); setPaused(false); } return; }
  if (c === "Space" || c === "Enter" || c === "PageDown" || c === "ArrowRight") { e.preventDefault(); playOrStop(); }
  else if (c === "KeyH" || c === "PageUp" || c === "ArrowLeft") { e.preventDefault(); listen(); }
  else if (c === "KeyM") setMode(state.mode === "time" ? "follow" : "time");
  else if (c === "KeyL") showList();
  else if (c === "KeyS") toggleSheet();
  else if (c === "Escape") { if (!$("sheet").hidden) toggleSheet(false); else setPaused(true); }
  else if (c === "KeyR") state.noiseFloor = 0.002;
  else if (c === "KeyD") $("diag").hidden = !$("diag").hidden;
  else if (c === "KeyF") toggleFullscreen();
});

const params = new URLSearchParams(location.search);
let savedInst = null;
try { savedInst = localStorage.getItem("brass-inst"); } catch (_) {}
if (INSTRUMENTS[params.get("inst")]) state.inst = params.get("inst");
else if (INSTRUMENTS[savedInst]) state.inst = savedInst;
load();
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) || matchMedia("(display-mode: standalone)").matches) $("fullscreen").hidden = true;
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

buildScene();
buildPanels();
buildList();
// Turning the phone changes how many bars fit on a line: draw the current line again.
PHONE_UPRIGHT.addEventListener("change", () => { if (setLineBars()) buildScene(); });
if (location.protocol === "file:") fail(T("onlyOnline"));
requestAnimationFrame(frame);
document.getElementById("pauseBtn").addEventListener("click", () => setPaused(true));
document.getElementById("pauseBox").addEventListener("click", e => { if (e.target.id !== "pauseStop") setPaused(false); });
document.getElementById("pauseStop").addEventListener("click", e => { e.stopPropagation(); setPaused(false); stopPlaying(); });
// How to play: a card shown by itself the first time this game is opened on this device, then from "?".
(function cover() {
  const key = "tonebee-seen-songs", card = $("coverCard"), demo = $("demo");
  let inst = "trumpet";
  try { inst = localStorage.getItem("brass-inst") || inst; } catch (_) {}
  demo.querySelectorAll(".d-inst").forEach(i => i.setAttribute("href", `icons/inst/${inst}.png`));
  const show = on => { card.hidden = !on; if (on) $("coverPlay").focus(); };
  let seen = false;
  try { seen = !!localStorage.getItem(key); } catch (_) {}
  show(!seen);
  if (!seen) tbTrack("howto", { how: "auto" });
  $("coverPlay").addEventListener("click", () => { try { localStorage.setItem(key, "1"); } catch (_) {} show(false); });
  $("helpBtn").addEventListener("click", e => { e.stopPropagation(); show(true); tbTrack("howto", { how: "replay" }); });
  // While the card is up, a key only closes it (Space must not start the game behind it).
  document.addEventListener("keydown", e => { if (!card.hidden) { e.preventDefault(); e.stopImmediatePropagation(); $("coverPlay").click(); } }, true);
})();

// Analytics: how long the game was really used (open and on screen; for mic games, also listening), sent on leaving.
(function playTime() {
  let open = 0, live = 0, last = performance.now();
  setInterval(() => {
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    if (document.hidden || dt > 5) return;
    open += dt;
    if (typeof state === "object" && state && state.listening) live += dt;
  }, 1000);
  const send = () => {
    if (open >= 3) tbTrack("game_time", { seconds: Math.round(open), seconds_listening: Math.round(live) }, { transport: "sendBeacon" });
    open = live = 0;
  };
  addEventListener("pagehide", send);
  document.addEventListener("visibilitychange", () => { if (document.hidden) send(); });
})();

// iPhone has no full screen for web pages: hide the button there (iPad, Android and computers keep it).
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) { const fs = document.getElementById("fullscreen"); if (fs) fs.style.display = "none"; }
</script>
