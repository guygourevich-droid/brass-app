<meta name="theme-color" content="#ffffff">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script>
  // Moving house: the old address (GitHub Pages) hands this device's settings to tonebee.app and sends the page there.
  (function () {
    var keep = /^(brass-|right-note-|ninja-|horn-ladder|breath$|buzz$|songs$|sound-game$)/;
    try {
      if (/github\.io$/.test(location.hostname)) {
        var d = {};
        for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (keep.test(k)) d[k] = localStorage.getItem(k); }
        var page = location.pathname.split("/").pop() || "index.html";
        location.replace("https://tonebee.app/" + page + location.search + "#move=" + encodeURIComponent(JSON.stringify(d)));
        return;
      }
      var m = location.hash.match(/^#move=(.*)$/);
      if (m) {
        var s = JSON.parse(decodeURIComponent(m[1]));
        for (var key in s) if (keep.test(key) && typeof s[key] === "string") localStorage.setItem(key, s[key]);
        history.replaceState(null, "", location.pathname + location.search);
      }
    } catch (_) {}
  })();
  // English pages lay out left to right from the first paint (the language block fills in the words).
  try { if (/[?&]lang=en/.test(location.search) || (!/[?&]lang=he/.test(location.search) && localStorage.getItem("brass-lang") === "en")) { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; } } catch (_) {}
</script>
<style>
  :root {
    --paper: #ffffff;
    --ink: #15181d;
    --ink-2: #3b434e;
    --muted: #66707d;
    --line: #e1e7ef;
    --console: #f2f5f9;
    --blue: #1a7fe2;
    --brass-deep: #8f5b0e;
    --font: "Rubik", "Lexend", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 48px); padding-block: clamp(28px, 6vh, 64px); display: grid; gap: clamp(28px, 5vh, 48px); }

  .masthead { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .masthead img { width: clamp(56px, 8vw, 76px); height: auto; border-radius: 22%; }
  .masthead h1 { margin: 0; font-weight: 700; font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.01em; line-height: 1.05; }
  .masthead p { margin: 4px 0 0; color: var(--muted); font-size: clamp(15px, 1.8vw, 18px); }
  /* Who is playing: the instrument and the language, one tap to change them. */
  .me { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 16px 6px 8px; cursor: pointer; min-height: 52px; }
  .me:hover { border-color: var(--blue); }
  .me img { width: 40px; height: 40px; }
  .me b { font-weight: 700; }
  .me span { color: var(--muted); }

  .section-k { margin: 0 0 12px; font-size: 13px; letter-spacing: .08em; color: var(--brass-deep); font-weight: 700; }
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
  .tool {
    display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center;
    padding: 20px 22px; border: 2px solid var(--line); border-radius: 18px;
    color: inherit; text-decoration: none; background: var(--paper);
    transition: border-color .15s, transform .15s;
  }
  .tool:hover { border-color: var(--blue); }
  .tool:active { transform: scale(.99); }
  .tool svg { width: clamp(110px, 18vw, 150px); height: auto; display: block; }
  .tool h2 { margin: 0; font-weight: 700; font-size: clamp(22px, 2.6vw, 26px); display: flex; align-items: baseline; gap: 10px; }
  .num { display: inline-grid; place-items: center; min-width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--console); color: var(--brass-deep); font-size: .72em; font-weight: 700; }
  .tool p { margin: 4px 0 10px; color: var(--ink-2); max-width: 44ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--console); color: var(--ink-2); }

  .home { background: var(--console); border-radius: 18px; padding: 18px 22px; }
  .home h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
  .home ol { margin: 0; padding-inline-start: 1.4em; display: grid; gap: 4px; font-size: 17px; color: var(--ink-2); }
  .install { border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 15px; max-width: 70ch; }
  .install b { color: var(--ink-2); }
  @media (display-mode: standalone) { .install { display: none; } }

  /* First visit (and "change"): the language, then the instrument. */
  .setup { position: fixed; inset: 0; z-index: 10; background: linear-gradient(180deg, #e8f4ff 0%, #ffffff 60%); overflow-y: auto; display: flex; padding: 24px 16px; }
  body:has(> .setup:not([hidden])) { overflow: hidden; }
  .setup[hidden] { display: none; }
  .card { width: min(100%, 760px); margin: auto; text-align: center; }
  .card img { width: 84px; border-radius: 22%; }
  .card h2 { margin: 14px 0 22px; font-size: clamp(24px, 4vw, 34px); font-weight: 700; }
  .card h2.two span { display: block; }
  .card h2.two span + span { font-size: .8em; color: var(--ink-2); }
  .langs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 3vw, 16px); max-width: 520px; margin: 0 auto; }
  .lang { border: 3px solid var(--line); background: #fff; border-radius: 22px; min-height: clamp(88px, 22vw, 110px); font-size: clamp(26px, 4vw, 38px); font-weight: 700; cursor: pointer; }
  .lang:hover, .inst:not([disabled]):hover { border-color: var(--blue); }
  .lang[aria-pressed="true"], .inst[aria-pressed="true"] { border-color: var(--blue); background: #eef6ff; }
  .insts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 40vw), 1fr)); gap: clamp(10px, 2.5vw, 14px); }
  .inst { position: relative; border: 3px solid var(--line); background: #fff; border-radius: 20px; padding: 14px 10px 12px; cursor: pointer; display: grid; justify-items: center; align-content: start; gap: 6px; font-size: 20px; font-weight: 700; }
  .inst img { width: 116px; height: 116px; }
  .inst[disabled] { cursor: default; color: var(--muted); background: #f7f9fc; }
  .inst[disabled] img { opacity: .6; filter: saturate(.55); }
  .soon { white-space: nowrap; font-size: 13px; font-weight: 600; color: var(--brass-deep); background: #fff3d6; border-radius: 999px; padding: 1px 10px; }
  .back { margin-top: 22px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 16px; min-height: 44px; }

  /* Phones: each tile is the picture and the name on one line, the sentence under them; no chips. */
  @media (max-width: 600px) {
    .wrap { gap: 22px; padding-block: 20px 28px; }
    .masthead { gap: 12px 14px; }
    .me { margin-inline-start: 0; }
    .home { padding: 14px 16px; }
    .home h2 { font-size: 18px; }
    .home ol { font-size: 15px; }
    .tools { gap: 12px; }
    .tool { grid-template-columns: 96px 1fr; gap: 8px 14px; padding: 14px 16px; }
    .tool > div { display: contents; }
    .tool svg { width: 96px; }
    .tool h2 { font-size: 22px; align-self: center; }
    .tool p { grid-column: 1 / -1; margin: 0; font-size: 15px; }
    .chips { display: none; }
    .inst { padding: 10px 8px; font-size: 18px; }
    .inst img { width: min(104px, 26vw); height: auto; }
  }
  /* Phone on its side: everything in the setup fits on one screen. */
  @media (max-height: 500px) {
    .setup { padding-block: 12px; }
    .card > img { width: 56px; }
    .card h2 { margin: 6px 0 12px; font-size: 22px; }
    .lang { min-height: 76px; }
    .insts { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
    .soon { font-size: 11px; padding: 0 6px; }
    .inst { padding: 6px; gap: 2px; font-size: 16px; }
    .inst img { width: 64px; height: 64px; }
    .back { margin-top: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { .tool { transition: none; } }
</style>

<script>

};
const T = (key, ...args) => {
  const v = (TEXT[LANG] && TEXT[LANG][key]) ?? COMMON[LANG][key] ?? (TEXT.he && TEXT.he[key]) ?? COMMON.he[key] ?? key;
  return typeof v === "function" ? v(...args) : v;
};
function applyText() {
  const root = document.documentElement;
  root.lang = LANG;
  root.dir = LANG === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = T(n.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach(n => { n.innerHTML = T(n.dataset.tHtml); });
  document.querySelectorAll("[data-t-title]").forEach(n => { n.title = T(n.dataset.tTitle); });
  document.querySelectorAll("[data-t-aria]").forEach(n => { n.setAttribute("aria-label", T(n.dataset.tAria)); });
  if (TEXT[LANG] && TEXT[LANG].pageTitle) document.title = T("pageTitle");
}
const $ = id => document.getElementById(id);

const TEXT = {
  he: {
    tagline: "משחקים פשוטים לשיעורי כלי נשיפה למתחילים",

    homeLabel: "בבית", homeTitle: "מתאמנים בבית?",
    home1: "בוחרים משחק. הכלי שלכם כבר מוכן בכל המשחקים.",
    home2: "לוחצים על ⚙ ומסמנים את הצלילים שכבר למדתם.",
    home3: "במשחקים עם מיקרופון, כשהדפדפן שואל, מאשרים את המיקרופון.",
    home4: "בטלפון מסובבים את המסך לרוחב, כך הכול גדול יותר.",
    games: "משחקים",
    install: "<b>להתקין כמו אפליקציה:</b> באייפד ובאייפון פותחים את הדף בספארי, לוחצים שיתוף ואז <b>הוספה למסך הבית</b>. באנדרואיד: בכרום, תפריט ⋮ ואז <b>הוספה למסך הבית</b>. אחרי הפעם הראשונה זה עובד גם בלי אינטרנט.",
    instTitle: "על מה אתם מנגנים?", soon: "בקרוב", backLang: "‹ שפה",
    sax: "סקסופון", flute: "חליל צד", clarinet: "קלרינט", recorder: "חלילית",
    mic: "מיקרופון", tileDo: "דו",
    t_ramzor: "רמזור", d_ramzor: "אדום עוצרים, צהוב מתכוננים ונושמים, ירוק מנגנים. בשליטה שלך.", c_ramzor: ["כיתה", "ללא מיקרופון"],
    t_breath: "נשימה", d_breath: "שואפים, ואז נושפים לאט: בועת סבון ענקית גדלה, או שהרוח לוקחת את זרעי שן הארי. לחיצה אחת = נשימה אחת.", c_breath: ["🫧 · 🌼", "נושפים 4 · 8 · 12 · 16"],
    t_buzz: "זמזום", d_buzz: "מזמזמים בפומית והדבורה עפה: מזמזמים, מגיעים לאותו צליל של הפרח, מחזיקים ארוך ויציב, ועושים סירנות.", c_buzz: ["@mic", "🐝 · 🌸 · 🍯 · 〰️"],
    t_long: "צליל ארוך", d_long: "צליל אחד ארוך מטיס חללית מהאדמה אל החלל. ככל שמחזיקים יותר, מגיעים רחוק יותר.", c_long: ["@mic", "4 · 8 · 12 · 16 · ∞"],
    t_right: "צליל נכון", d_right: "התו שרוצים לנגן והתו שבאמת יוצא, על אותה חמשה. מחזיקים את הצליל הנכון ומקבלים כוכב.", c_right: ["@mic", "בחירת צלילים"],
    t_ladder: "סולם", d_ladder: "כל שלב בסולם הוא צליל. הקוף מטפס לצליל שמנגנים, ותופסים את הבננה.", c_ladder: ["@mic", "צלילים אמיתיים"],
    t_ninja: "נינג'ה", d_ninja: "תווים עפים פנימה אחד אחרי השני. מנגנים את התו לפני שהזמן נגמר, והנינג'ה חותך אותו.", c_ninja: ["@mic", "סיבוב לכל ילד"],
    t_songs: "שירים", d_songs: "מנגנים שיר שלם: תו אחרי תו, ואחר כך בקצב עם להקה. אפשר להקשיב קודם ולתרגל רק קטע.", c_songs: ["@mic", "12 שירים"],
    t_names: "תווים", d_names: "מכירים את הצלילים הראשונים וקוראים להם בשם, במפתח של הכלי שלכם, ושומעים את הצליל האמיתי.", c_names: ["קריאת תווים", "דו רה מי · C D E", "7 שלבים"],
    t_clap: "קצב", d_clap: "שומעים קצב ומוחאים אותו בחזרה, או בוחרים איזה משלושה קצבים שמעתם.", c_clap: ["הד", "חידון שמיעה", "9 שלבים"]
  },
  en: {
    tagline: "Simple games for beginner brass lessons",
    change: "Change instrument or language", langName: "English",
    homeLabel: "At home", homeTitle: "Practising at home?",
    home1: "Pick a game. Your instrument is already set in every game.",
    home2: "Tap ⚙ and tick the notes you've already learned.",
    home3: "In the microphone games, allow the microphone when the browser asks.",
    home4: "On a phone, turn the screen sideways: everything gets bigger.",
    games: "Games",
    install: "<b>Install it like an app:</b> on an iPad or iPhone, open this page in Safari, tap Share, then <b>Add to Home Screen</b>. On Android, in Chrome: menu ⋮, then <b>Add to Home Screen</b>. After the first time it works offline too.",
    instTitle: "What do you play?", soon: "Coming soon", backLang: "‹ Language",
    sax: "Saxophone", flute: "Flute", clarinet: "Clarinet", recorder: "Recorder",
    mic: "Microphone", tileDo: "C",
    t_ramzor: "Traffic Light", d_ramzor: "Red: stop. Yellow: get ready and breathe. Green: play. You're in control.", c_ramzor: ["Class", "No microphone"],
    t_breath: "Breathing", d_breath: "Breathe in, then blow out slowly: a giant soap bubble grows, or the wind carries off the dandelion seeds. One tap = one breath.", c_breath: ["🫧 · 🌼", "Blow out 4 · 8 · 12 · 16"],
    t_buzz: "Buzzing", d_buzz: "Buzz on the mouthpiece and the bee flies: buzz, match the flower's note, hold it long and steady, then play sirens.", c_buzz: ["@mic", "🐝 · 🌸 · 🍯 · 〰️"],
    t_long: "Long Note", d_long: "One long note flies a rocket from the ground into space. The longer you hold it, the further it goes.", c_long: ["@mic", "4 · 8 · 12 · 16 · ∞"],
    t_right: "Right Note", d_right: "The note you want and the note that really comes out, on the same staff. Hold the right note to earn a star.", c_right: ["@mic", "Choose the notes"],
    t_ladder: "Ladder", d_ladder: "Each rung is a note. The monkey climbs to the note you play: catch the banana.", c_ladder: ["@mic", "Real instrument sounds"],
    t_ninja: "Note Ninja", d_ninja: "Notes fly in one after another. Play each one before time runs out and the ninja slices it.", c_ninja: ["@mic", "One round per child"],
    t_songs: "Songs", d_songs: "Play a whole song: note by note, then in time with a band. Listen first, and practise just a section.", c_songs: ["@mic", "12 songs"],
    t_names: "Note Names", d_names: "Meet the first notes and name them, in your instrument's clef, and hear the real sound.", c_names: ["Reading", "C D E", "7 levels"],
    t_clap: "Clap-Along", d_clap: "Hear a rhythm and clap it back, or pick which of three rhythms you heard.", c_clap: ["Echo", "Ear quiz", "9 levels"]
  }
};

// Instruments: the three that every game knows, then the woodwinds that are on their way.
const INSTRUMENTS = [
  { id: "trumpet", ready: true }, { id: "trombone", ready: true }, { id: "horn", ready: true },
  { id: "sax" }, { id: "flute" }, { id: "clarinet" }, { id: "recorder" }
];
// Instrument pictures: icons/inst/<id>.png (cut from the picture sheet the teacher chose).
const instPic = id => `icons/inst/${id}.png`;
const instName = id => T(id);

const TILES = { "ramzor.html": "ramzor", "balloon-breath.html": "breath", "buzz-along.html": "buzz", "sound-game.html": "long",
  "right-note.html": "right", "horn-ladder.html": "ladder", "ninja.html": "ninja", "songs.html": "songs", "note-names.html": "names", "clap-along.html": "clap" };

function fillTiles() {
  document.querySelectorAll(".tool").forEach(a => {
    const k = TILES[a.getAttribute("href")];
    a.querySelector("[data-name]").textContent = T("t_" + k);
    a.querySelector("p").textContent = T("d_" + k);
    a.querySelectorAll("svg text").forEach(t => { if (t.textContent.trim() === "Do" || t.dataset.do) { t.dataset.do = 1; t.textContent = T("tileDo"); } });
    const chips = a.querySelector(".chips");
    chips.textContent = "";
    T("c_" + k).forEach(c => {
      const s = document.createElement("span");
      s.className = "chip";
      s.textContent = c[0] === "@" ? T(c.slice(1)) : c;
      chips.appendChild(s);
    });
  });
}

function fillMe() {
  let inst = "trumpet";
  try { const s = localStorage.getItem("brass-inst"); if (INSTRUMENTS.some(i => i.id === s && i.ready)) inst = s; } catch (_) {}
  $("meIcon").src = instPic(inst);
  $("meInst").textContent = instName(inst);
  $("meLang").textContent = T("langName");
}

/* ---------- Setup: the language, then the instrument ---------- */

function showSetup(step) {
  $("setup").hidden = false;
  $("stepLang").hidden = step !== "lang";
  $("stepInst").hidden = step !== "inst";
  $("langHe").setAttribute("aria-pressed", String(LANG === "he"));
  $("langEn").setAttribute("aria-pressed", String(LANG === "en"));
  if (step === "inst") {
    $("instTitle").textContent = T("instTitle");
    $("backLang").textContent = T("backLang");
    let cur = null;
    try { cur = localStorage.getItem("brass-inst"); } catch (_) {}
    const box = $("insts");
    box.textContent = "";
    INSTRUMENTS.forEach(i => {
      const b = document.createElement("button");
      b.className = "inst";
      b.innerHTML = `<img src="${instPic(i.id)}" alt="" width="104" height="104"><span></span>` + (i.ready ? "" : `<span class="soon"></span>`);
      b.children[1].textContent = instName(i.id);
      if (!i.ready) { b.disabled = true; b.querySelector(".soon").textContent = T("soon"); }
      b.setAttribute("aria-pressed", String(i.id === cur));
      b.addEventListener("click", () => {
        try { localStorage.setItem("brass-inst", i.id); } catch (_) {}
        $("setup").hidden = true;
        fillMe();
      });
      box.appendChild(b);
    });
  }
}

function chooseLang(l) {
  try { localStorage.setItem("brass-lang", l); } catch (_) {}
  // The whole page changes language and direction: simplest and surest is to load it again, on the instruments.
  if (l !== LANG) location.replace(location.pathname + "?setup=inst");
  else showSetup("inst");
}

$("langHe").addEventListener("click", () => chooseLang("he"));
$("langEn").addEventListener("click", () => chooseLang("en"));
$("backLang").addEventListener("click", () => showSetup("lang"));
$("me").addEventListener("click", () => showSetup("lang"));

applyText();
fillTiles();
fillMe();
let chosen = false;
try { chosen = !!localStorage.getItem("brass-lang"); } catch (_) {}
const askFor = new URLSearchParams(location.search).get("setup");
if (askFor === "inst") { history.replaceState(null, "", location.pathname); showSetup("inst"); }
else if (!chosen) showSetup("lang");

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
