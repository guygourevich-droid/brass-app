<script>
  // Moving house: the old address (GitHub Pages) hands this device's settings to tonebee.app and sends the page there.
  (function () {
    var keep = /^(brass-|right-note-|ninja-|horn-ladder|breath$|buzz$|songs$|sound-game$)/;
    try {
      if (/github\.io$/.test(location.hostname) && navigator.onLine !== false) {   // offline, the old copy keeps working
        var d = {};
        for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (keep.test(k)) d[k] = localStorage.getItem(k); }
        var page = location.pathname.split("/").pop() || "index.html";
        location.replace("https://tonebee.app/" + page + location.search + "#move=" + encodeURIComponent(JSON.stringify(d)));
        return;
      }
      var m = location.hash.match(/^#move=(.*)$/);
      if (m) {
        var s = JSON.parse(decodeURIComponent(m[1]));
        // Only what this device doesn't have yet: an old home-screen icon opens with #move every time.
        for (var key in s) if (keep.test(key) && typeof s[key] === "string" && localStorage.getItem(key) === null) localStorage.setItem(key, s[key]);
        history.replaceState(null, "", location.pathname + location.search);
      }
      // A link straight to a game on a new device: language and instrument first (home), then back to the game.
      var here = location.pathname.split("/").pop();
      if (/^(balloon-breath|buzz-along|sound-game|right-note|horn-ladder|ninja|songs|note-names)\.html$/.test(here)
        && !localStorage.getItem("brass-inst") && !/[?&]test=/.test(location.search))
        location.replace("index.html?next=" + encodeURIComponent(here + location.search));
    } catch (_) {}
  })();
  // English pages lay out left to right from the first paint (the language block fills in the words).
  try { if (/[?&]lang=en/.test(location.search) || (!/[?&]lang=he/.test(location.search) && localStorage.getItem("brass-lang") === "en")) { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; } } catch (_) {}
</script>
<!-- instruments: edit in index.html only, then `node tests/sync-instruments.mjs` copies it to every page -->
<script>
/* ---------- Instruments: the one list every page reads ----------
   One entry per instrument, in the order of the setup screen. Notes are WRITTEN midi, what the child reads
   (60 = C4, 62 = D4, 64 = E4, 65 = F4, 67 = G4, 69 = A4, 71 = B4, 72 = C5); sounds play at CONCERT pitch
   (written = concert + toWritten).
   ready    false = on the setup screen as "coming soon"
   clef     "treble" | "bass"
   key      the written key of the songs ("C", "G", "Bb"…, see KEY_SIG): its key signature, and do (step 1 of every
            song) = the lowest note in `notes` with the key's name. Black keys are flats, except the key's own sharps.
   hz       [low, high] concert Hz the note games listen between: about 0.8 × the lowest note and 2 × the highest,
            so an overblown octave shows as a wrong note, not as the right one.
   notes    the notes the teacher can tick (Right Note's picker, shared with Note Ninja, Songs and the Ladder);
            keep them on or near the staff (treble: A3 to G5), where every game screen has room
   def      ticked on a new device
   open     notes with no valves (brass), marked "no fingers" in the picker
   samples  recordings in sounds/<id>/, named by CONCERT pitch with flats: cents off equal temperament (playback
            corrects it). A note more than 3 semitones from every recording plays a plain tone.
   games    the home tiles it shows; a link to any other game goes home
   Names are in index.html TEXT, pictures in icons/inst/<id>.png. Buzzing and the Ladder's open notes keep their
   brass-only numbers in their own pages. */
const INSTRUMENT_DATA = {
  trumpet: {
    ready: true, clef: "treble", toWritten: 2, key: "C", hz: [180, 1000],
    notes: [60, 62, 64, 65, 67, 69, 71, 72], def: [60, 62, 64, 65, 67], open: [60, 67, 72],
    samples: { Bb3: -10, C4: 16, D4: 13, Eb4: 3, F4: -3, G4: 11, A4: 7, Bb4: 8 },
    games: "ramzor breath buzz long right ladder ninja songs names clap"
  },
  trombone: {
    ready: true, clef: "bass", toWritten: 0, key: "Bb", hz: [80, 500],
    notes: [46, 48, 50, 51, 53, 55, 57, 58], def: [46, 48, 50, 51, 53], open: [46, 53, 58],
    samples: { Bb2: -5, C3: -7, D3: -16, Eb3: -24, F3: 2, G3: 1, A3: 1, Bb3: 10 },
    games: "ramzor breath buzz long right ladder ninja songs names clap"
  },
  horn: {
    ready: true, clef: "treble", toWritten: 7, key: "C", hz: [130, 800],
    notes: [60, 62, 64, 65, 67, 69, 71, 72, 76], def: [60, 62, 64, 65, 67], open: [60, 67, 72, 76],
    samples: { F2: -34, C3: 5, F3: 13, G3: 4, A3: -14, Bb3: 10, C4: -7, D4: 9, E4: 8, Eb4: 11, F4: 14, G4: 18, A4: 7, C5: 2 },
    games: "ramzor breath buzz long right ladder ninja songs names clap"
  },
  sax: {      // alto sax in E♭: written G = concert B♭, the band's first key
    ready: true, clef: "treble", toWritten: 9, key: "G", hz: [110, 900],
    notes: [62, 64, 65, 66, 67, 69, 71, 72, 74, 76, 77, 78, 79], def: [67, 69, 71, 72, 74], open: [],   // F♮ too: written C is the band's 2nd key
    samples: { F3: -11, G3: 0, A3: -2, Bb3: 1, C4: -3, D4: 0, Eb4: -9, F4: 14, G4: 19, A4: 10, Bb4: 15 },
    games: "ramzor breath long right ladder ninja songs names clap"
  },
  flute: {
    ready: true, clef: "treble", toWritten: 0, key: "Bb", hz: [200, 2400],
    notes: [65, 67, 69, 70, 72, 74, 75, 77, 79], def: [70, 72, 74, 75, 77], open: [],
    samples: { F4: 8, G4: 11, A4: 13, Bb4: 19, C5: 17, D5: 13, Eb5: 8, F5: 10, G5: 24, A5: 16, Bb5: 21 },
    games: "ramzor breath long right ladder ninja songs names clap"
  },
  clarinet: { // B♭ clarinet: written C = concert B♭
    ready: true, clef: "treble", toWritten: 2, key: "C", hz: [110, 1100],
    notes: [57, 59, 60, 62, 64, 65, 67, 69, 70, 71, 72], def: [60, 62, 64, 65, 67], open: [],   // low A B, throat B♭; B and C5 over the break
    samples: { Bb3: -5, C4: -3, D4: -10, Eb4: -4, F4: -2, G4: 0, A4: 1, Bb4: 1 },
    games: "ramzor breath long right ladder ninja songs names clap"
  },
  recorder: { // soprano recorder: sounds an octave above the written note; B A G first
    ready: true, clef: "treble", toWritten: -12, key: "G", hz: [400, 2400],
    notes: [62, 64, 65, 66, 67, 69, 71, 72, 74, 76], def: [67, 69, 71], open: [],   // F♮ and F♯; after B A G come C' and D'
    samples: { C5: 4, D5: 4, E5: 8, Gb5: -3, Ab5: 1, Bb5: 1, C6: 0, D6: 2, E6: 0 },
    games: "ramzor breath long right ladder ninja songs names clap"
  }
};
// Sharps (+) or flats (−) of each key.
const KEY_SIG = { C: 0, G: 1, D: 2, A: 3, F: -1, Bb: -2, Eb: -3 };
// Black keys this instrument reads as sharps (its key's own: F♯ in G); every other one is a flat.
const sharpsOf = id => [6, 1, 8, 3, 10].slice(0, Math.max(0, KEY_SIG[INSTRUMENT_DATA[id].key]));
// Do: the lowest note in `notes` with the key's name.
const doOf = id => { const I = INSTRUMENT_DATA[id], pc = ({ C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[I.key[0]] + (I.key[1] === "b" ? 11 : 0)) % 12; return I.notes.find(n => n % 12 === pc); };
// Every game's file and its id (the home tiles; the ids in `games`).
const GAME_OF = { "ramzor.html": "ramzor", "balloon-breath.html": "breath", "buzz-along.html": "buzz", "sound-game.html": "long",
  "right-note.html": "right", "horn-ladder.html": "ladder", "ninja.html": "ninja", "songs.html": "songs", "note-names.html": "names", "clap-along.html": "clap" };
const playsGame = (id, game) => !!INSTRUMENT_DATA[id] && INSTRUMENT_DATA[id].games.split(" ").includes(game);
// A link to a game this device's instrument doesn't play (from another class) goes home.
(function () {
  try {
    var game = GAME_OF[location.pathname.split("/").pop()], id = localStorage.getItem("brass-inst");
    if (game && INSTRUMENT_DATA[id] && !playsGame(id, game) && !/[?&]test=/.test(location.search)) location.replace("index.html");
  } catch (_) {}
})();
</script>

<style>
  :root {
    --paper: #fffdf8;
    --ink: #15181d;
    --ink-2: #3b434e;
    --muted: #66707d;
    --line: #e1e7ef;
    --console: #f2f5f9;
    --blue: #1a7fe2;
    --brass-deep: #8f5b0e;
    --navy: #1f2a44;
    --honey: #f2b33d;
    --font: "Rubik", "Lexend", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .wrap { max-width: 1180px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding-inline: clamp(16px, 3vw, 40px); padding-block: clamp(18px, 4vh, 40px); display: grid; grid-template-rows: auto 1fr auto auto; gap: clamp(18px, 3.5vh, 32px); }
  main { align-self: center; }

  /* Header: the wordmark (tone|bee, טון|בי — the second half in honey) and who is playing. */
  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { margin: 0; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: clamp(30px, 4.4vw, 42px); line-height: 1; letter-spacing: -0.01em; }
  .brand img { width: clamp(48px, 6vw, 60px); height: auto; border-radius: 22%; }
  .wm { color: var(--navy); }
  .wm .bee { color: var(--honey); }
  :lang(en) .wm { font-family: "Lexend", var(--font); }
  .me { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: #fff; border-radius: 999px; padding-block: 5px; padding-inline-start: 6px; padding-inline-end: 18px; cursor: pointer; min-height: 52px; font-size: 18px; }
  .me:hover { border-color: var(--navy); }
  .me img { width: 40px; height: 40px; }
  .me b { font-weight: 700; }

  /* Games: one square tile each, picture and name, nothing else. Five across on a projector, so all ten fit without scrolling. */
  /* A wrapping row, not a grid: an instrument with fewer games (no Buzzing) gets its last row centred, not a gap. */
  .tools { --cols: 5; --gap: clamp(12px, 1.6vw, 20px); display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap); }
  .tools > .tool { flex: 0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); min-width: 0; }
  .tool {
    display: grid; grid-template-rows: auto auto; border-radius: 24px; overflow: hidden;
    background: var(--tile); color: var(--navy); text-decoration: none;
    box-shadow: 0 4px 0 rgba(31, 42, 68, .10); transition: transform .15s, box-shadow .15s;
  }
  .tool[hidden] { display: none; }
  .tool:hover { transform: translateY(-3px); box-shadow: 0 7px 0 rgba(31, 42, 68, .12); }
  .tool:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(31, 42, 68, .10); }
  /* Tile pictures: drawn by Gemini in one house style (ops/brand/tiles/), on the tile's own colour. */
  .tool img { width: 100%; height: auto; aspect-ratio: 1; display: block; }
  .name { text-align: center; font-weight: 700; font-size: clamp(18px, 1.9vw, 24px); line-height: 1.15; padding: 0 8px 14px; margin-top: -6px; }

  /* Install hint: phones and tablets only, never on the projector, gone once installed. */
  .install { margin: 0; color: var(--muted); font-size: 15px; text-align: center; }
  .install b { color: var(--ink-2); }
  @media (hover: hover) and (pointer: fine) { .install { display: none; } }
  @media (display-mode: standalone) { .install { display: none; } }
  .foot { text-align: center; font-size: 14px; margin-top: -8px; }
  .foot a { color: var(--muted); display: inline-block; padding-block: 10px; }
  .foot a:hover { color: var(--navy); }
  @media (max-width: 1000px) { .tools { --cols: 4; } }
  @media (max-width: 760px), (max-width: 1000px) and (orientation: portrait) { .tools { --cols: 3; } }

  /* First visit (and "change"): the language, then the instrument. */
  .setup { position: fixed; inset: 0; z-index: 10; background: linear-gradient(180deg, #e8f4ff 0%, #ffffff 60%); overflow-y: auto; display: flex; padding: 24px 16px; }
  body:has(> .setup:not([hidden])) { overflow: hidden; }
  .setup[hidden] { display: none; }
  .card { width: min(100%, 760px); margin: auto; text-align: center; }
  .card img { width: 84px; border-radius: 22%; }
  .card h2 { margin: 14px 0 22px; font-size: clamp(24px, 4vw, 34px); font-weight: 700; }
  .card h2.two span { display: block; }
  .card h2.two span + span { font-size: .8em; color: var(--ink-2); }
  .langs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 3vw, 16px); max-width: 520px; margin: 0 auto; }
  .lang { border: 3px solid var(--line); background: #fff; border-radius: 22px; min-height: clamp(88px, 22vw, 110px); font-size: clamp(26px, 4vw, 38px); font-weight: 700; cursor: pointer; }
  .lang:hover, .inst:not(.later):hover { border-color: var(--blue); }
  .lang[aria-pressed="true"], .inst[aria-pressed="true"] { border-color: var(--blue); background: #eef6ff; }
  .insts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 40vw), 1fr)); gap: clamp(10px, 2.5vw, 14px); }
  .inst { position: relative; border: 3px solid var(--line); background: #fff; border-radius: 20px; padding: 14px 10px 12px; cursor: pointer; display: grid; justify-items: center; align-content: start; gap: 6px; font-size: 20px; font-weight: 700; }
  .inst img { width: 116px; height: 116px; }
  .inst.later { color: var(--muted); background: #f7f9fc; }
  .inst.later img { opacity: .6; filter: saturate(.55); }
  .inst.later:hover { border-color: #e0a500; }
  /* Tapping an instrument that is on its way: a line under the grid with an email link (and a count in analytics). */
  .soon-note { margin: 16px auto 0; max-width: 34em; font-size: 18px; color: var(--ink-2); }
  .soon-note a { color: var(--blue); font-weight: 700; }
  .soon { white-space: nowrap; font-size: 13px; font-weight: 600; color: var(--brass-deep); background: #fff3d6; border-radius: 999px; padding: 1px 10px; }
  .back { margin-top: 22px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 16px; min-height: 44px; }

  /* Phones: two tiles across. */
  @media (max-width: 600px) {
    .wrap { gap: 18px; padding-block: 16px 24px; }
    .tools { --cols: 2; --gap: 12px; }
    .tool { border-radius: 20px; }
    .name { font-size: 19px; }
    .me { font-size: 16px; padding-inline-end: 14px; min-height: 46px; }
    .me img { width: 34px; height: 34px; }
    .inst { padding: 10px 8px; font-size: 18px; }
    .inst img { width: min(104px, 26vw); height: auto; }
  }
  /* Phone on its side: everything in the setup fits on one screen. */
  @media (max-height: 500px) {
    .setup { padding-block: 12px; }
    .card > img { width: 56px; }
    .card h2 { margin: 6px 0 12px; font-size: 22px; }
    .lang { min-height: 76px; }
    .insts { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
    .soon { font-size: 11px; padding: 0 6px; }
    .inst { padding: 6px; gap: 2px; font-size: 16px; }
    .inst img { width: 64px; height: 64px; }
    .back { margin-top: 6px; }
  }
  @media (prefers-reduced-motion: reduce) { .tool { transition: none; } }
</style>

<body>
<div class="wrap">
  <header class="masthead">
    <h1 class="brand"><img src="icons/icon-192.png" alt=""><span class="wm" id="wordmark"><span class="tone"></span><span class="bee"></span></span></h1>
    <button class="me" id="me" data-t-title="change" data-t-aria="change"><img id="meIcon" alt="" width="40" height="40"><b id="meInst"></b></button>
  </header>

  <main>

<script>
"use strict";

/* ---------- Language ----------
   Hebrew or English, chosen on the home screen (`brass-lang`; ?lang=en|he for a link). Never mixed: every
   word on screen comes from TEXT (elements carry data-t / data-t-html / data-t-title / data-t-aria), and
   English names notes by letter (C D E, B♭). COMMON holds what every page says (microphone, pause, buttons). */
const LANG = (() => {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "en" || q === "he") return q;
    return localStorage.getItem("brass-lang") === "en" ? "en" : "he";
  } catch (_) { return "he"; }
})();
const COMMON = {
  he: {
    listening: "מקשיבים", noMicSound: "אין קול מהמיקרופון", muted: "מושתק", tapScreen: "לגעת במסך", noMic: "ללא מיקרופון",
    mic: "מיקרופון", test: "בדיקה", start: "▶ מנגנים", tryAgain: "מנסים שוב", startPrompt: "",
    keepListening: "עצרנו לרגע", onlyOnline: "המיקרופון עובד רק באתר tonebee.app",
    micNotFound: "לא נמצא מיקרופון", micBusy: "המיקרופון תפוס באפליקציה אחרת",
    micFailed: "לא הצלחנו לפתוח את המיקרופון", micGone: "המיקרופון נותק",
    micBlocked: "המיקרופון חסום", micAsk: "מאשרים מיקרופון ומתחילים", micHow: "איך פותחים:",
    helpAndroid: ["לוחצים על הסמל שליד הכתובת", "הרשאות ← מיקרופון ← מפעילים"],
    helpAndroidApp: ["פותחים את tonebee.app ב־Chrome", "לוחצים על הסמל שליד הכתובת", "הרשאות ← מיקרופון ← מפעילים", "חוזרים לטונבי"],
    helpAndroidSystem: ["הגדרות הטלפון ← אפליקציות ← Chrome", "הרשאות ← מיקרופון ← מאפשרים"],
    helpQuick: ["מושכים את המסך מלמעלה למטה", "גישה למיקרופון ← מפעילים"],
    helpInApp: ["⋯ למעלה ← פתיחה בדפדפן", "בדפדפן לוחצים שוב ▶"],
    helpSamsung: ["☰ ← הגדרות ← אתרים והורדות", "הרשאות אתרים ← מיקרופון ← tonebee.app ← מאפשרים"],
    helpIos: ["הגדרות ← יישומים ← Safari", "מיקרופון ← אפשר", "סוגרים את Safari ופותחים מחדש"],
    helpIosApp: ["הגדרות ← יישומים ← Safari", "מיקרופון ← אפשר", "סוגרים את טונבי ופותחים מחדש"],
    helpDesktop: ["לוחצים על הסמל שליד הכתובת", "מיקרופון ← מאפשרים"],
    helpNativeIos: ["לוחצים על ״פתיחת הגדרות״", "מיקרופון ← מפעילים", "חוזרים לטונבי"],
    helpNativeAndroid: ["לוחצים על ״פתיחת הגדרות״", "הרשאות ← מיקרופון ← מאפשרים", "חוזרים לטונבי"],
    openSettings: "פתיחת הגדרות",
    helpParent: "לא נפתח? מבקשים מהורה לאשר (Family Link / זמן מסך)",
    pause: "השהיה (Esc)", resume: "▶ ממשיכים", stop: "■ עצירה", fullscreen: "מסך מלא (F)", home: "‹ טונבי", brand: "טונבי",
    trumpet: "חצוצרה", trombone: "טרומבון", horn: "קרן", instrument: "כלי",
    diagTitle: "בדיקת מיקרופון (D)", diagAudio: "אודיו", diagMic: "מיקרופון", diagLevel: "רמה", diagVolume: "עוצמה",
    diagPitch: "צליל", diagCents: "דיוק", diagFloor: "רצפה", moving: "זז", still: "עומד", sound: "צליל", quiet: "שקט", turn: "מסובבים את הטלפון לרוחב"
  },
  en: {
    listening: "Listening", noMicSound: "No sound from the mic", muted: "Muted", tapScreen: "Tap the screen", noMic: "No microphone",
    mic: "Microphone", test: "Test", start: "▶ Play", tryAgain: "Try again", startPrompt: "",
    keepListening: "Paused", onlyOnline: "The microphone only works on tonebee.app",
    micNotFound: "No microphone found", micBusy: "Another app is using the microphone",
    micFailed: "Couldn't open the microphone", micGone: "The microphone was disconnected",
    micBlocked: "Microphone is blocked", micAsk: "Tap Allow so we can hear you", micHow: "How to fix:",
    helpAndroid: ["Tap the icon next to the address", "Permissions → Microphone → On"],
    helpAndroidApp: ["Open tonebee.app in Chrome", "Tap the icon next to the address", "Permissions → Microphone → On", "Come back to Tonebee"],
    helpAndroidSystem: ["Phone Settings → Apps → Chrome", "Permissions → Microphone → Allow"],
    helpQuick: ["Swipe down from top of screen", "Microphone access → Turn on"],
    helpInApp: ["Tap ⋯ → Open in browser", "Tap ▶ again"],
    helpSamsung: ["☰ → Settings → Sites and downloads", "Site permissions → Microphone → tonebee.app → Allow"],
    helpIos: ["Settings → Apps → Safari", "Microphone → Allow", "Close Safari and reopen"],
    helpIosApp: ["Settings → Apps → Safari", "Microphone → Allow", "Close Tonebee and reopen"],
    helpDesktop: ["Click the icon next to the address", "Microphone → Allow"],
    helpNativeIos: ["Tap “Open Settings”", "Microphone → Turn on", "Come back to Tonebee"],
    helpNativeAndroid: ["Tap “Open Settings”", "Permissions → Microphone → Allow", "Come back to Tonebee"],
    openSettings: "Open Settings",
    helpParent: "Still blocked? Ask a parent to allow it (Family Link / Screen Time)",
    pause: "Pause (Esc)", resume: "▶ Continue", stop: "■ Stop", fullscreen: "Full screen (F)", home: "‹ Tonebee", brand: "Tonebee",
    trumpet: "Trumpet", trombone: "Trombone", horn: "Horn", instrument: "Instrument",
    diagTitle: "Microphone check (D)", diagAudio: "Audio", diagMic: "Mic", diagLevel: "Level", diagVolume: "Volume",
    diagPitch: "Pitch", diagCents: "Cents", diagFloor: "Floor", moving: "running", still: "stopped", sound: "sound", quiet: "quiet", turn: "Turn your phone sideways"
  }
};
const T = (key, ...args) => {
  const v = (TEXT[LANG] && TEXT[LANG][key]) ?? COMMON[LANG][key] ?? (TEXT.he && TEXT.he[key]) ?? COMMON.he[key] ?? key;
  return typeof v === "function" ? v(...args) : v;
};
function applyText() {
  const root = document.documentElement;
  root.lang = LANG;
  root.dir = LANG === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = T(n.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach(n => { n.innerHTML = T(n.dataset.tHtml); });
  document.querySelectorAll("[data-t-title]").forEach(n => { n.title = T(n.dataset.tTitle); });
  document.querySelectorAll("[data-t-aria]").forEach(n => { n.setAttribute("aria-label", T(n.dataset.tAria)); });
  if (TEXT[LANG] && TEXT[LANG].pageTitle) document.title = T("pageTitle");
}
const $ = id => document.getElementById(id);

const TEXT = {
  he: {
    change: "החלפת כלי או שפה", langName: "עברית",
    games: "משחקים", privacy: "פרטיות",
    install: "<b>להתקנה:</b> שיתוף ← הוספה למסך הבית",
    installAndroid: "<b>להתקנה:</b> ⋮ ← הוספה למסך הבית / התקנה",
    installSamsung: "<b>להתקנה:</b> ☰ ← הוספת דף אל ← מסך הבית",
    instTitle: "על מה אתם מנגנים?", soon: "בקרוב", backLang: "‹ שפה",
    soonAsk: n => `${n} בדרך!`, soonMail: "רוצים שנודיע לכם? כתבו לנו",
    soonSubject: n => `טונבי: ${n}`, soonBody: n => `שלום, אשמח לשמוע כשיהיה אפשר לנגן בטונבי על ${n}.`,
    sax: "סקסופון", flute: "חליל צד", clarinet: "קלרינט", recorder: "חלילית",
    tileDo: "דו", wordmark: ["טוֹנְ", "בִּי"],   // with niqqud: otherwise it is not clear how to read it
    t_ramzor: "רמזור",
    t_breath: "נשימה",
    t_buzz: "זמזום",
    t_long: "צליל ארוך",
    t_right: "צליל נכון",
    t_ladder: "סולם",
    t_ninja: "נינג'ה",
    t_songs: "שירים",
    t_names: "תווים",
    t_clap: "קצב"
  },
  en: {
    change: "Change instrument or language", langName: "English",
    games: "Games", privacy: "Privacy",
    install: "<b>Install:</b> Share → Add to Home Screen",
    installAndroid: "<b>Install:</b> ⋮ → Add to Home screen",
    installSamsung: "<b>Install:</b> ☰ → Add page to → Home screen",
    instTitle: "What do you play?", soon: "Coming soon", backLang: "‹ Language",
    soonAsk: n => `${n} is on its way!`, soonMail: "Want us to tell you? Email us",
    soonSubject: n => `Tonebee: ${n}`, soonBody: n => `Hello, please let me know when I can play Tonebee on the ${n.toLowerCase()}.`,
    sax: "Saxophone", flute: "Flute", clarinet: "Clarinet", recorder: "Recorder",
    tileDo: "C", wordmark: ["tone", "bee"],
    t_ramzor: "Traffic Light",
    t_breath: "Breathing",
    t_buzz: "Buzzing",
    t_long: "Long Note",
    t_right: "Right Note",
    t_ladder: "Ladder",
    t_ninja: "Note Ninja",
    t_songs: "Songs",
    t_names: "Note Names",
    t_clap: "Clap-Along"
  }
};

// Instruments, in the order of the setup screen: INSTRUMENT_DATA in <head> (an instrument not `ready` is "coming soon").
const INSTRUMENTS = Object.entries(INSTRUMENT_DATA).map(([id, d]) => ({ id, ready: d.ready }));
// Instrument pictures: icons/inst/<id>.png (cut from the picture sheet the teacher chose).
const instPic = id => `icons/inst/${id}.png`;
// Sent here from a game on a new device (?next=ninja.html…): back there once the instrument is chosen. Our pages only.
const NEXT = (q => /^[a-z-]+\.html(\?[^#]*)?$/.test(q || "") ? q : "")(new URLSearchParams(location.search).get("next"));
const instName = id => T(id);

const TILES = GAME_OF;
const myInst = () => { let s = null; try { s = localStorage.getItem("brass-inst"); } catch (_) {} return INSTRUMENTS.some(i => i.id === s && i.ready) ? s : "trumpet"; };

function fillTiles() {
  const inst = myInst();
  document.querySelectorAll(".tool").forEach(a => {
    a.hidden = !playsGame(inst, TILES[a.getAttribute("href")]);     // only the games this instrument plays
    a.querySelector("[data-name]").textContent = T("t_" + TILES[a.getAttribute("href")]);
    a.querySelectorAll("svg text").forEach(t => { if (t.textContent.trim() === "Do" || t.dataset.do) { t.dataset.do = 1; t.textContent = T("tileDo"); } });
  });
  const [tone, bee] = T("wordmark");
  $("wordmark").firstElementChild.textContent = tone;
  $("wordmark").lastElementChild.textContent = bee;
}

function fillMe() {
  const inst = myInst();
  // A new picture shows once it has loaded: until then the old one would stay up.
  const img = $("meIcon");
  img.onload = img.onerror = () => { img.style.visibility = ""; };
  img.src = instPic(inst);
  img.style.visibility = img.complete ? "" : "hidden";
  $("meInst").textContent = instName(inst);
}

/* ---------- Setup: the language, then the instrument ---------- */

function showSetup(step) {
  $("setup").hidden = false;
  $("stepLang").hidden = step !== "lang";
  $("stepInst").hidden = step !== "inst";
  $("langHe").setAttribute("aria-pressed", String(LANG === "he"));
  $("langEn").setAttribute("aria-pressed", String(LANG === "en"));
  if (step === "inst") {
    $("instTitle").textContent = T("instTitle");
    $("backLang").textContent = T("backLang");
    let cur = null;
    try { cur = localStorage.getItem("brass-inst"); } catch (_) {}
    const box = $("insts");
    box.textContent = "";
    INSTRUMENTS.forEach(i => {
      const b = document.createElement("button");
      b.className = "inst";
      b.innerHTML = `<img src="${instPic(i.id)}" alt="" width="104" height="104"><span></span>` + (i.ready ? "" : `<span class="soon"></span>`);
      b.children[1].textContent = instName(i.id);
      if (!i.ready) {
        // On its way: no choosing, but a tap counts the interest and offers an email.
        b.classList.add("later");
        b.querySelector(".soon").textContent = T("soon");
        b.addEventListener("click", () => {
          tbTrack("instrument_interest", { instrument: i.id });
          $("soonText").textContent = T("soonAsk", instName(i.id));
          $("soonMail").textContent = T("soonMail");
          $("soonMail").href = "mailto:hello@tonebee.app?subject=" + encodeURIComponent(T("soonSubject", instName(i.id))) + "&body=" + encodeURIComponent(T("soonBody", instName(i.id)));
          $("soonMail").onclick = () => tbTrack("notify_click", { what: "instrument", instrument: i.id });
          $("soonMail").hidden = !!window.Capacitor;   // the store app: no links out without a parent (stores' kids rules)
          $("soonNote").hidden = false;
        });
        box.appendChild(b);
        return;
      }
      b.setAttribute("aria-pressed", String(i.id === cur));
      b.addEventListener("click", () => {
        try { localStorage.setItem("brass-inst", i.id); } catch (_) {}
        if (NEXT) return location.replace(NEXT.replace(/([?&])lang=[a-z]+&?/, "$1").replace(/[?&]$/, ""));   // the language just chosen wins
        $("setup").hidden = true;
        fillMe();
        fillTiles();
      });
      box.appendChild(b);
    });
  }
}

function chooseLang(l) {
  try { localStorage.setItem("brass-lang", l); } catch (_) {}
  // The whole page changes language and direction: simplest and surest is to load it again, on the instruments.
  if (l !== LANG) location.replace(location.pathname + "?setup=inst" + (NEXT ? "&next=" + encodeURIComponent(NEXT) : ""));
  else showSetup("inst");
}

$("langHe").addEventListener("click", () => chooseLang("he"));
$("langEn").addEventListener("click", () => chooseLang("en"));
$("backLang").addEventListener("click", () => showSetup("lang"));
$("me").addEventListener("click", () => showSetup("lang"));

// The install hint in the words of this browser's own menu (iPhone/iPad Safari: Share). Not in the store app: it is installed.
$("install").dataset.tHtml = /SamsungBrowser/.test(navigator.userAgent) ? "installSamsung" : /Android/.test(navigator.userAgent) ? "installAndroid" : "install";
if (window.Capacitor) $("install").remove();
applyText();
fillTiles();
fillMe();
let chosen = false;
try { chosen = !!localStorage.getItem("brass-lang") && !!localStorage.getItem("brass-inst"); } catch (_) {}
const askFor = new URLSearchParams(location.search).get("setup");
if (askFor === "inst") { history.replaceState(null, "", location.pathname + (NEXT ? "?next=" + encodeURIComponent(NEXT) : "")); showSetup("inst"); }
else if (!chosen) showSetup("lang");

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
