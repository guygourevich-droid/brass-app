  try { if (/[?&]lang=en/.test(location.search) || (!/[?&]lang=he/.test(location.search) && localStorage.getItem("brass-lang") === "en")) { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; } } catch (_) {}

<style>
  :root {
    --paper: #ffffff;
    --ink: #15181d;
    --ink-2: #3b434e;
    --muted: #66707d;
    --line: #e1e7ef;
    --console: #f2f5f9;
    --blue: #1a7fe2;
    --brass-deep: #8f5b0e;
    --font: "Rubik", "Lexend", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .wrap { max-width: 1040px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 48px); padding-block: clamp(28px, 6vh, 64px); display: grid; gap: clamp(28px, 5vh, 48px); }

  .masthead { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
  .masthead img { width: clamp(56px, 8vw, 76px); height: auto; border-radius: 22%; }
  .masthead h1 { margin: 0; font-weight: 700; font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.01em; line-height: 1.05; }
  .masthead p { margin: 4px 0 0; color: var(--muted); font-size: clamp(15px, 1.8vw, 18px); }
  /* Who is playing: the instrument and the language, one tap to change them. */
  .me { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 16px 6px 8px; cursor: pointer; min-height: 52px; }
  .me:hover { border-color: var(--blue); }
  .me svg { width: 60px; height: 38px; }
  .me b { font-weight: 700; }
  .me span { color: var(--muted); }

  .section-k { margin: 0 0 12px; font-size: 13px; letter-spacing: .08em; color: var(--brass-deep); font-weight: 700; }
  .tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; }
  .tool {
    display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center;
    padding: 20px 22px; border: 2px solid var(--line); border-radius: 18px;
    color: inherit; text-decoration: none; background: var(--paper);
    transition: border-color .15s, transform .15s;
  }
  .tool:hover { border-color: var(--blue); }
  .tool:active { transform: scale(.99); }
  .tool svg { width: clamp(110px, 18vw, 150px); height: auto; display: block; }
  .tool h2 { margin: 0; font-weight: 700; font-size: clamp(22px, 2.6vw, 26px); display: flex; align-items: baseline; gap: 10px; }
  .num { display: inline-grid; place-items: center; min-width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--console); color: var(--brass-deep); font-size: .72em; font-weight: 700; }
  .tool p { margin: 4px 0 10px; color: var(--ink-2); max-width: 44ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--console); color: var(--ink-2); }

  .home { background: var(--console); border-radius: 18px; padding: 18px 22px; }
  .home h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
  .home ol { margin: 0; padding-inline-start: 1.4em; display: grid; gap: 4px; font-size: 17px; color: var(--ink-2); }
  .install { border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 15px; max-width: 70ch; }
  .install b { color: var(--ink-2); }
  @media (display-mode: standalone) { .install { display: none; } }

  /* First visit (and "change"): the language, then the instrument. */
  .setup { position: fixed; inset: 0; z-index: 10; background: linear-gradient(180deg, #e8f4ff 0%, #ffffff 60%); overflow-y: auto; display: grid; place-items: center; padding: 24px 16px; }
  .setup[hidden] { display: none; }
  .card { width: min(100%, 760px); text-align: center; }
  .card img { width: 84px; border-radius: 22%; }
  .card h2 { margin: 14px 0 22px; font-size: clamp(24px, 4vw, 34px); font-weight: 700; }
  .langs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; max-width: 520px; margin: 0 auto; }
  .lang { border: 3px solid var(--line); background: #fff; border-radius: 22px; min-height: 110px; font-size: clamp(28px, 4vw, 38px); font-weight: 700; cursor: pointer; }
  .lang:hover, .inst:not([disabled]):hover { border-color: var(--blue); }
  .lang[aria-pressed="true"], .inst[aria-pressed="true"] { border-color: var(--blue); background: #eef6ff; }
  .insts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .inst { position: relative; border: 3px solid var(--line); background: #fff; border-radius: 20px; padding: 14px 10px 12px; cursor: pointer; display: grid; justify-items: center; gap: 6px; font-size: 20px; font-weight: 700; }
  .inst svg { width: 140px; height: 88px; }
  .inst[disabled] { cursor: default; color: var(--muted); background: #f7f9fc; }
  .inst[disabled] svg { opacity: .5; filter: saturate(.5); }
  .soon { font-size: 13px; font-weight: 600; color: var(--brass-deep); background: #fff3d6; border-radius: 999px; padding: 1px 10px; }
  .back { margin-top: 22px; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 16px; min-height: 44px; }

  @media (max-width: 520px) { .tool { grid-template-columns: 1fr; } .me { margin-inline-start: 0; } }
  @media (prefers-reduced-motion: reduce) { .tool { transition: none; } }
</style>
</head>

<script>
"use strict";

/* ---------- Language ----------
   Hebrew or English, chosen on the home screen (`brass-lang`; ?lang=en|he for a link). Never mixed: every
   word on screen comes from TEXT (elements carry data-t / data-t-html / data-t-title / data-t-aria), and
   English names notes by letter (C D E, B♭). COMMON holds what every page says (microphone, pause, buttons). */
const LANG = (() => {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "en" || q === "he") return q;
    return localStorage.getItem("brass-lang") === "en" ? "en" : "he";
  } catch (_) { return "he"; }
})();
const COMMON = {
  he: {

    // barrel, joints, bell
    `<rect x="25" y="44.4" width="11" height="11.2" rx="2" fill="url(#ba-ebony)" stroke="#0c0e12" stroke-width="1"/>` +
    `<rect x="36" y="45.4" width="88" height="9.2" fill="url(#ba-ebony)" stroke="#0c0e12" stroke-width="1"/>` +
    `<path d="M 124 45.2 C 138 45.2 146 42 153 36 L 153 64 C 146 58 138 54.8 124 54.8 Z" fill="url(#ba-ebony)" stroke="#0c0e12" stroke-width="1" stroke-linejoin="round"/>` +
    `<ellipse cx="153" cy="50" rx="3" ry="14" fill="#07080b" stroke="url(#ba-silver)" stroke-width="1.6"/>` +
    [[24, 12.4], [35, 12.4], [80, 11.4], [123, 11.6]].map(([x, h]) => `<rect x="${x}" y="${50 - h / 2}" width="2.6" height="${h}" rx=".8" fill="url(#ba-silver)" stroke="#5d6877" stroke-width=".7"/>`).join("") +
    // key rods, ring keys and lever keys
    `<path d="M 40 45.6 H 120" stroke="#c3cbd5" stroke-width="1.3"/>` +
    [46, 55, 64, 90, 99, 108].map(x => `<circle cx="${x}" cy="50" r="2.9" fill="#0c0e12" stroke="url(#ba-silver)" stroke-width="1.5"/>`).join("") +
    [[72, 3], [116, 4]].map(([x, w]) => `<rect x="${x}" y="47" width="${w + 3}" height="6" rx="2" fill="url(#ba-silver)" stroke="#5d6877" stroke-width=".8"/>`).join("") +
    `</g>`,

  recorder: shadow(80, 52) +
    `<g transform="rotate(30 80 50)">` +
    // head joint with the beak, window and windway
    `<path d="M 12 45 Q 9 45.5 9 49 L 9 52 Q 10 56 14 56.5 L 44 57 L 44 43 Z" fill="url(#ba-wood)" stroke="#7a4a1f" stroke-width="1.1" stroke-linejoin="round"/>` +
    `<path d="M 9.5 48.6 H 14" stroke="#5a3412" stroke-width="1.3" stroke-linecap="round"/>` +

    // body and foot
    `<path d="M 44 44.2 L 124 45 L 124 55 L 44 55.8 Z" fill="url(#ba-wood)" stroke="#7a4a1f" stroke-width="1.1"/>` +

    `<ellipse cx="151" cy="50" rx="2" ry="8.5" fill="#5a3412"/>` +
    [[42, 15], [122, 12.6]].map(([x, h]) => `<rect x="${x}" y="${50 - h / 2}" width="4" height="${h}" rx="1.4" fill="#9a6230" stroke="#6a3c16" stroke-width=".8"/>`).join("") +
    // finger holes
    [58, 68, 78, 90, 100, 110].map(x => `<ellipse cx="${x}" cy="48.6" rx="2.2" ry="1.9" fill="#4a2a0e"/>`).join("") +
    `<ellipse cx="136" cy="48" rx="1.5" ry="1.3" fill="#4a2a0e"/><ellipse cx="140" cy="48" rx="1.5" ry="1.3" fill="#4a2a0e"/>` +

document.body.insertAdjacentHTML("afterbegin", INST_DEFS);
const instName = id => T(id);

const TILES = { "ramzor.html": "ramzor", "balloon-breath.html": "breath", "buzz-along.html": "buzz", "sound-game.html": "long",
  "right-note.html": "right", "horn-ladder.html": "ladder", "ninja.html": "ninja", "songs.html": "songs", "note-names.html": "names", "clap-along.html": "clap" };

function fillTiles() {
  document.querySelectorAll(".tool").forEach(a => {
    const k = TILES[a.getAttribute("href")];
    a.querySelector("[data-name]").textContent = T("t_" + k);
    a.querySelector("p").textContent = T("d_" + k);
    a.querySelectorAll("svg text").forEach(t => { if (t.textContent.trim() === "Do" || t.dataset.do) { t.dataset.do = 1; t.textContent = T("tileDo"); } });
    const chips = a.querySelector(".chips");
    chips.textContent = "";
    T("c_" + k).forEach(c => {
      const s = document.createElement("span");
      s.className = "chip";
      s.textContent = c[0] === "@" ? T(c.slice(1)) : c;
      chips.appendChild(s);
    });
  });
}

function fillMe() {
  let inst = "trumpet";
  try { const s = localStorage.getItem("brass-inst"); if (INSTRUMENTS.some(i => i.id === s && i.ready)) inst = s; } catch (_) {}
  $("meIcon").innerHTML = ICONS[inst];
  $("meInst").textContent = instName(inst);
  $("meLang").textContent = T("langName");
}

/* ---------- Setup: the language, then the instrument ---------- */

function showSetup(step) {
  $("setup").hidden = false;
  $("stepLang").hidden = step !== "lang";
  $("stepInst").hidden = step !== "inst";
  $("langHe").setAttribute("aria-pressed", String(LANG === "he"));
  $("langEn").setAttribute("aria-pressed", String(LANG === "en"));
  if (step === "inst") {
    $("instTitle").textContent = T("instTitle");
    $("backLang").textContent = T("backLang");
    let cur = null;
    try { cur = localStorage.getItem("brass-inst"); } catch (_) {}
    const box = $("insts");
    box.textContent = "";
    INSTRUMENTS.forEach(i => {
      const b = document.createElement("button");
      b.className = "inst";
      b.innerHTML = `<svg viewBox="0 0 160 100" aria-hidden="true">${ICONS[i.id]}</svg><span></span>` + (i.ready ? "" : `<span class="soon"></span>`);
      b.children[1].textContent = instName(i.id);
      if (!i.ready) { b.disabled = true; b.querySelector(".soon").textContent = T("soon"); }
      b.setAttribute("aria-pressed", String(i.id === cur));
      b.addEventListener("click", () => {
        try { localStorage.setItem("brass-inst", i.id); } catch (_) {}
        $("setup").hidden = true;
        fillMe();
      });
      box.appendChild(b);
    });
  }
}

function chooseLang(l) {
  try { localStorage.setItem("brass-lang", l); } catch (_) {}
  // The whole page changes language and direction: simplest and surest is to load it again, on the instruments.
  if (l !== LANG) location.replace(location.pathname + "?setup=inst");
  else showSetup("inst");
}

$("langHe").addEventListener("click", () => chooseLang("he"));
$("langEn").addEventListener("click", () => chooseLang("en"));
$("backLang").addEventListener("click", () => showSetup("lang"));
$("me").addEventListener("click", () => showSetup("lang"));

applyText();
fillTiles();
fillMe();
let chosen = false;
try { chosen = !!localStorage.getItem("brass-lang"); } catch (_) {}
const askFor = new URLSearchParams(location.search).get("setup");
if (askFor === "inst") { history.replaceState(null, "", location.pathname); showSetup("inst"); }
else if (!chosen) showSetup("lang");

if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
