<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>זמזום · Brass App</title>
<meta name="theme-color" content="#bfe4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brass App">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
  :root {
    --ink: #15181d;
    --muted: #56616f;
    --line: rgba(21, 24, 29, .14);
    --panel: rgba(255, 255, 255, .92);
    --go: #1b8f58;
    --accent: #1a7fe2;
    --display: "Rubik", "Lexend", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
    font-synthesis: none;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--display); color: var(--ink); background: linear-gradient(180deg, #bfe4ff 0%, #e8f4ff 55%, #fff4e3 100%) fixed; overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--accent); border-radius: 12px; }

  .app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  .console { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px clamp(12px, 3vw, 28px); background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .console a { color: var(--muted); text-decoration: none; }
  .spacer { margin-inline-start: auto; }
  .seg { display: inline-flex; background: #eef2f7; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg[hidden] { display: none; }
  .seg-btn { border: 0; background: transparent; min-height: 44px; padding: 0 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
  .seg-btn[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(21, 24, 29, .18); }
  .icon-btn { background: #fff; border: 1px solid var(--line); border-radius: 10px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; font-size: 18px; }
  .mic { cursor: pointer; }
  .mic-dot { width: 12px; height: 12px; border-radius: 50%; background: #c3ccd8; display: inline-block; vertical-align: -1px; }
  .mic-dot.on { background: var(--go); }

  .stage { position: relative; min-height: 0; overflow: hidden; }
  .scene { width: 100%; height: 100%; display: block; direction: ltr; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .82); text-align: center; padding: 4vh 6vw; cursor: pointer; }
  .overlay[hidden] { display: none; }
  .overlay p { margin: 0 0 2vh; font-size: clamp(18px, 3.2vh, 30px); font-weight: 500; max-width: 24ch; line-height: 1.5; }
  .big-btn { background: var(--accent); color: #fff; border: 0; border-radius: 999px; font-weight: 700; font-size: clamp(22px, 4vh, 40px); padding: .6em 1.6em; cursor: pointer; min-height: 56px; }
  /* After a success: one obvious way on. */
  .next-btn { position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%); box-shadow: 0 4px 16px rgba(21, 24, 29, .25); }
  .next-btn[hidden] { display: none; }

  .diag { position: absolute; inset-inline-end: 10px; bottom: 10px; direction: rtl; text-align: right; background: rgba(13, 17, 23, .82); color: #d7e4f5; font-size: 13px; line-height: 1.6; padding: 8px 12px; border-radius: 10px; font-variant-numeric: tabular-nums; white-space: pre; }
  .diag[hidden] { display: none; }

  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 8px clamp(12px, 3vw, 28px) 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .count { font-weight: 800; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tip { font-size: clamp(15px, 2.2vh, 20px); color: var(--ink); }
  kbd { font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }
</style>
</head>
<body>
<div class="app">
  <header class="console">
    <a href="index.html">‹ Brass App</a>
    <div class="seg" role="group" aria-label="כלי">
      <button id="inTrumpet" class="seg-btn" aria-pressed="true">חצוצרה</button>
      <button id="inTrombone" class="seg-btn" aria-pressed="false">טרומבון</button>
      <button id="inHorn" class="seg-btn" aria-pressed="false">קרן</button>
    </div>
    <div class="seg" role="group" aria-label="שלב">
      <button id="st1" class="seg-btn" aria-pressed="true" title="מזמזמים">1 🐝</button>
      <button id="st2" class="seg-btn" aria-pressed="false" title="אותו צליל">2 🌸</button>
      <button id="st3" class="seg-btn" aria-pressed="false" title="ארוך ויציב">3 🍯</button>
      <button id="st4" class="seg-btn" aria-pressed="false" title="סירנה">4 〰️</button>
    </div>
    <div class="seg" role="group" aria-label="כמה זמן" id="holdSeg" hidden>
      <button id="hold4" class="seg-btn" aria-pressed="true">4″</button>
      <button id="hold8" class="seg-btn" aria-pressed="false">8″</button>
    </div>
    <div class="seg" role="group" aria-label="סירנה" id="sirenSeg" hidden>
      <button id="sir2" class="seg-btn" aria-pressed="true" title="מסלול: טון">〰 2</button>
      <button id="sir4" class="seg-btn" aria-pressed="false" title="מסלול: טרצה">〰 3</button>
      <button id="sir7" class="seg-btn" aria-pressed="false" title="מסלול: קווינטה">〰 5</button>
      <button id="sirFree" class="seg-btn" aria-pressed="false" title="חופשי">✏️</button>
    </div>
    <span class="spacer"></span>
    <span class="mic" id="micBox"><span class="mic-dot" id="micDot"></span> <span id="micText">מיקרופון</span></span>
    <button id="tone" class="icon-btn" title="לשמוע את הזמזום (T)">🔊</button>
    <button id="fullscreen" class="icon-btn" title="מסך מלא (F)">⛶</button>
  </header>

  <main class="stage" id="stage">
    <svg class="scene" id="scene" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="דבורה שעפה עם הזמזום"></svg>
    <div class="overlay" id="overlay">
      <div>
        <p id="overlayText">נלחץ ונתחיל להקשיב</p>
        <button class="big-btn" id="startBtn">התחלה</button>
      </div>
    </div>
    <button class="big-btn next-btn" id="nextBtn" hidden></button>
    <div class="diag" id="diag" hidden></div>
  </main>

  <footer class="transport">
    <span class="count" id="counter">0</span>
    <span class="tip" id="tip"></span>
    <span class="spacer"></span>
    <span><kbd>T</kbd> לשמוע · <kbd>Space</kbd> הבא · <kbd>1</kbd>–<kbd>4</kbd> שלב · <kbd>R</kbd> כיול</span>
  </footer>
</div>
<script>
"use strict";

/* ---------- iPad audio ----------
   Older iPads (Safari before 14.1) have no float sample reader: build it from the byte one.
   A suspended or interrupted iPad audio engine (lock screen, a call) wakes on any tap.
   Tapping the microphone status opens the microphone check (no keyboard needed). */
if (window.AnalyserNode && !AnalyserNode.prototype.getFloatTimeDomainData) {
  AnalyserNode.prototype.getFloatTimeDomainData = function (out) {
    const bytes = new Uint8Array(out.length);
    this.getByteTimeDomainData(bytes);
    for (let i = 0; i < out.length; i++) out[i] = (bytes[i] - 128) / 128;
  };
}
["touchend", "click"].forEach(type => document.addEventListener(type, () => {
  if (ctx && ctx.state !== "running" && ctx.state !== "closed") ctx.resume();
}, true));
document.getElementById("micText").parentElement.addEventListener("click", () => {
  const d = document.getElementById("diag");
  d.hidden = !d.hidden;
});
// iPad/iPhone: the raw microphone is too quiet for a horn at a normal distance (measured in class), so use
// the device's own voice processing and automatic volume. Elsewhere raw is louder than enough and purer.
// ?voice=1 / ?voice=0 forces either way. (iPadOS Safari calls itself a Mac; the touch points give it away.)
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const VOICE_PARAM = new URLSearchParams(location.search).get("voice");
const MIC_OPTIONS = (VOICE_PARAM === null ? IS_IOS : VOICE_PARAM !== "0") ? true
  : { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
// The check panel's first lines: is the engine moving, what the iPad says about the mic, the raw level in dB.
let lastEngineTime = -1, engineMovedAt = 0;
const audioLine = () => {
  if (!ctx) return "אודיו   —\n";
  if (ctx.currentTime !== lastEngineTime) { lastEngineTime = ctx.currentTime; engineMovedAt = performance.now(); }
  const moving = performance.now() - engineMovedAt < 500;     // the clock advances in bursts, not every frame
  const tr = micStream && micStream.getAudioTracks()[0];
  const st = tr && tr.getSettings ? tr.getSettings() : {};
  const db = state.rms > 0 ? (20 * Math.log10(state.rms)).toFixed(0) + " dB" : "0";
  return `אודיו   ${ctx.state} · ${ctx.sampleRate} · ${moving ? "זז" : "עומד"}\n` +
    `מיקרופון ${tr ? tr.readyState + (tr.muted ? " muted" : "") + (tr.enabled ? "" : " off") : "—"} · ${st.sampleRate || "?"} · ${MIC_OPTIONS === true ? "voice" : "raw"} ec:${st.echoCancellation} agc:${st.autoGainControl}\n` +
    `רמה    ${db}\n`;
};


/* ---------- Buzzing with a bee ----------
   The teacher's own order: copy a buzz → match a pitch → hold it long and steady → sirens.
   1 🐝 any buzz makes the bee fly across the meadow; flowers open as it passes (no pitch).
   2 🌸 the app buzzes a note and a flower grows to that height; the bee's height is the child's pitch;
        reaching the flower lands the bee on it and collects a drop of honey.
   3 🍯 same, but stay on the flower 4 or 8 s while the honeycomb fills; wandering off only pauses it.
   4 〰️ free: the bee draws the buzz as a trail. Path: dots trace a siren; the ones the bee meets bloom.
   The model buzz is synthetic (a bright, raspy pulse with a little breath and wobble), unless a real
   recording sounds/buzz/<instrument>.m4a exists: then that is used, pitch-shifted.
   Silence is waiting, never failure: nothing falls, closes or turns red. */

const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

// Concert pitch of a comfortable first mouthpiece buzz, and the sky's range around it (semitones).
const INSTRUMENTS = {
  trumpet:  { he: "חצוצרה", base: 349.23, lo: -4, hi: 9 },
  trombone: { he: "טרומבון", base: 174.61, lo: -4, hi: 9 },
  horn:     { he: "קרן",    base: 261.63, lo: -4, hi: 9 }
};
const TARGETS = [0, 2, 4, 5, 7, 3, -2];   // step 2/3 flowers, in semitones above the first buzz, in order
const TIPS = ["הפומית נוגעת בעדינות בשפתיים", "מתחילים עם הלשון, אוויר יציב", "שואפים בנחת לפני כל זמזום", "השפתיים נחות בין זמזום לזמזום"];

const IN_CENTS = 80, OUT_CENTS = 110;     // a beginner's buzz wobbles: a wide window, with hysteresis
const GATE_DB = 12, HOLD_DB = 6, ONSET_MS = 150, GAP_MS = 300, ANALYSE_MS = 50;
const LAND_S = 0.5;                       // step 2: on the flower this long = honey
const FLY_SPEED = 150;                    // step 1 and 4: px per second the meadow / trail moves

const state = {
  inst: "trumpet", step: 1, hold: 4, siren: 2, ti: 0, counter: 0,
  phase: "play", phaseT: 0, approach: 0, onFlower: 0, fill: 0, inBand: false, honey: 0,
  listening: false, rms: 0, freq: 0, clarity: 0, semi: null, smoothSemi: 0,
  noiseFloor: 0.002, soundOn: false, lastHeard: 0, onsetSince: 0, muteUntil: 0, lastAnalyse: 0
};

/* ---------- Audio ---------- */

let ctx = null, analyser = null, micStream = null, raw = null, deci = null, realBuzz = {};

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.onstatechange = () => { if (state.listening && micStream) $("micText").textContent = ctx.state === "running" ? "מקשיב" : "לגעת במסך"; };
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

async function startMic() {
  ensureCtx();                                  // created inside the click, before any await
  loadRealBuzz();
  if (new URLSearchParams(location.search).get("test")) return startTest();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail("המשחק עם המיקרופון עובד רק דרך הקישור באינטרנט");
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: MIC_OPTIONS });
  } catch (err) {
    return fail(err && err.name === "NotAllowedError" ? "אין אישור למיקרופון" : err && err.name === "NotFoundError" ? "לא נמצא מיקרופון"
      : err && err.name === "NotReadableError" ? "המיקרופון תפוס בתוכנה אחרת" : "לא הצלחנו לפתוח את המיקרופון");
  }
  // iPad switches the hardware to the microphone's rate; an audio engine made before that can stay deaf.
  const track = micStream.getAudioTracks()[0];
  const micRate = track && track.getSettings ? track.getSettings().sampleRate : 0;
  if (micRate && ctx.sampleRate !== micRate) { ctx.close(); ctx = null; ensureCtx(); }
  ctx.resume();
  const src = ctx.createMediaStreamSource(micStream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 8192;
  analyser.smoothingTimeConstant = 0;
  src.connect(analyser);
  // iPad (WebKit) feeds an analyser only if it leads to the speakers: a silent gain does that, with no sound.
  const pull = ctx.createGain();
  pull.gain.value = 0;
  analyser.connect(pull);
  pull.connect(ctx.destination);
  raw = new Float32Array(analyser.fftSize);
  listening();
  micStream.getAudioTracks().forEach(t => {
    t.addEventListener("ended", () => fail("המיקרופון נותק"));
    t.addEventListener("mute", () => { $("micText").textContent = "מושתק"; });
    t.addEventListener("unmute", () => { $("micText").textContent = "מקשיב"; });
  });
}

function listening() {
  state.listening = true;
  state.noiseFloor = state.noiseFloor || 0.002;
  $("overlay").hidden = true;
  $("micDot").classList.add("on");
  $("micText").textContent = micStream ? "מקשיב" : "בדיקה";
  enterStep();
}

// ?test=1: a buzz straight into the analyser. Console: testBuzz(semitones, gain) buzzes at that pitch
// above the first buzz (gain 0 stops); testNoise(gain) adds hiss.
function startTest() {
  analyser = ctx.createAnalyser();
  analyser.fftSize = 8192;
  analyser.smoothingTimeConstant = 0;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sawtooth"; o.frequency.value = INSTRUMENTS[state.inst].base;
  g.gain.value = 0;
  o.connect(g); g.connect(analyser); o.start();
  const hiss = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), hd = hiss.getChannelData(0);
  for (let i = 0; i < hd.length; i++) hd[i] = Math.random() * 2 - 1;
  const ns = ctx.createBufferSource(), ng = ctx.createGain();
  ns.buffer = hiss; ns.loop = true; ng.gain.value = 0;
  ns.connect(ng); ng.connect(analyser); ns.start();
  window.testBuzz = (semi, gain = 0.2) => {
    o.frequency.setTargetAtTime(INSTRUMENTS[state.inst].base * Math.pow(2, semi / 12), ctx.currentTime, 0.03);
    g.gain.setTargetAtTime(gain, ctx.currentTime, 0.01);
  };
  window.testNoise = v => ng.gain.setTargetAtTime(v, ctx.currentTime, 0.01);
  raw = new Float32Array(analyser.fftSize);
  state.noiseFloor = 0.00001;
  listening();
}

function fail(message) {
  state.listening = false;
  $("overlay").hidden = false;
  $("overlayText").textContent = message;
  $("startBtn").textContent = "לנסות שוב";
  $("micDot").classList.remove("on");
  $("micText").textContent = "ללא מיקרופון";
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null;
  state.listening = false;
  $("micDot").classList.remove("on");
}
addEventListener("pagehide", stopMic);
document.addEventListener("visibilitychange", () => { if (document.hidden) stopMic(); });

/* ---------- The model buzz ---------- */

// A real recording, if the teacher adds one: sounds/buzz/<instrument>.m4a, a steady buzz on the first note.
function loadRealBuzz() {
  for (const k in INSTRUMENTS) {
    if (realBuzz[k] !== undefined) continue;
    realBuzz[k] = null;
    fetch(`sounds/buzz/${k}.m4a`).then(r => r.ok ? r.arrayBuffer() : null)
      .then(b => b && new Promise((ok, no) => ensureCtx().decodeAudioData(b, ok, no))).then(buf => { if (buf) realBuzz[k] = buf; }).catch(() => {});
  }
}

let buzzWave = null;
// Lips buzz like a reed: a sharp pulse every cycle, so many bright overtones, a little breath noise,
// a small scoop into the note and a slow natural wobble. contour = [[seconds, semitones], ...] for sirens.
function playBuzz(contour, dur) {
  const c = ensureCtx(), I = INSTRUMENTS[state.inst], t0 = c.currentTime + 0.05;
  const hz = s => I.base * Math.pow(2, s / 12);
  state.muteUntil = performance.now() + (dur + 0.6) * 1000;   // the model is never heard as the child
  const out = c.createGain();
  out.gain.setValueAtTime(0.0001, t0);
  out.gain.exponentialRampToValueAtTime(0.5, t0 + 0.06);
  out.gain.setValueAtTime(0.5, t0 + dur - 0.12);
  out.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  out.connect(c.destination);

  const real = realBuzz[state.inst];
  if (real) {
    const src = c.createBufferSource();
    src.buffer = real; src.loop = true;
    src.loopStart = Math.min(0.3, real.duration / 3); src.loopEnd = Math.max(src.loopStart + 0.2, real.duration - 0.2);
    contour.forEach(([t, s]) => src.playbackRate.linearRampToValueAtTime(Math.pow(2, s / 12), t0 + t));
    src.playbackRate.setValueAtTime(Math.pow(2, contour[0][1] / 12), t0);
    src.connect(out); src.start(t0); src.stop(t0 + dur + 0.05);
    return;
  }
  if (!buzzWave) {
    const N = 40, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
    for (let n = 1; n <= N; n++) im[n] = Math.pow(n, -0.6) * (n % 2 ? 1 : 0.8);
    buzzWave = c.createPeriodicWave(re, im);
  }
  const o = c.createOscillator();
  o.setPeriodicWave(buzzWave);
  o.frequency.setValueAtTime(hz(contour[0][1] - 0.5), t0);                 // the little scoop up into the note
  o.frequency.exponentialRampToValueAtTime(hz(contour[0][1]), t0 + 0.12);
  contour.slice(1).forEach(([t, s]) => o.frequency.exponentialRampToValueAtTime(hz(s), t0 + t));
  const wob = c.createOscillator(), wobG = c.createGain();                // a slow, uneven wobble
  wob.frequency.value = 4.7; wobG.gain.value = hz(contour[0][1]) * 0.006;
  wob.connect(wobG); wobG.connect(o.frequency);
  // Body: cut the low rumble, lift the bright "zz" region, soften the very top.
  const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 140;
  const f1 = c.createBiquadFilter(); f1.type = "peaking"; f1.frequency.value = 1300; f1.Q.value = 1.2; f1.gain.value = 8;
  const f2 = c.createBiquadFilter(); f2.type = "peaking"; f2.frequency.value = 2900; f2.Q.value = 1.5; f2.gain.value = 6;
  const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5200;
  const tone = c.createGain(); tone.gain.value = 0.16;
  o.connect(hp); hp.connect(f1); f1.connect(f2); f2.connect(lp); lp.connect(tone); tone.connect(out);
  // Breath: a little filtered air under the buzz.
  const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const ns = c.createBufferSource(), nf = c.createBiquadFilter(), ng = c.createGain();
  ns.buffer = nb; ns.loop = true; nf.type = "bandpass"; nf.frequency.value = 2500; nf.Q.value = 0.7; ng.gain.value = 0.025;
  ns.connect(nf); nf.connect(ng); ng.connect(out);
  [o, wob, ns].forEach(n => { n.start(t0); n.stop(t0 + dur + 0.05); });
}

function playModel() {
  if (state.step === 4) {
    const top = state.siren || 4, q = ARC_W / FLY_SPEED / 2;        // one siren, as long as one obstacle
    playBuzz([[0, 0], [0.4, 0], [0.4 + q, top], [0.4 + 2 * q, 0], [0.8 + 2 * q, 0]], 0.8 + 2 * q);
  } else playBuzz([[0, state.step === 1 ? 0 : TARGETS[state.ti]]], 2.2);
}

/* ---------- Hearing the buzz ---------- */

function analyse() {
  if (!state.listening || !analyser) return;
  analyser.getFloatTimeDomainData(raw);
  let sum = 0;
  for (let i = 0; i < raw.length; i++) sum += raw[i] * raw[i];
  state.rms = Math.sqrt(sum / raw.length);
  // A real microphone in a room is never exactly silent: say so instead of waiting forever.
  if (state.rms === 0 && micStream) {
    if (!state.zeroSince) state.zeroSince = performance.now();
    else if (performance.now() - state.zeroSince > 3000) $("micText").textContent = "אין קול מהמיקרופון";
  } else if (state.zeroSince) { state.zeroSince = 0; $("micText").textContent = "מקשיב"; }

  const now = performance.now(), muted = now < state.muteUntil, I = INSTRUMENTS[state.inst];
  const gate = Math.max(state.noiseFloor * Math.pow(10, GATE_DB / 20), 0.0015);
  const holdGate = Math.max(state.noiseFloor * Math.pow(10, HOLD_DB / 20), 0.001);
  let got = null;

    const sr = ctx.sampleRate, D = Math.max(1, Math.round(sr / 8000)), from = raw.length / 2, n = Math.floor(from / D), sr2 = sr / D;

function detect(buf, sampleRate, fMin, fMax) {
  const n = buf.length;
  const minLag = Math.max(2, Math.floor(sampleRate / fMax));
  const maxLag = Math.min(Math.floor(sampleRate / fMin), n - 2);

  for (let lag = minLag; lag <= maxLag; lag++) {
    let ac = 0, m = 0;
    for (let i = 0, end = n - lag; i < end; i++) { const a = buf[i], b = buf[i + lag]; ac += a * b; m += a * a + b * b; }
    const v = m > 0 ? (2 * ac) / m : 0;
    nsdf[lag] = v;
    if (v > peak) peak = v;
  }
  if (peak < 0.4) return null;
  const threshold = peak * 0.9;
  for (let lag = minLag + 1; lag < maxLag; lag++) {
    if (nsdf[lag] > threshold && nsdf[lag] >= nsdf[lag - 1] && nsdf[lag] >= nsdf[lag + 1]) {
      const y1 = nsdf[lag - 1], y2 = nsdf[lag], y3 = nsdf[lag + 1];
      const denom = 2 * (2 * y2 - y1 - y3);

      return { freq: sampleRate / (lag + shift), clarity: y2 };
    }
  }

}

/* ---------- Steps ---------- */

  if (state.listening && state.step === 4 && state.siren) modelTimer = setTimeout(() => playBuzz([[0, 0]], 2), 200);   // where to start

// Space or the big button: the next flower, or a new route home.
function next() {

function update(dt) {

  if (s.step !== 2 && s.step !== 3) return;

  const off = s.semi === null ? null : Math.abs(s.smoothSemi - TARGETS[s.ti]) * 100;
  s.inBand = off !== null && off < (s.inBand ? OUT_CENTS : IN_CENTS);

    f.head.setAttribute("transform", `translate(${f.x} ${f.topY}) scale(${(1.6 * (s.phase === "won" ? 1 + Math.sin(t * 6) * 0.06 : 1)).toFixed(3)}) rotate(${s.phase === "won" ? (t * 40 % 360).toFixed(1) : 0})`);
    scene.band.setAttribute("opacity", s.inBand ? 0.55 : 0.3);
    scene.cells.forEach((c, i) => c.setAttribute("fill", (s.phase === "won" && s.step === 3) || s.fill * scene.cells.length > i + 0.001 ? "#ffb703" : "#fff6d8"));
  }

  if (s.step === 4) drawSiren(dt, t);
  const btn = $("nextBtn"), show = s.phase === "won";
  if (btn.hidden === show) { btn.hidden = !show; btn.textContent = s.step === 4 ? "עוד מסלול ←" : "פרח הבא ←"; }
}

function drawSiren(dt, t) {
  const s = state;
  if (s.siren) return drawRoute(dt, t);
  // Free: the past scrolls to the left as the bee draws its trail.
  const step = FLY_SPEED * dt;
  scene.trail.forEach(p => { p.x -= step; });
  if (s.soundOn && s.semi !== null) scene.trail.push({ x: 900, y: scene.beeY, gap: !scene.lastOn });
  scene.lastOn = s.soundOn && s.semi !== null;
  while (scene.trail.length && scene.trail[0].x < -40) scene.trail.shift();
  scene.trailPath.setAttribute("d", scene.trail.map(p => `${p.gap ? "M" : "L"} ${p.x.toFixed(0)} ${p.y.toFixed(0)}`).join(" "));
}

// The route: after the starting buzz and a 3-2-1 the bee flies on at a steady speed; the child's buzz lifts it
// over the obstacles. Silent, it glides gently back to the starting height and keeps going.
function drawRoute(dt, t) {
  const s = state, sounding = s.soundOn && s.semi !== null;
  const left = READY_S - s.phaseT;
  scene.countdown.textContent = s.phase === "ready" && s.listening && left < READY_S - 0.01 ? Math.ceil(left) : "";
  if (s.phase === "ready" && !s.listening) s.phaseT = 0;
  if (s.phase === "ready" && left <= 0) setPhase("play");
  if (s.phase === "play") scene.scroll = Math.min(HIVE_X - 70 - ROUTE_BEE_X, scene.scroll + FLY_SPEED * dt);
  const bwx = scene.scroll + ROUTE_BEE_X;
  // Too low over an obstacle: the bee bumps into it, gets dizzy, and the route starts again.
  if (s.phase === "play" && scene.obstacles.some(o => Math.abs(bwx - o.cx) < HIT_W && scene.beeY + 25 > o.top)) { setPhase("bump"); boing(); }
  scene.dizzy.setAttribute("opacity", s.phase === "bump" ? 1 : 0);
  if (s.phase === "bump") {
    [...scene.dizzy.children].forEach((st, i) => {
      const a = t * 5 + i * 2.1;
      st.setAttribute("transform", `translate(${(ROUTE_BEE_X + 20 + Math.cos(a) * 46).toFixed(1)} ${(scene.beeY - 70 + Math.sin(a) * 14).toFixed(1)})`);
    });
    if (s.phaseT >= BUMP_S) { enterStep(); return; }
  }
  scene.world.setAttribute("transform", `translate(${(-scene.scroll).toFixed(1)} 0)`);
  if (sounding) scene.trail.push({ x: bwx, y: scene.beeY, gap: !scene.lastOn });
  scene.lastOn = sounding;
  scene.routeTrail.setAttribute("d", scene.trail.map(p => `${p.gap ? "M" : "L"} ${p.x.toFixed(0)} ${p.y.toFixed(0)}`).join(" "));
  for (const d of scene.dots) {
    if (!d.met && sounding && Math.abs(d.wx - bwx) < 20 && Math.abs(s.smoothSemi - d.semi) * 100 < IN_CENTS + 20) {
      d.met = true;
      d.g.textContent = "";
      for (let i = 0; i < 6; i++) el("ellipse", { cx: 0, cy: -11, rx: 7, ry: 12, transform: `rotate(${i * 60})`, fill: PETALS[(i + Math.round(d.wx / 34)) % PETALS.length] }, d.g);
      el("circle", { r: 7, fill: "#f2a900" }, d.g);
    }
  }
  scene.mapBee.setAttribute("cx", scene.mapX(bwx).toFixed(1));
  if (s.phase === "play" && bwx >= HIVE_X - 70.5) {        // home!
    setPhase("won");
    chime();
    burst(HIVE_X - scene.scroll, semiY(0));
  }
  if (s.phase === "won") scene.hive.setAttribute("transform", `translate(${HIVE_X} ${semiY(0)}) rotate(${(Math.sin(t * 8) * 3).toFixed(1)})`);
}

// A soft "boing" for a bump: a little bounce down in pitch, not an alarm.
function boing() {
  const c = ensureCtx(), t = c.currentTime + 0.02, o = c.createOscillator(), g = c.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(520, t);
  o.frequency.exponentialRampToValueAtTime(180, t + 0.35);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + 0.5);
  state.muteUntil = Math.max(state.muteUntil, performance.now() + 700);
}

function chime() {
  const c = ensureCtx(), t0 = c.currentTime + 0.03;
  [659.25, 783.99, 1046.5].forEach((hz, i) => {
    const o = c.createOscillator(), g = c.createGain(), t = t0 + i * 0.1;
    o.type = "triangle"; o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.1, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.65);
  });
  state.muteUntil = Math.max(state.muteUntil, performance.now() + 1000);
}

function burst(x, y) {
  const svg = $("scene");
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12, d = 80 + Math.random() * 60;
    const c = el("ellipse", { rx: 7, ry: 12, fill: PETALS[i % PETALS.length] }, svg);
    const t0 = performance.now();
    (function fly(now) {
      const p = (now - t0) / 900;
      if (p >= 1) { c.remove(); return; }
      c.setAttribute("cx", x + Math.cos(a) * d * p);
      c.setAttribute("cy", y + Math.sin(a) * d * p + 50 * p * p);
      c.setAttribute("opacity", 1 - p);
      requestAnimationFrame(fly);
    })(t0);
  }
}

function bump() {
  state.counter++;
  $("counter").textContent = state.counter;
}

/* ---------- Screen ---------- */

function setStep(n) {
  state.step = n;
  for (let i = 1; i <= 4; i++) $("st" + i).setAttribute("aria-pressed", String(i === n));
  $("holdSeg").hidden = n !== 3;
  $("sirenSeg").hidden = n !== 4;
  save();
  enterStep();
}

function setInstrument(k) {
  state.inst = k;
  for (const i in INSTRUMENTS) $("in" + i[0].toUpperCase() + i.slice(1)).setAttribute("aria-pressed", String(i === k));
  try { localStorage.setItem("brass-inst", k); } catch (_) {}
  enterStep();
}

function setHold(n) {
  state.hold = n;
  $("hold4").setAttribute("aria-pressed", String(n === 4));
  $("hold8").setAttribute("aria-pressed", String(n === 8));
  save();
  enterStep();
}

function setSiren(n) {
  state.siren = n;
  [["sirFree", 0], ["sir2", 2], ["sir4", 4], ["sir7", 7]].forEach(([id, v]) => $(id).setAttribute("aria-pressed", String(v === n)));
  save();
  enterStep();
}

function save() {
  try { localStorage.setItem("buzz", JSON.stringify({ step: state.step, hold: state.hold, siren: state.siren })); } catch (_) {}
}

function toggleFullscreen() {
  const d = document, root = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (p && p.catch) p.catch(() => {}); }
  } catch (_) {}
}

/* ---------- Loop ---------- */

let last = 0, tipAt = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000);
  last = now;
  if (now - state.lastAnalyse > ANALYSE_MS) { state.lastAnalyse = now; analyse(); }
  update(dt);
  draw(dt);
  if (now - tipAt > 20000) { tipAt = now; $("tip").textContent = TIPS[Math.floor(now / 20000) % TIPS.length]; }
  if (!$("diag").hidden) {
    const db = 20 * Math.log10(Math.max(state.rms, 1e-7));
    const bars = Math.max(0, Math.min(10, Math.round((db + 60) / 4.5)));
    $("diag").textContent = audioLine() + `בדיקת מיקרופון (D)\n` +
      `עוצמה  ${"█".repeat(bars)}${"·".repeat(10 - bars)}\n` +
      `צליל   ${state.freq ? state.freq.toFixed(0) + " Hz" : "—"}  ${state.semi === null ? "" : (state.semi > 0 ? "+" : "") + state.semi.toFixed(1)}\n` +
      `רצפה   ${(20 * Math.log10(Math.max(state.noiseFloor, 1e-7))).toFixed(0)} dB · ${state.soundOn ? "זמזום" : "שקט"}\n` +
      `v1`;
  }
  requestAnimationFrame(frame);
}

/* ---------- Wiring ---------- */

for (const k in INSTRUMENTS) $("in" + k[0].toUpperCase() + k.slice(1)).addEventListener("click", () => setInstrument(k));
for (let i = 1; i <= 4; i++) $("st" + i).addEventListener("click", () => setStep(i));
$("hold4").addEventListener("click", () => setHold(4));
$("hold8").addEventListener("click", () => setHold(8));
[["sirFree", 0], ["sir2", 2], ["sir4", 4], ["sir7", 7]].forEach(([id, v]) => $(id).addEventListener("click", () => setSiren(v)));
$("startBtn").addEventListener("click", e => { e.stopPropagation(); startMic(); });
$("overlay").addEventListener("click", startMic);
$("tone").addEventListener("click", playModel);
$("fullscreen").addEventListener("click", toggleFullscreen);
$("nextBtn").addEventListener("click", next);
document.addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); });

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t.tagName === "BUTTON" || t.tagName === "INPUT") return;
  const c = e.code;
  if (c === "Space" || c === "Enter" || c === "PageDown" || c === "ArrowRight") { e.preventDefault(); next(); }
  else if (/^Digit[1-4]$/.test(c)) setStep(+c.slice(5));
  else if (c === "KeyT") playModel();
  else if (c === "KeyR") state.noiseFloor = 0.002;
  else if (c === "KeyD") $("diag").hidden = !$("diag").hidden;
  else if (c === "KeyF") toggleFullscreen();
});

const params = new URLSearchParams(location.search);
try {
  const savedInst = localStorage.getItem("brass-inst");
  if (INSTRUMENTS[savedInst]) state.inst = savedInst;
  const saved = JSON.parse(localStorage.getItem("buzz") || "{}");
  if (saved.step >= 1 && saved.step <= 4) state.step = saved.step;
  if (saved.hold === 8) state.hold = 8;
  if ([0, 2, 4, 7].includes(saved.siren)) state.siren = saved.siren;
} catch (_) {}
if (INSTRUMENTS[params.get("inst")]) state.inst = params.get("inst");
if (/^[1-4]$/.test(params.get("step") || "")) state.step = +params.get("step");
if (params.get("diag") === "1") $("diag").hidden = false;
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) || matchMedia("(display-mode: standalone)").matches) $("fullscreen").hidden = true;
if (location.protocol === "file:") fail("המשחק עם המיקרופון עובד רק דרך הקישור באינטרנט");
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

$("tip").textContent = TIPS[0];
for (const i in INSTRUMENTS) $("in" + i[0].toUpperCase() + i.slice(1)).setAttribute("aria-pressed", String(i === state.inst));
setHold(state.hold);
setSiren(state.siren);
setStep(state.step);
requestAnimationFrame(frame);
</script>
</body>
</html>
