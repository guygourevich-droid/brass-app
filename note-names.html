<script>
  // English pages lay out left to right from the first paint (the language block fills in the words).
  try { if (/[?&]lang=en/.test(location.search) || (!/[?&]lang=he/.test(location.search) && localStorage.getItem("brass-lang") === "en")) { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; } } catch (_) {}
</script>
<style>
  :root {
    --ink: #15181d;
    --ink-2: #3b434e;
    --muted: #56616f;
    --line: rgba(21, 24, 29, .12);
    --panel: rgba(255, 255, 255, .9);
    --blue: #1a7fe2;
    --coral: #e4513f;
    --mint: #17905a;
    --good-bg: #e6f6ee;
    --bad-bg: #fdecea;
    --display: "Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  html[lang="he"] { --display: "Rubik", "Arial Hebrew", system-ui, sans-serif; --body: "Rubik", "Arial Hebrew", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html { background: #cfeaff; color: var(--ink); }
  body { margin: 0; font-family: var(--body); font-size: 15px; color: var(--ink); background: linear-gradient(180deg, #bfe4ff 0%, #e2f2ff 55%, #fff4e3 100%) fixed; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .cloud { position: absolute; left: -30vw; width: clamp(160px, 22vw, 320px); opacity: .8; animation: drift linear infinite; }
  .cloud:nth-child(1) { top: 12%; animation-duration: 120s; animation-delay: -30s; }
  .cloud:nth-child(2) { top: 74%; width: clamp(110px, 15vw, 220px); opacity: .65; animation-duration: 150s; animation-delay: -100s; }
  @keyframes drift { to { transform: translateX(160vw); } }

  .app { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; padding-inline: clamp(16px, 3vw, 48px); }

  .console { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .brand { font-family: var(--display); font-weight: 600; color: var(--ink-2); margin-inline-end: auto; text-decoration: none; }
  .brand:hover { color: var(--blue); }
  .brand-tool { font-weight: 500; color: var(--muted); }
  .seg { display: inline-flex; background: var(--panel); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg-btn { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-family: var(--display); font-weight: 500; color: var(--muted); }
  .seg-btn[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(21, 24, 29, .15); }
  .k { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .levels { display: inline-flex; align-items: center; gap: 4px; }
  .lvl { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-family: var(--display); font-weight: 500; cursor: pointer; color: var(--ink-2); }
  .lvl:hover { border-color: var(--blue); }
  .lvl[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle input { accent-color: var(--blue); width: 16px; height: 16px; }
  .icon-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; height: 32px; padding: 0 10px; cursor: pointer; color: var(--ink-2); }

  .stage { display: grid; grid-template-rows: auto auto auto auto; align-content: start; gap: clamp(8px, 1.8vh, 20px); padding-block: clamp(12px, 2.6vh, 32px); min-width: 0; }
  .stage-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 20px; font-family: var(--display); color: var(--ink-2); font-size: clamp(18px, 2.6vh, 28px); }
  .stage-head b { color: var(--ink); font-weight: 700; margin-inline-end: .45em; }
  .score { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .score b { color: var(--mint); margin: 0; }
  .info { margin: 0; color: var(--muted); font-size: clamp(14px, 1.8vh, 17px); }

  .card { background: rgba(255, 255, 255, .9); border-radius: 28px; padding: clamp(8px, 2vw, 24px); box-shadow: 0 8px 30px rgba(40, 100, 160, .12); display: flex; justify-content: center; }
  .card svg { display: block; width: 100%; height: auto; max-height: 48vh; }
  .learn-note { cursor: pointer; outline: none; }
  .learn-note:focus-visible rect { stroke: var(--blue); stroke-width: 3; }

  .answers { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 1.2vw, 14px); }
  .answer {
    font-family: var(--display); font-weight: 600; font-size: clamp(22px, 3.6vh, 40px);
    min-width: 3.4em; padding: .35em .8em; border-radius: 999px; background: #fff;
    border: 3px solid #cfdae6; color: var(--ink); cursor: pointer; transition: transform .1s, background-color .15s, border-color .15s;
  }
  .answer:hover { border-color: var(--blue); }
  .answer:active { transform: scale(.97); }
  .answer.right { background: var(--good-bg); border-color: var(--mint); color: #0f6a42; }
  .answer.wrong { background: var(--bad-bg); border-color: var(--coral); color: #b3342a; animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  .transport { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 20px; border-top: 1px solid var(--line); }
  .tip { color: var(--ink-2); font-size: clamp(14px, 1.9vh, 18px); max-width: 60ch; }
  .tip b { font-family: var(--display); color: var(--ink); }
  .transport-btns { display: flex; gap: 12px; margin-inline-start: auto; }
  .btn { font-family: var(--display); font-weight: 600; font-size: clamp(17px, 2.4vh, 24px); border-radius: 999px; padding: .6em 1.4em; cursor: pointer; border: 2px solid transparent; }
  .btn.primary { background: var(--blue); color: #fff; min-width: 7.5em; }
  .btn.primary:hover { background: #0f63b8; }
  .btn.ghost { background: var(--panel); border-color: var(--line); color: var(--ink-2); }
  .btn.ghost:hover { border-color: var(--blue); }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  @media (max-width: 640px) {
    .brand { width: 100%; }
    .transport-btns { width: 100%; }
    .transport-btns .btn { flex: 1; }
    .console { gap: 8px 10px; }
    .seg-btn { padding: 6px 10px; }
    .info { display: none; }
    .btn { white-space: nowrap; font-size: 17px; padding: .55em .9em; }
  }
  @media (max-width: 640px) and (max-height: 700px) {
    .tip { display: none; }
    .card svg { max-height: 36vh; }
  }
  /* Short screens (a phone on its side): drop the extras so the staff and the buttons fit. */
  @media (max-height: 500px) {
    .console { gap: 6px 12px; padding-block: 6px; }
    .info, .tip { display: none; }
    .stage { padding-block: 6px; gap: 6px; }
    .stage-head { font-size: 17px; }
    .card { padding: 4px 8px; border-radius: 18px; }
    .card svg { max-height: 38vh; }
    .answer { font-size: 20px; padding: .2em .7em; }
    .transport { padding-block: 6px 8px; }
    .btn { font-size: 16px; padding: .45em 1.1em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .answer.wrong { animation: none; }
  }
  .seg[hidden] { display: none; }
  .card { direction: ltr; }               /* music reads left to right in every language */
</style>

<script>
"use strict";

/* ---------- Language ----------
   Hebrew or English, chosen on the home screen (`brass-lang`; ?lang=en|he for a link). Never mixed: every
   word on screen comes from TEXT (elements carry data-t / data-t-html / data-t-title / data-t-aria), and
   English names notes by letter (C D E, B♭). COMMON holds what every page says (microphone, pause, buttons). */
const LANG = (() => {
  try {
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "en" || q === "he") return q;
    return localStorage.getItem("brass-lang") === "en" ? "en" : "he";
  } catch (_) { return "he"; }
})();
const COMMON = {
  he: {
    listening: "מקשיב", noMicSound: "אין קול מהמיקרופון", muted: "מושתק", tapScreen: "לגעת במסך", noMic: "ללא מיקרופון",
    mic: "מיקרופון", test: "בדיקה", start: "התחלה", tryAgain: "לנסות שוב", startPrompt: "נלחץ ונתחיל להקשיב",
    keepListening: "נלחץ ונמשיך להקשיב", onlyOnline: "המשחק עם המיקרופון עובד רק דרך הקישור באינטרנט",
    micDenied: "אין אישור למיקרופון", micNotFound: "לא נמצא מיקרופון", micBusy: "המיקרופון תפוס בתוכנה אחרת",
    micFailed: "לא הצלחנו לפתוח את המיקרופון", micGone: "המיקרופון נותק",
    pause: "השהיה (Esc)", resume: "▶ ממשיכים", stop: "■ עצירה", fullscreen: "מסך מלא (F)", home: "‹ Brass App",
    trumpet: "חצוצרה", trombone: "טרומבון", horn: "קרן", instrument: "כלי",
    diagTitle: "בדיקת מיקרופון (D)", diagAudio: "אודיו", diagMic: "מיקרופון", diagLevel: "רמה", diagVolume: "עוצמה",
    diagPitch: "צליל", diagCents: "דיוק", diagFloor: "רצפה", moving: "זז", still: "עומד", sound: "צליל", quiet: "שקט", turn: "📱 לרוחב זה גדול יותר"
  },
  en: {
    listening: "Listening", noMicSound: "No sound from the mic", muted: "Muted", tapScreen: "Tap the screen", noMic: "No microphone",
    mic: "Microphone", test: "Test", start: "Start", tryAgain: "Try again", startPrompt: "Tap to start listening",
    keepListening: "Tap to keep listening", onlyOnline: "The microphone games only work from the web link",
    micDenied: "The microphone wasn't allowed", micNotFound: "No microphone found", micBusy: "Another app is using the microphone",
    micFailed: "Couldn't open the microphone", micGone: "The microphone was disconnected",
    pause: "Pause (Esc)", resume: "▶ Continue", stop: "■ Stop", fullscreen: "Full screen (F)", home: "‹ Brass App",
    trumpet: "Trumpet", trombone: "Trombone", horn: "Horn", instrument: "Instrument",
    diagTitle: "Microphone check (D)", diagAudio: "Audio", diagMic: "Mic", diagLevel: "Level", diagVolume: "Volume",
    diagPitch: "Pitch", diagCents: "Cents", diagFloor: "Floor", moving: "running", still: "stopped", sound: "sound", quiet: "quiet", turn: "📱 Turn sideways for a bigger picture"
  }
};
const T = (key, ...args) => {
  const v = (TEXT[LANG] && TEXT[LANG][key]) ?? COMMON[LANG][key] ?? (TEXT.he && TEXT.he[key]) ?? COMMON.he[key] ?? key;
  return typeof v === "function" ? v(...args) : v;
};
function applyText() {
  const root = document.documentElement;
  root.lang = LANG;
  root.dir = LANG === "he" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = T(n.dataset.t); });
  document.querySelectorAll("[data-t-html]").forEach(n => { n.innerHTML = T(n.dataset.tHtml); });
  document.querySelectorAll("[data-t-title]").forEach(n => { n.title = T(n.dataset.tTitle); });
  document.querySelectorAll("[data-t-aria]").forEach(n => { n.setAttribute("aria-label", T(n.dataset.tAria)); });
  if (TEXT[LANG] && TEXT[LANG].pageTitle) document.title = T("pageTitle");
}
const TEXT = {
  he: {
    pageTitle: "תווים · Brass App", controls: "פקדי המורה", back: "חזרה ל-Brass App", tool: "/ תווים", mode: "מצב",
    learn: "מכירים את התווים", quiz: "איך קוראים לו?", level: "שלב", noteNames: "שמות התווים", sound: "צליל", fullscreenBtn: "⛶ מסך מלא",
    answers: "תשובות", levelN: n => `שלב ${n}`, levelTip: n => `שלב ${n}: ${n + 1} תווים`, levelNotes: list => `התווים בשלב הזה: ${list}`,
    playIt: name => `${name}: להשמיע`, isNew: "חדש", whichNote: "איזה תו זה?",
    tipFirstTrombone: f => `<b>${f}</b> יושב על הקו השני מלמטה.`, tipFirst: f => `<b>${f}</b> יושב על קו קטן משלו מתחת לחמשה.`,
    tips: ["<b>קו או רווח?</b> מסתכלים טוב לפני שעונים.", "<b>מוצאים תו שמכירים,</b> ואז עולים או יורדים.", "<b>אומרים ביחד,</b> ואז בודקים את התשובה."],
    score: (s, b) => `ברצף: <b>${s}</b> · שיא: ${b}`, playThem: "▶ להשמיע", next: "הבא ◀", nameIt: "איך קוראים לו? ◀", hearIt: "🔊 לשמוע",
    info: { trumpet: "חצוצרה בסי במול · תווים כתובים במפתח סול · הצליל נשמע טון אחד נמוך יותר", trombone: "טרומבון · מפתח פה · נשמע בדיוק כמו שכתוב", horn: "קרן בפה · תווים כתובים במפתח סול · הצליל נשמע קווינטה נמוך יותר" },
    names: ["דוֹ", "רֶה", "מִי", "פָה", "סוֹל", "לָה", "סִי"]
  },
  en: {
    pageTitle: "Note Names · Brass App", controls: "Teacher controls", back: "Back to Brass App", tool: "/ Note Names", mode: "Mode",
    learn: "Meet the notes", quiz: "Name it", level: "Level", noteNames: "Note names", sound: "Sound", fullscreenBtn: "⛶ Full screen",
    answers: "Answers", levelN: n => `Level ${n}`, levelTip: n => `Level ${n}: ${n + 1} notes`, levelNotes: list => `The notes for this level: ${list}`,
    playIt: name => `${name}: play`, isNew: "new", whichNote: "Which note is this?",
    tipFirstTrombone: f => `<b>${f}</b> sits on the second line from the bottom.`, tipFirst: f => `<b>${f}</b> sits on its own little line below the staff.`,
    tips: ["<b>Line or space?</b> Look carefully before you answer.", "<b>Find a note you know,</b> then step up or down.", "<b>Say it together</b>, then check the answer."],
    score: (s, b) => `In a row: <b>${s}</b> · Best: ${b}`, playThem: "▶ Play them", next: "Next ▶", nameIt: "Name it ▶", hearIt: "🔊 Hear it",
    info: { trumpet: "Trumpet in B♭ · written notes, treble clef · the sound is concert pitch, a tone lower", trombone: "Trombone · bass clef · concert pitch, no transposition", horn: "Horn in F · written notes, treble clef · the sound is concert pitch, a 5th lower" },
    names: ["C", "D", "E", "F", "G", "A", "B"]
  }
};
applyText();

/* ---------- Note Names ----------
   Students always see their own WRITTEN note, in their own clef, with the name they read.
   The sound is the real CONCERT pitch: trumpet in B♭ sounds a tone lower, horn in F a 5th lower, trombone as written. */

const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const INK = "#15181d", GOOD = "#17905a", GOLD = "#b7800f", WASH = "#ddebfa", BLUE = "#1a7fe2";

// Bravura music font (SMuFL, SIL OFL): font-size = 4 staff spaces, each symbol sits on its reference line.
const GLYPH = { gClef: "", fClef: "", flat: "", whole: "" };
const MUSIC_FONT = "font-family: Bravura";
const WHOLE_WIDTH = 1.688; // staff spaces

const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
const SOLFEGE = TEXT.he.names;          // Hebrew do re mi; English always names notes by letter
const SEMITONE = [0, 2, 4, 5, 7, 9, 11];

// A written note: letter index (C = 0 … B = 6), octave (C4 = middle C), alteration (-1 = flat).
const note = (l, o, a = 0) => ({ l, o, a });
const TREBLE_FIRST_NOTES = [note(0, 4), note(1, 4), note(2, 4), note(3, 4), note(4, 4), note(5, 4), note(6, 4), note(0, 5)];

// First notes in the order they are added. Level n uses the first n + 1 notes.
const INSTRUMENTS = {
  trumpet: {
    label: "Trumpet", clef: "treble", transpose: -2, notes: TREBLE_FIRST_NOTES,
    info: "Trumpet in B♭ · written notes, treble clef · the sound is concert pitch, a tone lower"
  },
  trombone: {
    label: "Trombone", clef: "bass", transpose: 0,
    notes: [note(6, 2, -1), note(0, 3), note(1, 3), note(2, 3, -1), note(3, 3), note(4, 3), note(5, 3), note(6, 3, -1)],
    info: "Trombone · bass clef · concert pitch, no transposition"
  },
  horn: {
    label: "Horn", clef: "treble", transpose: -7, notes: TREBLE_FIRST_NOTES,
    info: "Horn in F · written notes, treble clef · the sound is concert pitch, a 5th lower"
  }
};
const LEVEL_COUNT = 7;

const state = {
  inst: "trumpet", level: 1, mode: "learn", names: "solfege", sound: true,
  current: null, drawn: null, answered: false, streak: 0, best: 0, last: -1, tip: 0,
  learn: [], timers: []
};

const nameOf = n => (state.names === "solfege" && LANG === "he" ? SOLFEGE : LETTERS)[n.l] + (n.a === -1 ? "♭" : "");
const concertMidi = n => 12 * (n.o + 1) + SEMITONE[n.l] + n.a + INSTRUMENTS[state.inst].transpose;
const levelNotes = () => INSTRUMENTS[state.inst].notes.slice(0, state.level + 1);

/* ---------- Sound ---------- */

const Sound = (() => {
  let ctx = null, master = null;

  function ensure() {
    if (!ctx) {
      if (navigator.audioSession) navigator.audioSession.type = "playback";
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.8;
      master.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
  }

  // Warm brass-like tone: two detuned sawtooths, the filter opens on the attack. Returns ms until the note starts.
  function play(midi, delay = 0, dur = 1.1) {
    ensure();
    const t = ctx.currentTime + 0.03 + delay, hz = 440 * Math.pow(2, (midi - 69) / 12);
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = "lowpass";
    f.Q.value = 1.1;
    f.frequency.setValueAtTime(hz * 1.5, t);
    f.frequency.exponentialRampToValueAtTime(Math.min(6000, hz * 8), t + 0.07);
    f.frequency.exponentialRampToValueAtTime(Math.min(4000, hz * 4.5), t + 0.35);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.05);
    g.gain.setValueAtTime(0.18, t + dur - 0.18);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    f.connect(g); g.connect(master);
    for (const detune of [0, 6]) {
      const o = ctx.createOscillator();
      o.type = "sawtooth";
      o.frequency.value = hz;
      o.detune.value = detune;
      o.connect(f);
      o.start(t); o.stop(t + dur + 0.05);
    }
    return (t - ctx.currentTime) * 1000;
  }

  return { play };
})();

/* ---------- Staff ---------- */

function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

// Staff position: 0 = bottom line, 1 = first space … 8 = top line. Treble bottom line is E4, bass bottom line is G2.
function staffPos(n) {
  const diatonic = n.o * 7 + n.l;
  return INSTRUMENTS[state.inst].clef === "treble" ? diatonic - 30 : diatonic - 18;
}

function drawStaff(svg, x0, x1, yTop, S) {
  const yBottom = yTop + 4 * S;
  for (let i = 0; i < 5; i++) el("line", { x1: x0, x2: x1, y1: yTop + i * S, y2: yTop + i * S, stroke: INK, "stroke-width": S * 0.08 }, svg);
  const treble = INSTRUMENTS[state.inst].clef === "treble";
  const lineY = treble ? yBottom - S : yTop + S; // G clef wraps the G line; F clef dots sit either side of the F line
  el("text", { x: x0 + S * 0.6, y: lineY, "font-size": 4 * S, fill: INK, style: MUSIC_FONT }, svg).textContent = treble ? GLYPH.gClef : GLYPH.fClef;
  return p => yBottom - (p * S) / 2;
}

function drawNote(parent, n, x, yOf, S) {
  const p = staffPos(n), y = yOf(p), w = WHOLE_WIDTH * S;
  const g = el("g", { fill: INK }, parent);
  const ledger = q => el("line", { x1: x - 0.45 * S, x2: x + w + 0.45 * S, y1: yOf(q), y2: yOf(q), stroke: INK, "stroke-width": S * 0.13 }, parent);
  for (let q = -2; q >= p; q -= 2) ledger(q);
  for (let q = 10; q <= p; q += 2) ledger(q);
  if (n.a === -1) el("text", { x: x - 1.3 * S, y, "font-size": 4 * S, style: MUSIC_FONT }, g).textContent = GLYPH.flat;
  el("text", { x, y, "font-size": 4 * S, style: MUSIC_FONT }, g).textContent = GLYPH.whole;
  return { g, y, cx: x + w / 2 };
}

/* ---------- Meet the notes ---------- */

function clearTimers() {
  state.timers.forEach(clearTimeout);
  state.timers = [];
}

function renderLearn() {
  const ns = levelNotes(), S = 30, gap = 124, first = 150, yTop = 120; // room for a flat between notes
  const VW = first + ns.length * gap + 20, VH = 400;
  const card = $("card");
  card.textContent = "";
  const svg = el("svg", { viewBox: `0 0 ${VW} ${VH}`, role: "img", "aria-label": T("levelNotes", ns.map(nameOf).join(", ")) }, card);
  const yOf = drawStaff(svg, 20, VW - 20, yTop, S);
  state.learn = ns.map((n, i) => {
    const x = first + i * gap;
    const item = el("g", { class: "learn-note", tabindex: 0, role: "button", "aria-label": T("playIt", nameOf(n)) }, svg);
    const box = el("rect", { x: x - 24, y: 22, width: WHOLE_WIDTH * S + 48, height: 364, rx: 16, fill: "transparent" }, item);
    const drawn = drawNote(item, n, x, yOf, S);
    const label = el("text", { x: drawn.cx, y: 364, "text-anchor": "middle", "font-size": 40, "font-weight": 700, fill: INK, style: "font-family: var(--display)" }, item);
    label.textContent = nameOf(n);
    if (state.level > 1 && i === ns.length - 1) {
      el("rect", { x: drawn.cx - 34, y: 34, width: 68, height: 30, rx: 15, fill: "#fdf1d6", stroke: GOLD, "stroke-width": 2 }, item);
      el("text", { x: drawn.cx, y: 55, "text-anchor": "middle", "font-size": 18, "font-weight": 700, fill: GOLD, style: "font-family: var(--display)" }, item).textContent = T("isNew");
    }
    item.addEventListener("click", () => playOne(i));
    item.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playOne(i); } });
    return { n, box, drawn, label };
  });
  $("answers").textContent = "";
}

function light(i, on) {
  const it = state.learn[i];
  if (!it) return;
  it.box.setAttribute("fill", on ? WASH : "transparent");
  it.drawn.g.setAttribute("fill", on ? BLUE : INK);
  it.label.setAttribute("fill", on ? BLUE : INK);
}

function playOne(i) {
  clearTimers();
  state.learn.forEach((_, j) => light(j, false));
  light(i, true);
  if (state.sound) Sound.play(concertMidi(state.learn[i].n));
  state.timers.push(setTimeout(() => light(i, false), 1000));
}

function playAll() {
  clearTimers();
  state.learn.forEach((it, i) => {
    const ms = state.sound ? Sound.play(concertMidi(it.n), i * 0.9, 0.8) : 30 + i * 900;
    state.timers.push(setTimeout(() => light(i, true), ms));
    state.timers.push(setTimeout(() => light(i, false), ms + 800));
  });
}

/* ---------- Name it ---------- */

function nextNote() {
  const ns = levelNotes(), newest = ns.length - 1;
  let i = 0;
  for (let tries = 0; tries < 20; tries++) {
    i = state.level > 1 && Math.random() < 0.35 ? newest : Math.floor(Math.random() * ns.length);
    if (i !== state.last) break;
  }
  state.last = i;
  state.current = ns[i];
  state.answered = false;
  renderQuiz();
  rotateTip();
}

function renderQuiz() {
  const S = 30, VW = 720, VH = 400, yTop = 120;
  const card = $("card");
  card.textContent = "";
  const svg = el("svg", { viewBox: `0 0 ${VW} ${VH}`, role: "img", "aria-label": T("whichNote") }, card);
  const yOf = drawStaff(svg, 30, VW - 30, yTop, S);
  const drawn = drawNote(svg, state.current, 390, yOf, S);
  const label = el("text", { x: drawn.cx, y: 372, "text-anchor": "middle", "font-size": 60, "font-weight": 700, fill: GOOD, opacity: 0, style: "font-family: var(--display)" }, svg);
  state.drawn = { ...drawn, label };

  const box = $("answers");
  box.textContent = "";
  [...new Set(levelNotes().map(nameOf))].forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "answer";
    b.textContent = name;
    b.dataset.name = name;
    b.setAttribute("aria-keyshortcuts", String(i + 1));
    b.addEventListener("click", () => answer(name));
    box.appendChild(b);
  });
}

function answer(name) {
  if (state.mode !== "quiz" || state.answered || !state.current) return;
  state.answered = true;
  const right = nameOf(state.current), ok = name === right;
  [...$("answers").children].forEach(b => {
    if (b.dataset.name === right) b.classList.add("right");
    else if (b.dataset.name === name) b.classList.add("wrong");
  });
  if (ok) state.drawn.g.setAttribute("fill", GOOD);
  state.drawn.label.textContent = right;
  state.drawn.label.setAttribute("opacity", 1);
  state.streak = ok ? state.streak + 1 : 0;
  state.best = Math.max(state.best, state.streak);
  updateScore();
  if (state.sound) Sound.play(concertMidi(state.current));
  if (ok && state.streak % 10 === 0) confetti();
}

function hear() {
  if (state.current) Sound.play(concertMidi(state.current));
}

/* ---------- Screen ---------- */

function tips() {
  const first = nameOf(INSTRUMENTS[state.inst].notes[0]);
  return [
    state.inst === "trombone" ? T("tipFirstTrombone", first) : T("tipFirst", first),
    ...T("tips")
  ];
}

function rotateTip() {
  const list = tips();
  $("tip").innerHTML = list[state.tip % list.length];
  state.tip++;
}

function updateScore() {
  $("score").innerHTML = state.mode === "quiz" ? T("score", state.streak, state.best) : "";
}

function updateHeader() {
  const I = INSTRUMENTS[state.inst];
  $("levelNum").textContent = T("levelN", state.level);
  $("levelNotes").textContent = levelNotes().map(nameOf).join(" · ");
  $("info").textContent = T("info")[state.inst];
  $("namesSeg").hidden = LANG === "en";      // English names notes by letter only
  document.querySelectorAll(".lvl").forEach((b, i) => b.setAttribute("aria-pressed", String(i + 1 === state.level)));
  $("mLearn").setAttribute("aria-pressed", String(state.mode === "learn"));
  $("mQuiz").setAttribute("aria-pressed", String(state.mode === "quiz"));
  $("nSolfege").setAttribute("aria-pressed", String(state.names === "solfege"));
  $("nLetters").setAttribute("aria-pressed", String(state.names === "letters"));
  $("primaryBtn").textContent = state.mode === "learn" ? T("playThem") : T("next");
  $("secondaryBtn").textContent = state.mode === "learn" ? T("nameIt") : T("hearIt");
  updateScore();
}

function render({ newNote = false } = {}) {
  clearTimers();
  updateHeader();
  if (state.mode === "learn") { renderLearn(); rotateTip(); return; }
  if (newNote || !state.current) nextNote();
  else renderQuiz();
}

function setLevel(n) { state.level = n; state.current = null; state.last = -1; state.streak = 0; render(); }
function setMode(m) { state.mode = m; render({ newNote: m === "quiz" }); }
function setNames(sys) { state.names = sys; render(); }

function primary() { state.mode === "learn" ? playAll() : nextNote(); }
function secondary() { state.mode === "learn" ? setMode("quiz") : hear(); }

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"), g = c.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  g.scale(dpr, dpr);
  const colors = ["#1a7fe2", "#17905a", "#e3a92b", "#ff6f59", "#7a5cf0"];
  const ps = Array.from({ length: 140 }, () => ({
    x: W * (0.25 + Math.random() * 0.5), y: H * 0.6,
    vx: (Math.random() - 0.5) * 16, vy: -(9 + Math.random() * 13),
    s: 7 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const t0 = performance.now();
  (function draw(now) {
    const t = now - t0;
    g.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += 0.45; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      g.globalAlpha = Math.max(0, 1 - t / 2200);
      g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66);
      g.restore();
    }
    if (t < 2200) requestAnimationFrame(draw); else g.clearRect(0, 0, W, H);
  })(t0);
}

function toggleFullscreen() {
  const d = document, root = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else {
      const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      if (p && p.catch) p.catch(() => {});
    }
  } catch (_) { /* not allowed here */ }
}

/* ---------- Wiring ---------- */

for (let n = 1; n <= LEVEL_COUNT; n++) {
  const b = document.createElement("button");
  b.className = "lvl";
  b.id = "lvl" + n;
  b.textContent = n;
  b.title = T("levelTip", n);
  b.setAttribute("aria-label", b.title);
  b.addEventListener("click", () => setLevel(n));
  $("levels").appendChild(b);
}

$("mLearn").addEventListener("click", () => setMode("learn"));
$("mQuiz").addEventListener("click", () => setMode("quiz"));
$("nSolfege").addEventListener("click", () => setNames("solfege"));
$("nLetters").addEventListener("click", () => setNames("letters"));
$("sound").addEventListener("change", e => { state.sound = e.target.checked; });
$("primaryBtn").addEventListener("click", primary);
$("secondaryBtn").addEventListener("click", secondary);
$("fullscreen").addEventListener("click", toggleFullscreen);

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b && e.detail) b.blur();
});

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target, k = e.key;
  const native = t.tagName === "BUTTON" || t.type === "checkbox" || (t.classList && t.classList.contains("learn-note"));
  if ((k === " " || k === "Enter") && native) return;
  if (k === " " || k === "Enter" || k === "PageDown" || k === "ArrowRight") { e.preventDefault(); primary(); }
  else if (state.mode === "quiz" && /^Digit[1-9]$/.test(e.code)) { const b = $("answers").children[+e.code.slice(5) - 1]; if (b) answer(b.dataset.name); }
  else if (e.code === "KeyH" && state.mode === "quiz") hear();
  else if (e.code === "KeyF") toggleFullscreen();
});

const rootEl = document.documentElement;
if (!(rootEl.requestFullscreen || rootEl.webkitRequestFullscreen) || matchMedia("(display-mode: standalone)").matches) $("fullscreen").hidden = true;
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

try { const s = localStorage.getItem("brass-inst"); if (INSTRUMENTS[s]) state.inst = s; } catch (_) {}
render();
// Draw again once the music font has loaded, so clefs and notes never show as blank boxes.
if (document.fonts && document.fonts.load) document.fonts.load("120px Bravura").then(() => render(), () => {});
</script>
</body>
</html>
