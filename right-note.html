<script>
  // Moving house: the old address (GitHub Pages) hands this device's settings to tonebee.app and sends the page there.
  (function () {
    var keep = /^(brass-|right-note-|ninja-|horn-ladder|breath$|buzz$|songs$|sound-game$)/;
    try {
      if (/github\.io$/.test(location.hostname)) {
        var d = {};
        for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (keep.test(k)) d[k] = localStorage.getItem(k); }
        var page = location.pathname.split("/").pop() || "index.html";
        location.replace("https://tonebee.app/" + page + location.search + "#move=" + encodeURIComponent(JSON.stringify(d)));
        return;
      }
      var m = location.hash.match(/^#move=(.*)$/);
      if (m) {
        var s = JSON.parse(decodeURIComponent(m[1]));
        for (var key in s) if (keep.test(key) && typeof s[key] === "string") localStorage.setItem(key, s[key]);
        history.replaceState(null, "", location.pathname + location.search);
      }
    } catch (_) {}
  })();
  // English pages lay out left to right from the first paint (the language block fills in the words).
  try { if (/[?&]lang=en/.test(location.search) || (!/[?&]lang=he/.test(location.search) && localStorage.getItem("brass-lang") === "en")) { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; } } catch (_) {}
</script>
<style>
  :root {
    --ink: #15181d;
    --ink-2: #3b434e;

    --accent: #1a7fe2;

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  .console { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px clamp(12px, 3vw, 28px); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .console a { color: var(--muted); text-decoration: none; }
  .spacer { margin-inline-start: auto; }
  .seg { display: inline-flex; background: var(--panel); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg-btn { border: 0; background: transparent; min-height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }

  /* Settings */
  .sheet { position: absolute; inset: 0; background: rgba(255, 255, 255, .97); overflow: auto; padding: 2vh clamp(16px, 4vw, 48px) 4vh; }
  .sheet[hidden] { display: none; }
  .sheet h2 { font-size: clamp(20px, 3vh, 30px); margin: 2vh 0 1vh; font-weight: 700; }
  .notes { display: flex; flex-wrap: wrap; gap: 10px; }
  .note-chip { min-width: 84px; min-height: 60px; border-radius: 16px; border: 3px solid var(--line); background: #fff; font-size: clamp(18px, 2.6vh, 26px); font-weight: 700; cursor: pointer; }
  .note-chip[aria-pressed="true"] { border-color: var(--accent); background: #e8f2fe; color: #0f4f96; }
  .note-chip small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 1vh 0; }
  .row > span:first-child { min-width: 9ch; color: var(--muted); }
  .done-btn { background: var(--go); color: #fff; border: 0; border-radius: 999px; font-weight: 700; font-size: clamp(18px, 2.6vh, 26px); padding: .55em 1.8em; cursor: pointer; min-height: 52px; margin-top: 2vh; }

  .diag { position: absolute; inset-inline-end: 10px; bottom: 10px; background: rgba(13, 17, 23, .85); color: #d7e4f5; font-size: 13px; line-height: 1.6; padding: 8px 12px; border-radius: 10px; white-space: pre; font-variant-numeric: tabular-nums; }
  .diag[hidden] { display: none; }

  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 8px clamp(12px, 3vw, 28px) 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .stars { font-size: 22px; letter-spacing: 2px; }
  kbd { font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  /* Pause: the whole screen freezes behind one big symbol. */
  .pause { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: rgba(255, 255, 255, .8); cursor: pointer; }
  .pause[hidden] { display: none; }
  .pause-box { text-align: center; }
  .pause-icon { font-size: clamp(80px, 22vh, 220px); line-height: 1; color: #1a7fe2; }
  .resume-btn { margin-top: 2vh; background: #1a7fe2; color: #fff; border: 0; border-radius: 999px; font: inherit; font-weight: 700; font-size: clamp(22px, 4vh, 40px); padding: .5em 1.4em; cursor: pointer; min-height: 56px; }
  .pause-stop { display: block; margin: 2.5vh auto 0; background: none; border: 0; font: inherit; font-size: clamp(16px, 2.6vh, 24px); color: #56616f; text-decoration: underline; cursor: pointer; min-height: 44px; }
  /* Touch screens have no keyboard: no key hints. */
  @media (hover: none) and (pointer: coarse) { .keys { display: none; } }
  /* Phone upright: the picture is drawn wide, so suggest turning the phone. */
  .turn { display: none; }
  @media (orientation: portrait) and (max-width: 600px) { .overlay .turn { display: block; margin: 22px 0 0; font-size: 16px; font-weight: 500; opacity: .75; } }
  /* Phones: one compact top bar; the way home is the app's icon. */
  .home-icon { display: none; }
  @media (max-width: 600px) {
    .console { gap: 6px 8px; padding: 6px 10px; }
    .home { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; font-size: 20px; }
    .home-word { display: none; }
    .home-icon { display: block; width: 30px; height: 30px; border-radius: 22%; }
    .icon-btn { min-width: 40px; min-height: 40px; padding: 0 8px; }
    .seg-btn { padding: 0 10px; }
  }

<div class="app">
  <header class="console">
    <a class="home" href="index.html" aria-label="Tonebee" data-t-aria="brand">‹<img class="home-icon" src="icons/icon-192.png" alt=""><span class="home-word"> <span data-t="brand">Tonebee</span></span></a>
    <span class="spacer"></span>
    <span><span class="mic-dot" id="micDot"></span> <span id="micText" data-t="mic"></span></span>

   Older iPads (Safari before 14.1) have no float sample reader: build it from the byte one.
   A suspended or interrupted iPad audio engine (lock screen, a call) wakes on any tap.
   Tapping the microphone status opens the microphone check (no keyboard needed). */
if (window.AnalyserNode && !AnalyserNode.prototype.getFloatTimeDomainData) {
  AnalyserNode.prototype.getFloatTimeDomainData = function (out) {
    const bytes = new Uint8Array(out.length);
    this.getByteTimeDomainData(bytes);
    for (let i = 0; i < out.length; i++) out[i] = (bytes[i] - 128) / 128;
  };
}
["touchend", "click"].forEach(type => document.addEventListener(type, () => {
  if (ctx && ctx.state !== "running" && ctx.state !== "closed") ctx.resume();
}, true));
document.getElementById("micText").parentElement.addEventListener("click", () => {
  const d = document.getElementById("diag");
  d.hidden = !d.hidden;
});
// iPad/iPhone: the raw microphone is too quiet for a horn at a normal distance (measured in class), so use
// the device's own voice processing and automatic volume. Elsewhere raw is louder than enough and purer.
// ?voice=1 / ?voice=0 forces either way. (iPadOS Safari calls itself a Mac; the touch points give it away.)
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const VOICE_PARAM = new URLSearchParams(location.search).get("voice");
const MIC_OPTIONS = (VOICE_PARAM === null ? IS_IOS : VOICE_PARAM !== "0") ? true
  : { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
// The check panel's first lines: is the engine moving, what the iPad says about the mic, the raw level in dB.
let lastEngineTime = -1, engineMovedAt = 0;
const audioLine = () => {
  if (!ctx) return T("diagAudio") + "   —\n";
  if (ctx.currentTime !== lastEngineTime) { lastEngineTime = ctx.currentTime; engineMovedAt = performance.now(); }
  const moving = performance.now() - engineMovedAt < 500;     // the clock advances in bursts, not every frame
  const tr = micStream && micStream.getAudioTracks()[0];
  const st = tr && tr.getSettings ? tr.getSettings() : {};
  const db = state.rms > 0 ? (20 * Math.log10(state.rms)).toFixed(0) + " dB" : "0";
  return `${T("diagAudio")}   ${ctx.state} · ${ctx.sampleRate} · ${moving ? T("moving") : T("still")}\n` +
    `${T("diagMic")} ${tr ? tr.readyState + (tr.muted ? " muted" : "") + (tr.enabled ? "" : " off") : "—"} · ${st.sampleRate || "?"} · ${MIC_OPTIONS === true ? "voice" : "raw"} ec:${st.echoCancellation} agc:${st.autoGainControl}\n` +
    `${T("diagLevel")}    ${db}\n`;
};


/* ---------- Right note ----------
   One staff: the target note, and the note the player is actually making.
   Hold the target long enough and it rewards, then moves to another note the teacher has chosen.
   Nothing ever turns red; a wrong note is simply shown where it really is. */

const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

const GLYPH = { gClef: "", fClef: "", flat: "", sharp: "", head: "", headOpen: "" };
const MUSIC_FONT = "font-family: Bravura";
const SOLFEGE = T("noteNames");      // English: letters; Hebrew: do re mi
const SEMITONE = [0, 2, 4, 5, 7, 9, 11];

// written = concert + toWritten. `notes` are written midi values the teacher can switch on.
const INSTRUMENTS = {
  trumpet:  { clef: "treble", toWritten: 2, lo: 180, hi: 1000,
              notes: [60, 62, 64, 65, 67, 69, 71, 72], open: [60, 67, 72], def: [60, 62, 64, 65, 67] },
  trombone: { clef: "bass",  toWritten: 0, lo: 80, hi: 500,
              notes: [46, 48, 50, 51, 53, 55, 57, 58], open: [46, 53, 58], def: [46, 48, 50, 51, 53] },
  horn:     { clef: "treble", toWritten: 7, lo: 130, hi: 800,
              notes: [60, 62, 64, 65, 67, 69, 71, 72, 76], open: [60, 67, 72, 76], def: [60, 62, 64, 65, 67] }
};

const TOL = { wide: 75, normal: 50, tight: 30 };
const HOLDS = [2, 3, 4, 5];

const state = {
  inst: "trumpet", chosen: [], target: 67, order: "random", names: true, arrow: true,
  hold: 3, tol: "normal", ref: true, stars: 0,
  listening: false, holdProgress: 0, inBand: false,
  rms: 0, freq: 0, clarity: 0, cents: null, noiseFloor: 0.002,
  soundOn: false, soundSince: 0, muteUntil: 0, lastAnalyse: 0, inBandSince: 0, drainFrom: 0, drainSince: 0
};

/* ---------- Notes ---------- */

function spell(midi) {
  const pc = ((Math.round(midi) % 12) + 12) % 12;
  let octave = Math.floor(Math.round(midi) / 12) - 1;
  let step = 0, alter = 0;
  for (let i = 6; i >= 0; i--) if (SEMITONE[i] <= pc) { step = i; alter = pc - SEMITONE[i]; break; }
  // Brass reads flats: B♭ and E♭, never A♯ or D♯.
  if (alter > 0) { step = (step + 1) % 7; alter = -1; if (step === 0) octave += 1; }
  return { step, alter, octave: step === 0 && alter === -1 ? octave + 1 : octave };
}
const diatonicOf = sp => sp.octave * 7 + sp.step;
const nameOf = midi => { const sp = spell(midi); return SOLFEGE[sp.step] + (sp.alter === -1 ? "♭" : sp.alter === 1 ? "♯" : ""); };
const concertHz = written => 440 * Math.pow(2, (written - INSTRUMENTS[state.inst].toWritten - 69) / 12);

/* ---------- Settings, remembered per instrument ---------- */

function save() {
  try {
    localStorage.setItem("brass-inst", state.inst);
    localStorage.setItem("right-note-" + state.inst, JSON.stringify({
      chosen: state.chosen, order: state.order, names: state.names, arrow: state.arrow,
      hold: state.hold, tol: state.tol, ref: state.ref
    }));
  } catch (_) {}
}

function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("right-note-" + state.inst) || "null"); } catch (_) {}
  const I = INSTRUMENTS[state.inst];
  state.chosen = saved && Array.isArray(saved.chosen) && saved.chosen.length ? saved.chosen.filter(n => I.notes.includes(n)) : I.def.slice();
  if (!state.chosen.length) state.chosen = I.def.slice();
  if (saved) {
    state.order = saved.order || state.order;
    state.names = saved.names !== false;
    state.arrow = saved.arrow !== false;
    state.hold = HOLDS.includes(saved.hold) ? saved.hold : state.hold;
    state.tol = TOL[saved.tol] ? saved.tol : state.tol;
    state.ref = saved.ref !== false;
  }
  state.target = state.chosen[0];
}

/* ---------- Audio ---------- */

let ctx = null, analyser = null, micStream = null, raw = null, deci = null;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.onstatechange = () => { if (state.listening && micStream) $("micText").textContent = ctx.state === "running" ? T("listening") : T("tapScreen"); };
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

async function startMic() {
  ensureCtx();
  if (new URLSearchParams(location.search).get("test")) return startTestTone();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail(T("onlyOnline"));
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: MIC_OPTIONS });
  } catch (err) {
    const n = err && err.name;
    return fail(n === "NotAllowedError" ? T("micDenied")
      : n === "NotFoundError" ? T("micNotFound")
      : n === "NotReadableError" ? T("micBusy")
      : T("micFailed"));
  }
  // iPad switches the hardware to the microphone's rate; an audio engine made before that can stay deaf.
  const track = micStream.getAudioTracks()[0];
  const micRate = track && track.getSettings ? track.getSettings().sampleRate : 0;
  if (micRate && ctx.sampleRate !== micRate) { ctx.close(); ctx = null; ensureCtx(); }
  ctx.resume();
  const src = ctx.createMediaStreamSource(micStream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 8192;
  analyser.smoothingTimeConstant = 0;
  src.connect(analyser);
  // iPad (WebKit) feeds an analyser only if it leads to the speakers: a silent gain does that, with no sound.
  const pull = ctx.createGain();
  pull.gain.value = 0;
  analyser.connect(pull);
  pull.connect(ctx.destination);
  raw = new Float32Array(analyser.fftSize);
  state.listening = true;
  $("overlay").hidden = true;
  $("micDot").classList.add("on");
  $("micText").textContent = T("listening");
  micStream.getAudioTracks().forEach(t => {
    t.addEventListener("ended", () => fail(T("micGone")));
    t.addEventListener("mute", () => { $("micText").textContent = T("muted"); });
    t.addEventListener("unmute", () => { $("micText").textContent = T("listening"); });
  });
  if (state.ref) setTimeout(playReference, 400);
}

function startTestTone() {
  const q = new URLSearchParams(location.search);
  const hz = concertHz(state.target) * Math.pow(2, (+(q.get("cents") || 0)) / 1200);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 8192;
  analyser.smoothingTimeConstant = 0;
  const g = ctx.createGain();
  g.gain.value = 0.25;
  const o = ctx.createOscillator();
  o.type = "sine"; o.frequency.value = hz; o.connect(g); o.start();
  g.connect(analyser);
  raw = new Float32Array(analyser.fftSize);
  state.listening = true;
  state.noiseFloor = 0.00001;
  $("overlay").hidden = true;
  $("micDot").classList.add("on");
  $("micText").textContent = T("test");
}

function fail(message) {
  state.listening = false;
  $("overlay").hidden = false;
  $("overlayText").textContent = message;
  $("startBtn").textContent = T("tryAgain");
  $("micDot").classList.remove("on");
  $("micText").textContent = T("noMic");
}

function stopMic() { if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; state.listening = false; }
addEventListener("pagehide", stopMic);
document.addEventListener("visibilitychange", () => { if (document.hidden) stopMic(); });

function playReference() {
  const c = ensureCtx(), t = c.currentTime + 0.05, hz = concertHz(state.target);
  const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = "sawtooth"; o.frequency.value = hz;
  f.type = "lowpass"; f.frequency.value = Math.min(5000, hz * 6); f.Q.value = 1;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
  g.gain.setValueAtTime(0.16, t + 1.0);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
  o.connect(f); f.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + 1.4);
  state.muteUntil = performance.now() + 1800;     // never hear our own loudspeaker as the child
}

// A short rising sparkle for a success.
function playSuccess() {
  const c = ensureCtx(), base = concertHz(state.target);
  [1, 1.25, 1.5, 2].forEach((mult, i) => {
    const t = c.currentTime + 0.05 + i * 0.09;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "triangle";
    o.frequency.value = base * mult * 2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.5);
  });
  state.muteUntil = performance.now() + 900;
}

/* ---------- Detection ---------- */

function analyse() {
  if (!state.listening || !analyser) return;
  analyser.getFloatTimeDomainData(raw);
  let sum = 0;
  for (let i = 0; i < raw.length; i++) sum += raw[i] * raw[i];
  state.rms = Math.sqrt(sum / raw.length);
  // A real microphone in a room is never exactly silent: say so instead of waiting forever.
  if (state.rms === 0 && micStream) {
    if (!state.zeroSince) state.zeroSince = performance.now();
    else if (performance.now() - state.zeroSince > 3000) $("micText").textContent = T("noMicSound");
  } else if (state.zeroSince) { state.zeroSince = 0; $("micText").textContent = T("listening"); }
  state.noiseFloor = state.rms < state.noiseFloor ? state.rms * 0.2 + state.noiseFloor * 0.8 : state.noiseFloor * 0.999 + state.rms * 0.001;
  const gate = Math.max(state.noiseFloor * Math.pow(10, 12 / 20), 0.0015);
  const sounding = state.rms > gate && performance.now() > state.muteUntil;
  if (sounding && !state.soundOn) { state.soundOn = true; state.soundSince = performance.now(); }
  else if (!sounding) state.soundOn = false;
  if (!sounding || performance.now() - state.soundSince < 250) { state.clarity = 0; return; }

  const sr = ctx.sampleRate, D = Math.max(1, Math.round(sr / 8000)), n = Math.floor(raw.length / D), sr2 = sr / D;
  if (!deci || deci.length !== n) deci = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < D; j++) s += raw[i * D + j]; deci[i] = s / D; }

  const I = INSTRUMENTS[state.inst];
  const got = detect(deci, sr2, I.lo, I.hi);
  if (!got) { state.clarity = 0; return; }
  state.freq = got.freq;
  state.clarity = got.clarity;
  state.cents = 1200 * Math.log2(got.freq / concertHz(state.target));
}

function detect(buf, sampleRate, fMin, fMax) {
  const n = buf.length;
  const minLag = Math.max(2, Math.floor(sampleRate / fMax));
  const maxLag = Math.min(Math.floor(sampleRate / fMin), n - 2);
  if (maxLag <= minLag) return null;
  const nsdf = new Float32Array(maxLag + 2);
  let peak = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let ac = 0, m = 0;
    for (let i = 0, end = n - lag; i < end; i++) { const a = buf[i], b = buf[i + lag]; ac += a * b; m += a * a + b * b; }
    const v = m > 0 ? (2 * ac) / m : 0;
    nsdf[lag] = v;
    if (v > peak) peak = v;
  }
  if (peak < 0.4) return null;
  const threshold = peak * 0.9;
  for (let lag = minLag + 1; lag < maxLag; lag++) {
    if (nsdf[lag] > threshold && nsdf[lag] >= nsdf[lag - 1] && nsdf[lag] >= nsdf[lag + 1]) {
      const y1 = nsdf[lag - 1], y2 = nsdf[lag], y3 = nsdf[lag + 1];
      const denom = 2 * (2 * y2 - y1 - y3);
      return { freq: sampleRate / (lag + (Math.abs(denom) > 1e-9 ? (y3 - y1) / denom : 0)), clarity: y2 };
    }
  }
  return null;
}

/* ---------- Staff ---------- */

const el = (tag, attrs, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

const S = 46, STAFF_X0 = 150, STAFF_X1 = 950, STAFF_TOP = 180;
const PLAYED_X = 400, TARGET_X = 690;
const staffY = diatonic => {
  const bottom = INSTRUMENTS[state.inst].clef === "treble" ? 30 : 18;
  return STAFF_TOP + 4 * S - (diatonic - bottom) * S / 2;
};

let g = {};

function buildStaff() {
  const svg = $("scene");
  svg.textContent = "";
  g = {};
  const I = INSTRUMENTS[state.inst];
  for (let i = 0; i < 5; i++)
    el("line", { x1: STAFF_X0, x2: STAFF_X1, y1: STAFF_TOP + i * S, y2: STAFF_TOP + i * S, stroke: "#15181d", "stroke-width": Math.max(2, S * 0.1) }, svg);
  const treble = I.clef === "treble";
  el("text", { x: STAFF_X0 + 20, y: treble ? STAFF_TOP + 3 * S : STAFF_TOP + S, "font-size": 4 * S, fill: "#15181d", style: MUSIC_FONT }, svg)
    .textContent = treble ? GLYPH.gClef : GLYPH.fClef;

  g.targetLedger = el("g", {}, svg);
  g.targetAcc = el("text", { "font-size": 4 * S, fill: "#15181d", style: MUSIC_FONT }, svg);
  g.ring = el("circle", { r: 1.9 * S, fill: "none", stroke: "#1b8f58", "stroke-width": 12, "stroke-linecap": "round",
    "stroke-dasharray": 2 * Math.PI * 1.9 * S, "stroke-dashoffset": 2 * Math.PI * 1.9 * S, opacity: 0 }, svg);
  g.target = el("text", { x: TARGET_X, "font-size": 4 * S, fill: "#15181d", style: MUSIC_FONT }, svg);
  g.target.textContent = GLYPH.headOpen;

  g.playedWrap = el("g", { opacity: 0 }, svg);
  g.playedLedger = el("g", {}, g.playedWrap);
  g.playedAcc = el("text", { "font-size": 4 * S, fill: "#1a7fe2", style: MUSIC_FONT }, g.playedWrap);
  g.played = el("text", { x: PLAYED_X, "font-size": 4 * S, fill: "#1a7fe2", style: MUSIC_FONT }, g.playedWrap);
  g.played.textContent = GLYPH.head;
  g.playedName = el("text", { "text-anchor": "middle", "font-size": 48, "font-weight": 800, fill: "#1a7fe2", style: "font-family: var(--display)", direction: LANG === "he" ? "rtl" : "ltr" }, g.playedWrap);
  g.arrow = el("path", { fill: "#1a7fe2", opacity: 0 }, svg);
  g.star = el("text", { x: TARGET_X + 26, y: STAFF_TOP - 56, "text-anchor": "middle", "font-size": 96, opacity: 0 }, svg);
  g.star.textContent = "⭐";
  placeTarget();
}

function ledgers(group, x, diatonic) {
  group.textContent = "";
  const bottom = INSTRUMENTS[state.inst].clef === "treble" ? 30 : 18;
  const pos = diatonic - bottom;
  const line = q => el("line", { x1: x - 18, x2: x + 1.9 * S + 18, y1: staffY(bottom + q), y2: staffY(bottom + q), stroke: "#15181d", "stroke-width": Math.max(2, S * 0.12) }, group);
  for (let q = -2; q >= pos; q -= 2) line(q);
  for (let q = 10; q <= pos; q += 2) line(q);
}

function placeTarget() {
  const sp = spell(state.target), y = staffY(diatonicOf(sp));
  g.target.setAttribute("y", y);
  g.targetAcc.setAttribute("x", TARGET_X - 1.4 * S);
  g.targetAcc.setAttribute("y", y);
  g.targetAcc.textContent = sp.alter === -1 ? GLYPH.flat : sp.alter === 1 ? GLYPH.sharp : "";
  g.ring.setAttribute("cx", TARGET_X + 26);
  g.ring.setAttribute("cy", y);
  g.ring.setAttribute("transform", `rotate(-90 ${TARGET_X + 26} ${y})`);
  ledgers(g.targetLedger, TARGET_X, diatonicOf(sp));
  $("headline").textContent = state.names ? nameOf(state.target) : "";
  $("stars").textContent = "⭐".repeat(Math.min(state.stars, 12));
}

/* ---------- Loop ---------- */

let last = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - (last || now)) / 1000);
  last = now;
  if (now - state.lastAnalyse > 50) { state.lastAnalyse = now; analyse(); }
  draw(dt);
  if (!$("diag").hidden) {
    const db = 20 * Math.log10(Math.max(state.rms, 1e-7));
    const bars = Math.max(0, Math.min(10, Math.round((db + 60) / 4.5)));
    $("diag").textContent = audioLine() + `${T("diagTitle")}\n${T("diagVolume")}  ${"█".repeat(bars)}${"·".repeat(10 - bars)}\n${T("diagPitch")}   ${state.freq ? state.freq.toFixed(0) + " Hz" : "—"}\n${T("diagCents")}   ${state.cents === null ? "—" : (state.cents > 0 ? "+" : "") + state.cents.toFixed(0)}\nv8`;
  }
  requestAnimationFrame(frame);
}

function draw(dt) {
  const I = INSTRUMENTS[state.inst];
  const heard = state.freq > 0 && state.clarity > 0.6 && state.soundOn && performance.now() > state.muteUntil;
  const tY = staffY(diatonicOf(spell(state.target)));

  if (heard) {
    const written = 69 + 12 * Math.log2(state.freq / 440) + I.toWritten;
    const sp = spell(written);
    const offset = written - Math.round(written);
    const y = staffY(diatonicOf(sp)) - offset * S * 0.45;
    g.playedWrap.setAttribute("opacity", 1);
    g.played.setAttribute("y", y.toFixed(1));
    g.playedAcc.setAttribute("x", PLAYED_X - 1.4 * S);
    g.playedAcc.setAttribute("y", staffY(diatonicOf(sp)).toFixed(1));
    g.playedAcc.textContent = sp.alter === -1 ? GLYPH.flat : sp.alter === 1 ? GLYPH.sharp : "";
    g.playedName.setAttribute("x", PLAYED_X + 0.95 * S);
    g.playedName.setAttribute("y", STAFF_TOP + 4 * S + 2.4 * S);
    g.playedName.textContent = state.names ? nameOf(Math.round(written)) : "";
    ledgers(g.playedLedger, PLAYED_X, diatonicOf(sp));

    const far = Math.abs(y - tY) > S * 0.5;
    g.arrow.setAttribute("opacity", state.arrow && far ? 1 : 0);
    if (far && state.arrow) {
      const up = y > tY, ax = 560, ay = (y + tY) / 2;
      g.arrow.setAttribute("d", up
        ? `M ${ax} ${ay - 60} L ${ax + 42} ${ay + 20} L ${ax + 14} ${ay + 20} L ${ax + 14} ${ay + 70} L ${ax - 14} ${ay + 70} L ${ax - 14} ${ay + 20} L ${ax - 42} ${ay + 20} Z`
        : `M ${ax} ${ay + 60} L ${ax + 42} ${ay - 20} L ${ax + 14} ${ay - 20} L ${ax + 14} ${ay - 70} L ${ax - 14} ${ay - 70} L ${ax - 14} ${ay - 20} L ${ax - 42} ${ay - 20} Z`);
    }
  } else {
    g.playedWrap.setAttribute("opacity", 0);
    g.arrow.setAttribute("opacity", 0);
  }

  const limit = state.inBand ? TOL[state.tol] + 15 : TOL[state.tol];
  const wasIn = state.inBand;
  state.inBand = heard && state.cents !== null && Math.abs(state.cents) < limit;
  // Measured against the clock, not the frame rate, so a busy laptop cannot stretch the hold.
  const now = performance.now();
  if (state.inBand) {
    if (!wasIn) state.inBandSince = now - state.holdProgress * state.hold * 1000;
    state.holdProgress = Math.min(1, (now - state.inBandSince) / (state.hold * 1000));
  } else {
    if (wasIn) { state.drainFrom = state.holdProgress; state.drainSince = now; }
    state.holdProgress = Math.max(0, state.drainFrom - (now - state.drainSince) / (state.hold * 2000));
  }
  const circ = 2 * Math.PI * 1.9 * S;
  g.ring.setAttribute("opacity", state.holdProgress > 0.02 ? 1 : 0);
  g.ring.setAttribute("stroke-dashoffset", circ * (1 - state.holdProgress));
  g.target.setAttribute("fill", state.inBand ? "#1b8f58" : "#15181d");

  if (state.holdProgress >= 1) succeed(tY);
}

function succeed(y) {
  state.holdProgress = 0;
  state.inBand = false;
  state.stars++;
  playSuccess();
  burst(TARGET_X + 26, y);
  g.star.setAttribute("opacity", 1);
  setTimeout(() => g.star.setAttribute("opacity", 0), 1600);
  setTimeout(nextNote, 1500);
}

function nextNote(manual) {
  const list = state.chosen;
  if (!list.length) return;
  if (list.length === 1) state.target = list[0];
  else if (state.order === "random") {
    let n = state.target;
    while (n === state.target) n = list[Math.floor(Math.random() * list.length)];
    state.target = n;
  } else {
    state.target = list[(list.indexOf(state.target) + 1 + list.length) % list.length];
  }
  state.holdProgress = 0;
  placeTarget();
  if (state.ref && !manual) setTimeout(playReference, 250);
}

function burst(x, y) {
  const svg = $("scene");
  const colours = ["#f2b705", "#ff6f59", "#1a7fe2", "#2fa36b", "#7a5cf0"];
  for (let i = 0; i < 16; i++) {
    const a = (Math.PI * 2 * i) / 16, d = 90 + Math.random() * 80;
    const c = el("circle", { cx: x, cy: y, r: 9 + Math.random() * 8, fill: colours[i % colours.length] }, svg);
    const t0 = performance.now();
    (function fly(now) {
      const p = (now - t0) / 900;
      if (p >= 1) { c.remove(); return; }
      c.setAttribute("cx", x + Math.cos(a) * d * p);
      c.setAttribute("cy", y + Math.sin(a) * d * p + 60 * p * p);
      c.setAttribute("opacity", 1 - p);
      requestAnimationFrame(fly);
    })(t0);
  }
}

/* ---------- Settings panel ---------- */

function buildSheet() {
  const I = INSTRUMENTS[state.inst];
  const box = $("noteChips");
  box.textContent = "";
  I.notes.forEach(n => {
    const b = document.createElement("button");
    b.className = "note-chip";
    b.setAttribute("aria-pressed", String(state.chosen.includes(n)));
    b.innerHTML = nameOf(n) + (I.open.includes(n) ? "<small>" + T("open") + "</small>" : "");
    b.addEventListener("click", () => {
      const i = state.chosen.indexOf(n);
      if (i >= 0) { if (state.chosen.length > 1) state.chosen.splice(i, 1); }
      else state.chosen.push(n);
      state.chosen.sort((a, b2) => a - b2);
      b.setAttribute("aria-pressed", String(state.chosen.includes(n)));
      if (!state.chosen.includes(state.target)) { state.target = state.chosen[0]; placeTarget(); }
      save();
    });
    box.appendChild(b);
  });

  const holdSeg = $("holdSeg");
  holdSeg.textContent = "";
  HOLDS.forEach(h => {
    const b = document.createElement("button");
    b.className = "seg-btn";
    b.textContent = h;
    b.setAttribute("aria-pressed", String(state.hold === h));
    b.addEventListener("click", () => { state.hold = h; save(); buildSheet(); });
    holdSeg.appendChild(b);
  });
  pressed();
}

function pressed() {
  $("namesOn").setAttribute("aria-pressed", String(state.names));
  $("namesOff").setAttribute("aria-pressed", String(!state.names));
  $("arrowOn").setAttribute("aria-pressed", String(state.arrow));
  $("arrowOff").setAttribute("aria-pressed", String(!state.arrow));
  $("tolWide").setAttribute("aria-pressed", String(state.tol === "wide"));
  $("tolNormal").setAttribute("aria-pressed", String(state.tol === "normal"));
  $("tolTight").setAttribute("aria-pressed", String(state.tol === "tight"));
  $("ordRandom").setAttribute("aria-pressed", String(state.order === "random"));
  $("ordSeq").setAttribute("aria-pressed", String(state.order === "sequence"));
  $("refOn").setAttribute("aria-pressed", String(state.ref));
  $("refOff").setAttribute("aria-pressed", String(!state.ref));
}

function toggleSheet(show) {
  const open = show === undefined ? $("sheet").hidden : show;
  $("sheet").hidden = !open;
  if (open) buildSheet(); else placeTarget();
}

function toggleFullscreen() {
  const d = document, root = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (p && p.catch) p.catch(() => {}); }
  } catch (_) {}
}

/* ---------- Wiring ---------- */

$("startBtn").addEventListener("click", startMic);
$("overlay").addEventListener("click", e => { if (e.target === $("overlay") || e.target.tagName === "P" || e.target.tagName === "DIV") startMic(); });  // the whole start screen is the button
$("tone").addEventListener("click", playReference);
$("settings").addEventListener("click", () => toggleSheet());
$("sheetDone").addEventListener("click", () => toggleSheet(false));
$("fullscreen").addEventListener("click", toggleFullscreen);
$("namesOn").addEventListener("click", () => { state.names = true; save(); pressed(); placeTarget(); });
$("namesOff").addEventListener("click", () => { state.names = false; save(); pressed(); placeTarget(); });
$("arrowOn").addEventListener("click", () => { state.arrow = true; save(); pressed(); });
$("arrowOff").addEventListener("click", () => { state.arrow = false; save(); pressed(); });
$("tolWide").addEventListener("click", () => { state.tol = "wide"; save(); pressed(); });
$("tolNormal").addEventListener("click", () => { state.tol = "normal"; save(); pressed(); });
$("tolTight").addEventListener("click", () => { state.tol = "tight"; save(); pressed(); });
$("ordRandom").addEventListener("click", () => { state.order = "random"; save(); pressed(); });
$("ordSeq").addEventListener("click", () => { state.order = "sequence"; save(); pressed(); });
$("refOn").addEventListener("click", () => { state.ref = true; save(); pressed(); });
$("refOff").addEventListener("click", () => { state.ref = false; save(); pressed(); });
document.addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); });

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t.tagName === "BUTTON" || t.tagName === "SELECT" || t.tagName === "INPUT") return;
  const c = e.code;
  if (paused) { if (c === "Escape" || c === "Space" || c === "Enter") { e.preventDefault(); setPaused(false); } return; }
  if (c === "Space" || c === "Enter" || c === "PageDown" || c === "ArrowRight") { e.preventDefault(); nextNote(true); }
  else if (c === "KeyT") playReference();
  else if (c === "KeyS") toggleSheet();
  else if (c === "KeyR") state.noiseFloor = 0.002;
  else if (c === "KeyD") $("diag").hidden = !$("diag").hidden;
  else if (c === "KeyF") toggleFullscreen();
  else if (c === "Escape") { if (!$("sheet").hidden) toggleSheet(false); else setPaused(true); }
});

const params = new URLSearchParams(location.search);
let savedInst = null;
try { savedInst = localStorage.getItem("brass-inst"); } catch (_) {}
if (INSTRUMENTS[params.get("inst")]) state.inst = params.get("inst");
else if (INSTRUMENTS[savedInst]) state.inst = savedInst;
load();
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) || matchMedia("(display-mode: standalone)").matches) $("fullscreen").hidden = true;
if (location.protocol === "file:") fail(T("onlyOnline"));
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

buildStaff();
buildSheet();
requestAnimationFrame(frame);
document.getElementById("pauseBtn").addEventListener("click", () => setPaused(true));
document.getElementById("pauseBox").addEventListener("click", e => { if (e.target.id !== "pauseStop") setPaused(false); });
</script>
</body>
