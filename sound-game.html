<!doctype html>
<html lang="he" dir="rtl">
<head>

<style>
  :root {
    --ink: #15181d;
    --muted: #56616f;
    --line: rgba(21, 24, 29, .14);
    --panel: rgba(255, 255, 255, .92);
    --go: #1b8f58;
    --accent: #1a7fe2;
    --display: "Rubik", "Lexend", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
    font-synthesis: none;
  }
  /* Each level flies further from home: day, deeper blue, dusk, night. The layers cross-fade. */
  .sky { position: fixed; inset: 0; opacity: 0; transition: opacity .8s; }
  #sky2 { background: linear-gradient(180deg, #7fb8ee 0%, #b9dbf8 55%, #e6f1fc 100%); }
  #sky3 { background: linear-gradient(180deg, #5b5aa8 0%, #9b87c9 55%, #f3c6a6 100%); }
  #sky4 { background: linear-gradient(180deg, #0c1638 0%, #1d2b5e 55%, #3b3f7a 100%); }
  /* Deep space, for the longest notes: a purple nebula, an aurora, then a magenta galaxy. */
  #sky5 { background: linear-gradient(180deg, #1c0b3a 0%, #3d1766 55%, #6a2b80 100%); }
  #sky6 { background: linear-gradient(180deg, #04202b 0%, #0b4a52 55%, #1d7a5e 100%); }
  #sky7 { background: linear-gradient(180deg, #23051f 0%, #57104a 55%, #8f2a5e 100%); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--display); color: var(--ink); background: linear-gradient(180deg, #bfe4ff 0%, #e8f4ff 55%, #fff4e3 100%) fixed; overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--accent); border-radius: 12px; }

  .app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

  .console { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px clamp(12px, 3vw, 28px); background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .console a { color: var(--muted); text-decoration: none; }
  .spacer { margin-inline-start: auto; }
  .seg { display: inline-flex; background: #eef2f7; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg-btn { border: 0; background: transparent; min-height: 44px; padding: 0 16px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .seg-btn[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(21, 24, 29, .18); }
  .icon-btn { background: #fff; border: 1px solid var(--line); border-radius: 10px; min-height: 44px; min-width: 44px; padding: 0 12px; cursor: pointer; }
  .mic-dot { width: 12px; height: 12px; border-radius: 50%; background: #c3ccd8; display: inline-block; vertical-align: -1px; }
  .mic-dot.on { background: var(--go); }

  .stage { position: relative; min-height: 0; overflow: hidden; padding: 1vh clamp(8px, 2vw, 24px) 0; }
  .scene { width: 100%; height: 100%; display: block; direction: ltr; overflow: visible; }

  /* Start / error overlay */
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .82); text-align: center; padding: 4vh 6vw; }
  .overlay[hidden] { display: none; }
  .overlay p { margin: 0 0 2vh; font-size: clamp(18px, 3.2vh, 30px); font-weight: 500; max-width: 24ch; line-height: 1.5; }
  .big-btn { background: var(--accent); color: #fff; border: 0; border-radius: 999px; font-weight: 700; font-size: clamp(22px, 4vh, 40px); padding: .6em 1.6em; cursor: pointer; min-height: 56px; }
  .big-btn:hover { background: #0f63b8; }

  .diag { position: absolute; inset-inline-end: 10px; bottom: 10px; direction: rtl; text-align: right; background: rgba(13, 17, 23, .82); color: #d7e4f5; font-size: 13px; line-height: 1.6; padding: 8px 12px; border-radius: 10px; font-variant-numeric: tabular-nums; white-space: pre; }
  .diag[hidden] { display: none; }

  .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 8px clamp(12px, 3vw, 28px) 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .turns { display: inline-flex; gap: 8px; }
  .turn { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--accent); opacity: .45; }
  .turn.on { background: var(--accent); opacity: 1; }
  .count { font-weight: 800; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
  kbd { font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  /* Pause: everything freezes behind one big symbol. */
  .pause { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .78); cursor: pointer; z-index: 5; }
  .pause[hidden] { display: none; }
  .pause-box { text-align: center; }
  .pause-icon { font-size: clamp(80px, 22vh, 220px); line-height: 1; color: #1a7fe2; }
  .resume-btn { margin-top: 2vh; background: #1a7fe2; color: #fff; border: 0; border-radius: 999px; font: inherit; font-weight: 700; font-size: clamp(22px, 4vh, 40px); padding: .5em 1.4em; cursor: pointer; min-height: 56px; }
</style>

<body>
<div class="sky" id="sky2"></div><div class="sky" id="sky3"></div><div class="sky" id="sky4"></div><div class="sky" id="sky5"></div><div class="sky" id="sky6"></div><div class="sky" id="sky7"></div>
<div class="app">
  <header class="console">
    <a href="index.html">‹ Brass App</a>
    <div class="seg" role="group" aria-label="שלב">
      <button id="lv1" class="seg-btn" aria-pressed="true" title="4 שניות · מעל העננים">☀️ 4</button>
      <button id="lv2" class="seg-btn" aria-pressed="false" title="8 שניות · לוויין">🛰️ 8</button>
      <button id="lv3" class="seg-btn" aria-pressed="false" title="12 שניות · ירח">🌙 12</button>
      <button id="lv4" class="seg-btn" aria-pressed="false" title="16 שניות · שבתאי">🪐 16</button>
      <button id="lv5" class="seg-btn" aria-pressed="false" title="כמה שאפשר">∞</button>
    </div>
    <span class="spacer"></span>
    <span><span class="mic-dot" id="micDot"></span> <span id="micText">מיקרופון</span></span>
    <button id="pauseBtn" class="icon-btn" title="השהיה (Esc)">⏸</button>
    <button id="fullscreen" class="icon-btn" title="מסך מלא (F)">⛶</button>
  </header>

  <main class="stage" id="stage">
    <svg class="scene" id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="חללית שטסה עם צליל ארוך"></svg>
    <div class="overlay" id="overlay">
      <div>
        <p id="overlayText">נלחץ ונתחיל להקשיב</p>
        <button class="big-btn" id="startBtn">התחלה</button>
      </div>
    </div>
    <div class="pause" id="pauseBox" hidden><div class="pause-box"><div class="pause-icon">⏸</div><button class="resume-btn" id="resumeBtn">▶ ממשיכים</button></div></div>
    <div class="diag" id="diag" hidden></div>
  </main>

  <footer class="transport">
    <span class="turns" id="turns" aria-label="תורות"></span>
    <span class="count" id="counter">0</span>
    <span class="spacer"></span>
    <span><kbd>Space</kbd> תור הבא · <kbd>Esc</kbd> השהיה · <kbd>1</kbd>–<kbd>5</kbd> שלב · <kbd>R</kbd> כיול · <kbd>D</kbd> מידע</span>
  </footer>
</div>
<script>
"use strict";

/* ---------- iPad audio ----------
   Older iPads (Safari before 14.1) have no float sample reader: build it from the byte one.
   A suspended or interrupted iPad audio engine (lock screen, a call) wakes on any tap.
   Tapping the microphone status opens the microphone check (no keyboard needed). */
if (window.AnalyserNode && !AnalyserNode.prototype.getFloatTimeDomainData) {
  AnalyserNode.prototype.getFloatTimeDomainData = function (out) {
    const bytes = new Uint8Array(out.length);
    this.getByteTimeDomainData(bytes);
    for (let i = 0; i < out.length; i++) out[i] = (bytes[i] - 128) / 128;
  };
}
["touchend", "click"].forEach(type => document.addEventListener(type, () => {
  if (ctx && ctx.state !== "running" && ctx.state !== "closed") ctx.resume();
}, true));
document.getElementById("micText").parentElement.addEventListener("click", () => {
  const d = document.getElementById("diag");
  d.hidden = !d.hidden;
});
// iPad/iPhone: the raw microphone is too quiet for a horn at a normal distance (measured in class), so use
// the device's own voice processing and automatic volume. Elsewhere raw is louder than enough and purer.
// ?voice=1 / ?voice=0 forces either way. (iPadOS Safari calls itself a Mac; the touch points give it away.)
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const VOICE_PARAM = new URLSearchParams(location.search).get("voice");
const MIC_OPTIONS = (VOICE_PARAM === null ? IS_IOS : VOICE_PARAM !== "0") ? true
  : { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
// The check panel's first lines: is the engine moving, what the iPad says about the mic, the raw level in dB.
let lastEngineTime = -1, engineMovedAt = 0;
const audioLine = () => {
  if (!ctx) return "אודיו   —\n";
  if (ctx.currentTime !== lastEngineTime) { lastEngineTime = ctx.currentTime; engineMovedAt = performance.now(); }
  const moving = performance.now() - engineMovedAt < 500;     // the clock advances in bursts, not every frame
  const tr = micStream && micStream.getAudioTracks()[0];
  const st = tr && tr.getSettings ? tr.getSettings() : {};
  const db = state.rms > 0 ? (20 * Math.log10(state.rms)).toFixed(0) + " dB" : "0";
  return `אודיו   ${ctx.state} · ${ctx.sampleRate} · ${moving ? "זז" : "עומד"}\n` +
    `מיקרופון ${tr ? tr.readyState + (tr.muted ? " muted" : "") + (tr.enabled ? "" : " off") : "—"} · ${st.sampleRate || "?"} · ${MIC_OPTIONS === true ? "voice" : "raw"} ec:${st.echoCancellation} agc:${st.autoGainControl}\n` +
    `רמה    ${db}\n`;
};


/* ---------- Long note ----------
   One long note flies a rocket up from the ground into space. The sky slowly turns from day to night and
   it passes landmarks on the way: birds, a plane, clouds, a satellite, an astronaut, the Moon, Saturn...
   Each level is how far the flight goes (4, 8, 12 or 16 seconds; the last level is as far as you can).
   No pitch: any steady tone counts, so this works for every instrument. Each second lights a star.
   When the note stops, the rocket waits a moment and floats back on a parachute: nothing falls, breaks
   or turns red. Arriving celebrates once and waits there until the room is quiet. */

const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";

// Places with a face, passed every 4 seconds; a level ends at one of them.
const CHECKS = [{ t: 4, kind: "sun" }, { t: 8, kind: "satellite" }, { t: 12, kind: "moon" }, { t: 16, kind: "saturn" },
  { t: 20, kind: "mars" }, { t: 24, kind: "star" }];
// Further out every place is new, and past a minute they keep coming in new colours.
const DEEP = ["jupiter", "neptune", "galaxy", "rainbow", "blackhole", "ringed", "twins", "nebula", "crown"];
for (let t = 28, i = 0; t <= 240; t += 4, i++) CHECKS.push({ t, kind: DEEP[i % DEEP.length], variant: Math.floor(i / DEEP.length) });
const LEVELS = [4, 8, 12, 16, Infinity];   // seconds to the level's end; the last level never ends
// Things on the way, by the second they are passed at, and which side of the rocket.
const SIGHTS = [
  [1, "bird", 270], [1.7, "bird", 760], [2.6, "plane", 250], [3.5, "cloud", 160], [3.9, "cloud", 860],
  [4.4, "cloud", 330], [4.7, "cloud", 650], [6, "plane-far", 230], [6.8, "cloud-high", 800], [9.6, "astronaut", 240],
  [10.8, "meteor", 760], [14, "asteroid", 250], [18, "comet", 250], [22, "ufo", 250]
];
const FAR_SIGHTS = ["station", "whale", "friend", "shower", "astronaut", "ufo", "comet", "asteroid"];
for (let t = 26, i = 0; t <= 240; t += 4, i++) SIGHTS.push([t, FAR_SIGHTS[i % FAR_SIGHTS.length], 250]);

const RX = 500, PAD_Y = 505, NOSE = 136;    // the rocket's x, its base at home, base to nose (scaled)
const SPEED = 90, CRUISE_Y = 380;           // px per second of note; where the rocket stays once flying
const LAMP_X = 70, LAMP_TOP = 130, LAMP_BOTTOM = 480;   // one star per second, bottom to top
const F_LO = 80, F_HI = 1000;   // any wind or brass beginner's note, in concert Hz
const GATE_DB = 12;             // a note starts this many decibels above the room's noise floor...
const HOLD_DB = 6;              // ...and keeps going down to here (iPad voice mode fades a long note)
const ONSET_MS = 250;           // a steady tone this long counts as a sound: talk, claps and breath do not
const ONSET_SPREAD = 150;       // cents the pitch may wander during that onset
const GAP_MS = 300;             // a dropout shorter than this is still the same note
const PAUSE_S = 0.3;            // after the note stops, wait this long before floating back
const WON_MIN_S = 3;            // the celebration lasts at least this long, then waits for silence
const ANALYSE_MS = 50;

const state = {
  level: 1, turns: 6, turn: 0, counter: 0,
  a: 0, phase: "idle", phaseT: 0, quietT: 0,      // seconds flown; idle / play / rest / won / home
  flightBest: 0, turnBest: 0,                     // the furthest place passed, this flight and this turn
  bestSeconds: 0,                                 // endless: this turn's longest note
  listening: false, rms: 0, smoothRms: 0, freq: 0, clarity: 0,
  noiseFloor: 0.002, soundOn: false, lastHeard: 0, onsetSince: 0, onsetPitches: [],
  muteUntil: 0, lastAnalyse: 0
};

/* ---------- Audio ---------- */

let ctx = null, analyser = null, micStream = null, raw = null, deci = null;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.onstatechange = () => { if (state.listening && micStream) $("micText").textContent = ctx.state === "running" ? "מקשיב" : "לגעת במסך"; };
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}

async function startMic() {
  ensureCtx();                                  // created inside the click, before any await
  if (new URLSearchParams(location.search).get("test")) return startTestTone();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return fail("המשחק עם המיקרופון עובד רק דרך הקישור באינטרנט");
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: MIC_OPTIONS });
  } catch (err) {
    const msg = err && err.name === "NotAllowedError" ? "אין אישור למיקרופון"
      : err && err.name === "NotFoundError" ? "לא נמצא מיקרופון"
      : err && err.name === "NotReadableError" ? "המיקרופון תפוס בתוכנה אחרת"
      : "לא הצלחנו לפתוח את המיקרופון";
    return fail(msg);
  }
  // iPad switches the hardware to the microphone's rate; an audio engine made before that can stay deaf.
  const track = micStream.getAudioTracks()[0];
  const micRate = track && track.getSettings ? track.getSettings().sampleRate : 0;
  if (micRate && ctx.sampleRate !== micRate) { ctx.close(); ctx = null; ensureCtx(); }
  ctx.resume();
  const src = ctx.createMediaStreamSource(micStream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 8192;
  analyser.smoothingTimeConstant = 0;
  src.connect(analyser);
  // iPad (WebKit) feeds an analyser only if it leads to the speakers: a silent gain does that, with no sound.
  const pull = ctx.createGain();
  pull.gain.value = 0;
  analyser.connect(pull);
  pull.connect(ctx.destination);
  raw = new Float32Array(analyser.fftSize);
  state.listening = true;
  state.noiseFloor = 0.002;
  $("overlay").hidden = true;
  $("micDot").classList.add("on");
  $("micText").textContent = "מקשיב";
  micStream.getAudioTracks().forEach(t => {
    t.addEventListener("ended", () => fail("המיקרופון נותק"));
    t.addEventListener("mute", () => { $("micText").textContent = "מושתק"; });
    t.addEventListener("unmute", () => { $("micText").textContent = "מקשיב"; });
  });
}

// Test hook: a tone straight into the analyser, so the game can be checked without a microphone.
// ?test=1 starts silent. Console: testSound(0.25) plays, testSound(0.02) quietly, testSound(0) stops;
// testNoise(0.1) adds hiss (must not count as a note).
function startTestTone() {
  analyser = ctx.createAnalyser();
  analyser.fftSize = 8192;
  analyser.smoothingTimeConstant = 0;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = 349.23;
  g.gain.value = 0;
  o.connect(g); g.connect(analyser); o.start();
  const hiss = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), hd = hiss.getChannelData(0);
  for (let i = 0; i < hd.length; i++) hd[i] = Math.random() * 2 - 1;
  const ns = ctx.createBufferSource(), ng = ctx.createGain();
  ns.buffer = hiss; ns.loop = true; ng.gain.value = 0;
  ns.connect(ng); ng.connect(analyser); ns.start();
  window.testSound = v => g.gain.setTargetAtTime(v, ctx.currentTime, 0.01);
  window.testNoise = v => ng.gain.setTargetAtTime(v, ctx.currentTime, 0.01);
  raw = new Float32Array(analyser.fftSize);
  state.listening = true;
  state.noiseFloor = 0.00001;
  $("overlay").hidden = true;
  $("micDot").classList.add("on");
  $("micText").textContent = "בדיקה";
}

function fail(message) {
  state.listening = false;
  $("overlay").hidden = false;
  $("overlayText").textContent = message;
  $("startBtn").textContent = "לנסות שוב";
  $("micDot").classList.remove("on");
  $("micText").textContent = "ללא מיקרופון";
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null;
  state.listening = false;
  $("micDot").classList.remove("on");
}
addEventListener("pagehide", stopMic);
document.addEventListener("visibilitychange", () => { if (document.hidden) stopMic(); });

/* ---------- Is a note sounding? ---------- */

function analyse() {
  if (!state.listening || !analyser) return;
  analyser.getFloatTimeDomainData(raw);

  let sum = 0;
  for (let i = 0; i < raw.length; i++) sum += raw[i] * raw[i];
  state.rms = Math.sqrt(sum / raw.length);
  // A real microphone in a room is never exactly silent: say so instead of waiting forever.
  if (state.rms === 0 && micStream) {
    if (!state.zeroSince) state.zeroSince = performance.now();
    else if (performance.now() - state.zeroSince > 3000) $("micText").textContent = "אין קול מהמיקרופון";
  } else if (state.zeroSince) { state.zeroSince = 0; $("micText").textContent = "מקשיב"; }

  const now = performance.now(), muted = now < state.muteUntil;
  const gate = Math.max(state.noiseFloor * Math.pow(10, GATE_DB / 20), 0.0015);
  const holdGate = Math.max(state.noiseFloor * Math.pow(10, HOLD_DB / 20), 0.001);

  // Only a tone counts (a clear pitch), so talk, claps, chairs and breathing into the mic do not.
  let got = null;
  if (!muted && state.rms > holdGate) {
    // Decimate to about 8 kHz: cheaper, and the averaging removes the breath noise that ruins detection.
    const sr = ctx.sampleRate, D = Math.max(1, Math.round(sr / 8000)), n = Math.floor(raw.length / D), sr2 = sr / D;
    if (!deci || deci.length !== n) deci = new Float32Array(n);
    for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < D; j++) s += raw[i * D + j]; deci[i] = s / D; }
    got = detect(deci, sr2, F_LO, F_HI);
    if (got && got.clarity < 0.6) got = null;
  }
  state.freq = got ? got.freq : 0;
  state.clarity = got ? got.clarity : 0;

  if (!state.soundOn) {
    // A new note: loud enough and steady in pitch for ONSET_MS.
    if (got && state.rms > gate) {
      if (!state.onsetSince) { state.onsetSince = now; state.onsetPitches = []; }
      state.onsetPitches.push(1200 * Math.log2(got.freq / 440));
      const spread = Math.max(...state.onsetPitches) - Math.min(...state.onsetPitches);
      if (spread > ONSET_SPREAD) { state.onsetSince = now; state.onsetPitches = [state.onsetPitches.pop()]; }
      else if (now - state.onsetSince >= ONSET_MS) {
        state.soundOn = true; state.lastHeard = now; state.onsetSince = 0;
        bump();
      }
    } else state.onsetSince = 0;
  } else if (got || muted) state.lastHeard = now;       // our own chime is not the note ending
  else if (now - state.lastHeard > GAP_MS) state.soundOn = false;

  // The room's noise floor follows the quietest recent level (iPad volume control moves it around),
  // but never while a note is sounding: a long tone would otherwise slowly become "background".
  if (state.rms < state.noiseFloor) state.noiseFloor = state.rms * 0.2 + state.noiseFloor * 0.8;
  else if (!state.soundOn && !got) state.noiseFloor = state.noiseFloor * 0.999 + state.rms * 0.001;
}

// McLeod-style pitch: the first strong peak of the normalised autocorrelation.
function detect(buf, sampleRate, fMin, fMax) {
  const n = buf.length;
  const minLag = Math.max(2, Math.floor(sampleRate / fMax));
  const maxLag = Math.min(Math.floor(sampleRate / fMin), n - 2);
  if (maxLag <= minLag) return null;
  const nsdf = new Float32Array(maxLag + 2);
  let peak = 0;
  for (let lag = minLag; lag <= maxLag; lag++) {
    let ac = 0, m = 0;
    for (let i = 0, end = n - lag; i < end; i++) { const a = buf[i], b = buf[i + lag]; ac += a * b; m += a * a + b * b; }
    const v = m > 0 ? (2 * ac) / m : 0;
    nsdf[lag] = v;
    if (v > peak) peak = v;
  }
  if (peak < 0.4) return null;
  const threshold = peak * 0.9;
  for (let lag = minLag + 1; lag < maxLag; lag++) {

    if (!s.soundOn) setPhase("rest");
    else {
      s.a = Math.min(goal, s.a + dt);
      // Passing a place: a small cheer on the way, a big one at the level's end.
      for (const c of scene.checks) if (!c.passed && s.a >= c.t) {
        c.passed = true;
        s.flightBest = Math.max(s.flightBest, c.t);
        s.turnBest = Math.max(s.turnBest, c.t);
        if (c.t === goal) { setPhase("won"); chime(4); [0, 350, 700].forEach((ms, i) => setTimeout(() => burst(c.x + [0, -140, 140][i], CRUISE_Y - NOSE + [0, 60, 60][i]), ms)); }
        else if (c.t % 20 === 0) { chime(4); [0, 300, 600].forEach((ms, i) => setTimeout(() => burst(c.x + [0, -120, 120][i] - (i ? 200 : 0), CRUISE_Y - NOSE + [0, 40, 40][i]), ms)); }
        else { chime(2); burst(c.x, c.y + camera()); }
      }
    }
  } else if (s.phase === "rest" || s.phase === "home") {
    if (s.phase === "rest" && s.soundOn) setPhase("play");
    else if (s.phase === "home" || s.phaseT > PAUSE_S) {
      s.a = Math.max(0, s.a - dt * Math.max(s.phase === "home" ? 4 : 2.5, s.a * 0.7));
      if (s.a === 0) { setPhase("idle"); s.flightBest = 0; scene.checks.forEach(c => { c.passed = false; }); }
    }
  } else if (s.phase === "won") {
    if (s.phaseT >= WON_MIN_S && s.quietT >= 1) setPhase("home");
  }
}

function draw(dt) {
  state.smoothRms += (state.rms - state.smoothRms) * Math.min(1, dt * 12);
  const s = state, t = performance.now() / 1000, goal = LEVELS[s.level - 1];
  const loud = s.soundOn && s.phase !== "home" ? Math.max(0.01, Math.min(1, s.smoothRms / 0.08)) : 0;
  const flying = s.phase === "play";

  // The sky darkens slowly with height: day, deeper blue, dusk, night.
  const night = (s.a - 2) / 4;
  [2, 3, 4].forEach(n => { $("sky" + n).style.opacity = clamp01(night - (n - 2)).toFixed(2); });
  [[5, 26], [6, 44], [7, 62]].forEach(([n, from]) => { $("sky" + n).style.opacity = clamp01((s.a - from) / 6).toFixed(2); });

  const cam = camera();
  scene.world.setAttribute("transform", `translate(0 ${cam.toFixed(1)})`);
  // Far stars come out after dusk and drift down slower than the world, wrapping round.
  const glow = clamp01((s.a - 7) / 4);
  [...scene.sky.children].forEach((c, i) => {
    c.setAttribute("cy", (((SKY[i].y + cam * 0.2) % 640) - 10).toFixed(1));
    c.setAttribute("opacity", (glow * 0.85).toFixed(2));
  });

  const y = Math.max(CRUISE_Y, PAD_Y - s.a * SPEED), shake = loud > 0 && flying ? Math.sin(t * 60) * 1.5 : 0;
  const tilt = s.phase === "won" ? Math.sin(t * 5) * 4 : 0;                     // a little happy wiggle
  scene.rocket.setAttribute("transform", `translate(${(RX + shake).toFixed(1)} ${y.toFixed(1)}) rotate(${tilt.toFixed(2)}) scale(.8)`);
  const k = loud > 0 ? 0.55 + 0.7 * Math.min(1, loud * 1.5) + Math.sin(t * 40) * 0.08 : 0;
  scene.flame.setAttribute("transform", `scale(1 ${k.toFixed(3)})`);
  scene.flame.setAttribute("opacity", k > 0 ? 1 : 0);
  scene.chute.setAttribute("opacity", (s.phase === "rest" || s.phase === "home") && s.a > 0.1 ? 1 : 0);

  // Smoke puffs while the engine runs; once flying they stream away down the screen.
  if (loud > 0 && t - scene.lastPuff > 0.09) {
    scene.lastPuff = t;
    scene.puffs.push({ n: el("circle", { r: 10, fill: "#fff", opacity: .8 }, scene.puffLayer), x: RX + (Math.random() - .5) * 20, y: y + 30, vx: (Math.random() - .5) * 60, vy: cam > 0 && flying ? 40 + SPEED : 40, born: t });
  }
  scene.puffs = scene.puffs.filter(f => {
    const a = t - f.born;
    if (a > 1.2) { f.n.remove(); return false; }
    f.n.setAttribute("cx", (f.x + f.vx * a).toFixed(1));
    f.n.setAttribute("cy", (f.y + f.vy * a).toFixed(1));
    f.n.setAttribute("r", (10 + 26 * a).toFixed(1));
    f.n.setAttribute("opacity", (0.8 * (1 - a / 1.2)).toFixed(2));
    return true;
  });

  // Sights and places come alive only while on screen.
  for (const o of scene.things.concat(scene.checks)) {
    const sy = o.y + cam;
    if (sy < -250 || sy > 900) continue;
    if (o.mouth) o.mouth.setAttribute("d", o.passed ? "M -20 12 Q 0 34 20 12" : "M -12 18 L 12 18");
    if (o.wing) o.wing.setAttribute("transform", `rotate(${(Math.sin(t * 9 + o.x) * 25).toFixed(1)})`);
    if (o.spin) o.spin.setAttribute("transform", `rotate(${((o.kind === "satellite" || o.kind === "astronaut" ? Math.sin(t * .8) * 14 : t * (o.passed ? 40 : 8)) % 360).toFixed(1)})`);
    if (o.kind === "plane" || o.kind === "ufo" || o.kind === "whale" || o.kind === "friend" || o.kind === "station") o.g.setAttribute("transform", `translate(${(o.x + Math.sin(t * .5) * 40).toFixed(1)} ${(o.y + Math.sin(t * 1.3) * 6).toFixed(1)})`);
  }

  // Seconds stars: lit up to where the rocket is.
  scene.lamps.forEach((lamp, i) => {
    const lit = s.a >= i + 1 - 1e-6;
    lamp.setAttribute("fill", lit ? "#f2b705" : "none");
    lamp.setAttribute("stroke", lit ? "#e09b00" : s.a > 8 ? "#c7cfe8" : "#8aa0b8");
  });

  if (goal === Infinity) {
    if (s.phase === "play") s.bestSeconds = Math.max(s.bestSeconds, s.a);
    const shown = s.phase === "play" || s.phase === "rest" ? s.a : s.bestSeconds;
    scene.seconds.textContent = shown > 0 ? Math.floor(shown) + "″" : "";
    scene.seconds.setAttribute("opacity", s.phase === "play" || s.phase === "idle" ? 1 : 0.6);
  }

  // Endless: the places this child reached this turn stay in the top corner until the next turn.
  if (goal === Infinity && scene.trophyCount !== s.turnBest) {
    scene.trophyCount = s.turnBest;
    scene.trophies.textContent = "";
    const got = CHECKS.filter(c => c.t <= s.turnBest).slice(-10);     // the latest ten fit beside the seconds
    got.forEach((c, i) => {
      const tr = thing(scene.trophies, c.kind, 44 + i * 64, 44, 0.42, c.variant || 0);
      if (tr.mouth) tr.mouth.setAttribute("d", "M -20 12 Q 0 34 20 12");
    });
  }
}

// A short rising chord for a place passed (2 notes) or the level's end (4). The detector is muted meanwhile.
function chime(notes) {
  const c = ensureCtx(), t0 = c.currentTime + 0.03;
  [523.25, 659.25, 783.99, 1046.5].slice(4 - notes).forEach((hz, i) => {
    const o = c.createOscillator(), g = c.createGain(), t = t0 + i * 0.11;
    o.type = "triangle"; o.frequency.value = hz;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.75);
  });
  state.muteUntil = performance.now() + 500 + notes * 220;
}

function burst(x, y) {
  const svg = $("scene");
  const colours = ["#f2b705", "#ff6f59", "#1a7fe2", "#2fa36b", "#7a5cf0"];
  for (let i = 0; i < 14; i++) {
    const a = (Math.PI * 2 * i) / 14, d = 90 + Math.random() * 70;
    const c = el("circle", { cx: x, cy: y, r: 9 + Math.random() * 8, fill: colours[i % colours.length] }, svg);
    const t0 = performance.now();
    (function fly(now) {
      const p = (now - t0) / 900;
      if (p >= 1) { c.remove(); return; }
      c.setAttribute("cx", x + Math.cos(a) * d * p);
      c.setAttribute("cy", y + Math.sin(a) * d * p + 60 * p * p);
      c.setAttribute("opacity", 1 - p);
      requestAnimationFrame(fly);
    })(t0);
  }
}

function bump() {
  state.counter++;
  $("counter").textContent = state.counter;
}

/* ---------- Screen ---------- */

function setLevel(n) {
  state.level = n;
  state.a = 0; state.flightBest = 0; state.turnBest = 0; state.bestSeconds = 0; setPhase("idle");
  LEVELS.forEach((_, i) => $("lv" + (i + 1)).setAttribute("aria-pressed", String(i + 1 === n)));
  try { localStorage.setItem("sound-game", JSON.stringify({ level: n })); } catch (_) {}
  buildScene();
}

function setTurns(n) {
  const box = $("turns");
  box.textContent = "";
  for (let i = 0; i < n; i++) box.appendChild(Object.assign(document.createElement("span"), { className: "turn" + (i === state.turn ? " on" : "") }));
}

function nextTurn() {
  state.turn = (state.turn + 1) % state.turns;
  state.a = 0; state.flightBest = 0; state.turnBest = 0; state.bestSeconds = 0; setPhase("idle");
  buildScene();
  setTurns(state.turns);
}

function toggleFullscreen() {
  const d = document, root = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root); if (p && p.catch) p.catch(() => {}); }
  } catch (_) {}
}

/* ---------- Loop ---------- */

let last = 0;
let paused = false;
// Pause (Esc or ⏸): the game freezes where it is; Esc, Space or a tap carries on.
function setPaused(p) {
  paused = p;
  $("pauseBox").hidden = !p;
  if (!p) { last = 0; state.soundOn = false; }
}
function frame(now) {
  if (paused) { requestAnimationFrame(frame); return; }
  const dt = Math.min(0.05, (now - (last || now)) / 1000);
  last = now;
  if (now - state.lastAnalyse > ANALYSE_MS) { state.lastAnalyse = now; analyse(); }
  update(dt);
  draw(dt);
  if (!$("diag").hidden) {
    const db = 20 * Math.log10(Math.max(state.rms, 1e-7));
    const bars = Math.max(0, Math.min(10, Math.round((db + 60) / 4.5)));
    $("diag").textContent = audioLine() + `בדיקת מיקרופון (D)\n` +
      `עוצמה  ${"█".repeat(bars)}${"·".repeat(10 - bars)}\n` +
      `צליל   ${state.freq ? state.freq.toFixed(0) + " Hz" : "—"}\n` +
      `רצפה   ${(20 * Math.log10(Math.max(state.noiseFloor, 1e-7))).toFixed(0)} dB · ${state.soundOn ? "צליל" : "שקט"} · ${state.phase}\n` +
      `v10`;
  }
  requestAnimationFrame(frame);
}

/* ---------- Wiring ---------- */

LEVELS.forEach((_, i) => $("lv" + (i + 1)).addEventListener("click", () => setLevel(i + 1)));
$("startBtn").addEventListener("click", startMic);
$("overlay").addEventListener("click", e => { if (e.target === $("overlay") || e.target.tagName === "P" || e.target.tagName === "DIV") startMic(); });  // the whole start screen is the button
$("pauseBtn").addEventListener("click", () => setPaused(!paused));
$("pauseBox").addEventListener("click", e => { e.stopPropagation(); setPaused(false); });
$("fullscreen").addEventListener("click", toggleFullscreen);
document.addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail) b.blur(); });

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t.tagName === "BUTTON" || t.tagName === "INPUT") return;
  const c = e.code;
  if (c === "Escape") { setPaused(!paused); return; }
  if (paused) { if (c === "Space" || c === "Enter") { e.preventDefault(); setPaused(false); } return; }
  if (c === "Space" || c === "Enter" || c === "PageDown" || c === "ArrowRight") { e.preventDefault(); nextTurn(); }
  else if (/^Digit[1-5]$/.test(c)) setLevel(+c.slice(5));
  else if (c === "KeyR") { state.noiseFloor = 0.002; }
  else if (c === "KeyD") $("diag").hidden = !$("diag").hidden;
  else if (c === "KeyF") toggleFullscreen();
});

const params = new URLSearchParams(location.search);
let level = 1;
try { const saved = JSON.parse(localStorage.getItem("sound-game") || "{}"); if (LEVELS[saved.level - 1] !== undefined) level = saved.level; } catch (_) {}
if (/^[1-5]$/.test(params.get("level") || "")) level = +params.get("level");
if (params.get("diag") === "1") $("diag").hidden = false;

if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) || matchMedia("(display-mode: standalone)").matches) $("fullscreen").hidden = true;
if (location.protocol === "file:") fail("המשחק עם המיקרופון עובד רק דרך הקישור באינטרנט");
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

setLevel(level);
setTurns(state.turns);
requestAnimationFrame(frame);
</script>
</body>
</html>
