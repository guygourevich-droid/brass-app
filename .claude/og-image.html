<!doctype html>
<!-- Source of icons/og.png, the picture WhatsApp/Facebook show when someone shares tonebee.app.
     Not published (.claude is in .assetsignore). After a logo or wording change, from the repo root:
     chrome --headless --hide-scrollbars --window-size=1200,630 --screenshot=icons/og.png .claude/og-image.html -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Rubik", system-ui, sans-serif; color: #1F2A44;
    background: #FFF8EC;
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 56px; padding: 0 90px; box-sizing: border-box;
  }
  h1 { margin: 0; font-size: 132px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
  h1 small { display: block; text-align: right; margin-top: 12px; font-family: "Lexend", sans-serif; font-size: 48px; font-weight: 700; letter-spacing: 0; }
  .bee { color: #F2B33D; }  /* brand wordmark: tone/טון in ink, bee/בי in honey */
  p { margin: 30px 0 34px; font-size: 40px; line-height: 1.3; color: #3b4660; max-width: 16em; }
  .insts { display: flex; gap: 18px; }
  .insts img { width: 108px; height: 108px; }
  .logo { width: 330px; height: 330px; border-radius: 22%; box-shadow: 0 18px 40px rgba(31, 42, 68, .22); }
</style>
</head>
<body>
  <div>
    <h1>טון<span class="bee">בי</span><small dir="ltr">tone<span class="bee">bee</span></small></h1>
    <p>משחקים לשיעורי חצוצרה, טרומבון וקרן למתחילים</p>
    <div class="insts">
      <img src="../icons/inst/trumpet.png" alt="">
      <img src="../icons/inst/trombone.png" alt="">
      <img src="../icons/inst/horn.png" alt="">
    </div>
  </div>
  <img class="logo" src="../icons/icon-512.png" alt="">
</body>
</html>
