<style>
  :root {
    --paper: #ffffff;
    --ink: #15181d;
    --ink-2: #3b434e;
    --muted: #66707d;
    --line: #e1e7ef;
    --blue: #1a7fe2;
    --brass-deep: #8f5b0e;
    --honey: #f2b33d;
    --cream: #fff8ec;
    --font: "Rubik", "Lexend", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--paper); color: var(--ink); }
  body { margin: 0; font-family: var(--font); font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  a { color: var(--blue); }

  .wrap { max-width: 720px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 48px); padding-block: clamp(20px, 5vh, 48px) 48px; }
  .home { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--ink-2); text-decoration: none; font-weight: 700; font-size: 18px; }
  .home img { width: 40px; height: 40px; border-radius: 22%; }
  .home:hover { color: var(--blue); }

  h1 { margin: 18px 0 2px; font-size: clamp(30px, 5vw, 40px); line-height: 1.1; font-weight: 700; }
  .updated { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
  .intro { margin: 0 0 22px; color: var(--ink-2); }

  /* The whole page in four lines, for the parent who reads only this. */
  .short { background: var(--cream); border: 2px solid #f6dca6; border-inline-start: 6px solid var(--honey); border-radius: 16px; padding: 14px 20px; margin: 0 0 30px; }
  .short h2 { margin: 0 0 6px; font-size: 15px; letter-spacing: .06em; color: var(--brass-deep); }
  .short ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }

  section { border-top: 1px solid var(--line); padding-block: 18px 6px; }
  section h2 { margin: 0 0 6px; font-size: 21px; font-weight: 700; }
  section p { margin: 0 0 12px; }
  .ltr { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .home img { width: 34px; height: 34px; }
    .short { padding: 12px 14px; }
    section h2 { font-size: 19px; }
  }
</style>
